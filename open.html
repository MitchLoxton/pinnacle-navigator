<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navigator">
<title>Pinnacle Navigator · v53.72</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f2;color:#0d1720}body{min-height:100dvh;display:grid;place-items:center;padding:18px;border-top:4px solid #102534}.card{width:min(620px,100%);overflow:hidden;border:1px solid #e1e7e4;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(16,37,52,.10)}.top{padding:28px;background:#102534;color:#fff;border-top:3px solid #d2a63d}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#b8c7cf}.top h1{margin:10px 0 8px;font-size:39px;line-height:1;letter-spacing:-.05em}.top p{margin:0;color:#cbd6db;font-size:13px;line-height:1.5}.body{padding:24px 28px}.row{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid #e1e7e4;border-radius:14px;background:#fafbf9;font-size:13px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:#d2a63d;box-shadow:0 0 0 5px rgba(210,166,61,.14)}.bar{height:7px;margin:17px 0 10px;border-radius:99px;background:#eceeea;overflow:hidden}.bar>div{height:100%;width:62%;border-radius:99px;background:#d2a63d;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{width:100%}}.small{font-size:11px;color:#6d767d;line-height:1.45}.retry{display:none;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:13px;background:#102534;color:#fff;font-weight:900;font-size:14px;cursor:pointer}@media(max-width:620px){body{padding:10px}.top,.body{padding:20px 17px}.top h1{font-size:33px}.card{border-radius:18px}}
</style>
</head>
<body>
<main class="card"><section class="top"><div class="eyebrow">PINNACLE NAVIGATOR · v53.72</div><h1>Opening your workshop.</h1><p>Location-first task guides are now built into Navigator so each job is easier to understand on the real truck.</p></section><section class="body"><div class="row"><span class="dot"></span><span id="status">Preparing Navigator…</span></div><div class="bar"><div></div></div><div class="small" id="small">One permanent link. No password, repair page or second setup link.</div><button class="retry" id="retry" type="button">TRY AGAIN</button></section></main>
<script>
(function(){'use strict';
const ACCESS='005562';
const BUILD='5379';
const VERSION='v53.72';
const PROJECT='mundi-pos1';
const PRIMARY='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell='+BUILD;
const SAFE='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const PUBLIC_KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PRIVATE_CACHE='pn-private-bundle-canonical';
const PRIVATE_URL=new URL('./.private-navigator-canonical',location.href).href;
const status=document.getElementById('status'),small=document.getElementById('small'),retry=document.getElementById('retry');
function validBundle(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>')&&!/PN-LAUNCHER-\d+/.test(s);}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function augment(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*workshop-ui-v2\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*workshop-ui-fast\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*workshop-ui\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*runtime-late\.js[^"']*["'][^>]*><\/script>/gi,'');html=before(html,'</head>','<script src="./workshop-ui-fast.js?v='+BUILD+'"><\/script><!-- PN-NOVA-'+BUILD+' -->');html=before(html,'</body>','<script src="./runtime-late.js?v='+BUILD+'"><\/script><!-- PN-LATE-'+BUILD+' -->');return html;}
function launch(html){document.open();document.write(html);document.close();}
async function saveBundle(html){try{if(!('caches'in window)||!validBundle(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE,...names.filter(n=>n.startsWith('pn-private-bundle-')&&n!==PRIVATE_CACHE).sort().reverse()],seen=new Set();for(const name of order){if(seen.has(name))continue;seen.add(name);const c=await caches.open(name);const keys=name===PRIVATE_CACHE?[PRIVATE_URL,...await c.keys()]:await c.keys();for(let i=keys.length-1;i>=0;i--){try{const r=await c.match(keys[i]);if(!r)continue;const raw=await r.text();if(validBundle(raw)){const html=augment(raw);saveBundle(html);return html;}}catch(e){}}}return null;}catch(e){return null;}}
async function fetchRoute(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','apikey':PUBLIC_KEY,'x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:ACCESS}),signal:controller.signal,cache:'no-store'});if(r.status===401||r.status===403)throw new Error('access rejected');if(!r.ok)throw new Error('server '+r.status);const raw=await r.text();if(!validBundle(raw))throw new Error('invalid bundle');return augment(raw);}finally{clearTimeout(timer)}}
async function fetchLive(){let last=null;for(const url of [PRIMARY,SAFE]){try{return await fetchRoute(url,10000)}catch(e){last=e}}throw last||new Error('workshop unavailable')}
async function boot(){retry.style.display='none';status.textContent='Opening Pinnacle Navigator…';try{localStorage.setItem('pn_live_pin',ACCESS);if(!localStorage.getItem('pn_live_person'))localStorage.setItem('pn_live_person','me');localStorage.setItem('pn_live_version',VERSION);}catch(e){}
try{const html=await fetchLive();await saveBundle(html);launch(html);return;}catch(e){status.textContent='Using the saved workshop copy…';const cached=await readBundle();if(cached){launch(cached);return;}status.textContent='Couldn’t reach the workshop yet.';small.textContent='Keep this same link. Tap TRY AGAIN when your connection is available.';retry.style.display='block';}}
retry.addEventListener('click',boot);
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}boot();
})();
</script>
</body>
