<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102534">
<title>Opening Pinnacle Navigator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f2;color:#0d1720}body{min-height:100dvh;display:grid;place-items:center;padding:18px;border-top:4px solid #102534}.card{width:min(620px,100%);overflow:hidden;border:1px solid #e1e7e4;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(16,37,52,.10)}.top{padding:28px;background:#102534;color:#fff;border-top:3px solid #d2a63d}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#b8c7cf}.top h1{margin:10px 0 8px;font-size:39px;line-height:1;letter-spacing:-.05em}.top p{margin:0;color:#cbd6db;font-size:13px;line-height:1.5}.body{padding:24px 28px}.row{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid #e1e7e4;border-radius:14px;background:#fafbf9;font-size:13px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:#d2a63d;box-shadow:0 0 0 5px rgba(210,166,61,.14)}.bar{height:7px;margin:17px 0 10px;border-radius:99px;background:#eceeea;overflow:hidden}.bar>div{height:100%;width:65%;border-radius:99px;background:#d2a63d;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{width:100%}}.small{font-size:11px;color:#6d767d;line-height:1.45}@media(max-width:620px){body{padding:10px}.top,.body{padding:20px 17px}.top h1{font-size:33px}.card{border-radius:18px}}
</style>
</head>
<body>
<main class="card"><section class="top"><div class="eyebrow">PINNACLE NAVIGATOR</div><h1>Opening your workshop.</h1><p>This is the permanent one-tap entry link.</p></section><section class="body"><div class="row"><span class="dot"></span><span id="status">Preparing Navigator…</span></div><div class="bar"><div></div></div><div class="small">No password or second setup page is required.</div></section></main>
<script>
(async function(){
  const ACCESS='005562';
  const BUILD='5375';
  const status=document.getElementById('status');
  try{
    localStorage.setItem('pn_live_pin',ACCESS);
    if(!localStorage.getItem('pn_live_person')) localStorage.setItem('pn_live_person','me');
    localStorage.setItem('pn_live_version','v53.68');
  }catch(e){}
  status.textContent='Refreshing the app shell…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>{try{return new URL(r.scope).pathname.startsWith('/pinnacle-navigator/')}catch(e){return false}}).map(r=>r.unregister()));
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.filter(n=>n.startsWith('pn-shell-')||n.startsWith('pn-remote-modules-')).map(n=>caches.delete(n)));
    }
  }catch(e){}
  status.textContent='Opening Pinnacle Navigator…';
  location.replace('./?pn-refresh='+BUILD+'&crew='+(localStorage.getItem('pn_live_person')||'me')+'&t='+Date.now());
})();
</script>
</body>
</html>
