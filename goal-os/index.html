<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060907"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Goal OS"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Goal OS</title><style>html,body{margin:0;width:100%;height:100%;background:#060907;overflow:hidden}iframe{display:block;border:0;width:100%;height:100dvh;background:#060907}</style></head><body><iframe id="goalApp" src="../goal-os-v26/" title="Goal OS"></iframe><script>(()=>{const frame=document.getElementById('goalApp');let tries=0;function patch(){tries++;try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.ds||!w.tasks||!w.render||!d.getElementById('queue')){if(tries<80)setTimeout(patch,150);return}if(w.__goalOsSafeUndo)return;w.__goalOsSafeUndo=true;const style=d.createElement('style');style.textContent='.completedSafe{margin-top:12px;padding:13px 15px}.completedSafeTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.completedSafeTop b{font-size:12px}.completedSafeTop span{font-size:10px;color:var(--muted)}.completedSafeList{display:grid;gap:7px;margin-top:9px}.completedSafeItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:12px;background:#0a0f0c;border:1px solid var(--line)}.completedSafeItem span{font-size:11px;color:#dce5da}.undoSafe{border:1px solid #455049;background:#101611;color:var(--lime);border-radius:9px;padding:6px 9px;font-size:10px;font-weight:900;cursor:pointer}';d.head.appendChild(style);const actions=d.querySelector('.hero .actions');if(actions&&!d.getElementById('undoLastSafe')){const done=[...actions.querySelectorAll('button')].find(b=>b.textContent.trim()==='Done');if(done)done.insertAdjacentHTML('afterend','<button class="btn ghost" id="undoLastSafe" onclick="undoLastSafe()" style="display:none">Undo last</button>')}const q=d.getElementById('queue');if(q&&!d.getElementById('completedSafeWrap'))q.insertAdjacentHTML('afterend','<section class="card completedSafe" id="completedSafeWrap" style="display:none"><div class="completedSafeTop"><b>Completed today</b><span>Accidental tap? Undo it here.</span></div><div class="completedSafeList" id="completedSafeList"></div></section>');const origRender=w.render,origDone=w.doneCurrent,origToggle=w.toggle;function foodTarget(){const t=w.tasks().find(x=>x.id==='food');const m=t&&t.title.match(/\/(\d+)/);return m?+m[1]:4}function remember(id){const x=w.ds();x.lastAction={id,done:{...(x.done||{})},mealCount:+x.mealCount||0,moneyActions:+x.moneyActions||0,ts:Date.now()};w.save()}function completed(){const x=w.ds(),out=[],ft=foodTarget(),mt=w.moneySpec()[1];if((+x.mealCount||0)>0)out.push({id:'food',label:`Meals logged · ${x.mealCount}/${ft}`});if((+x.moneyActions||0)>0)out.push({id:'revenue',label:`Revenue asks · ${x.moneyActions}/${mt}`});w.tasks().forEach(t=>{if(!['food','revenue'].includes(t.id)&&x.done&&x.done[t.id])out.push({id:t.id,label:t.title})});return out}function updateUI(){const x=w.ds(),items=completed(),wrap=d.getElementById('completedSafeWrap'),list=d.getElementById('completedSafeList'),ub=d.getElementById('undoLastSafe');if(ub)ub.style.display=x.lastAction?'inline-block':'none';if(wrap)wrap.style.display=items.length?'block':'none';if(list)list.innerHTML=items.map(i=>`<div class="completedSafeItem"><span>✓ ${i.label}</span><button class="undoSafe" onclick="undoItemSafe('${i.id}')">Undo</button></div>`).join('')}w.undoLastSafe=function(){const x=w.ds(),a=x.lastAction;if(!a){w.toast('Nothing recent to undo. Use Completed today below.');return}x.done={...(a.done||{})};x.mealCount=+a.mealCount||0;x.moneyActions=+a.moneyActions||0;x.lastAction=null;w.save();origRender();updateUI();w.toast('Undone. You are back where you were.')};w.undoItemSafe=function(id){const x=w.ds();if(id==='food'){x.mealCount=Math.max(0,(+x.mealCount||0)-1);x.done.food=false}else if(id==='revenue'){x.moneyActions=Math.max(0,(+x.moneyActions||0)-1);x.done.revenue=false}else{x.done[id]=false}x.lastAction=null;w.save();origRender();updateUI();w.toast('Undone.')};w.doneCurrent=function(){const t=w.selected();if(t&&t.id!=='reset')remember(t.id);origDone();updateUI()};w.toggle=function(id){remember(id);const x=w.ds();if(id==='food'){const target=foodTarget();x.mealCount=Math.min(target,(+x.mealCount||0)+1);if(x.mealCount>=target)x.done.food=true;w.save();origRender();updateUI();w.toast(`Meal ${x.mealCount}/${target} logged. Undo is available.`);return}if(id==='revenue'){const target=w.moneySpec()[1];x.moneyActions=Math.min(target,(+x.moneyActions||0)+1);if(x.moneyActions>=target)x.done.revenue=true;w.save();origRender();updateUI();w.toast(`Revenue action ${x.moneyActions}/${target} logged. Undo is available.`);return}origToggle(id);updateUI()};w.render=function(){origRender();updateUI()};updateUI()}catch(e){if(tries<80)setTimeout(patch,150)}}frame.addEventListener('load',()=>{tries=0;setTimeout(patch,120)});patch()})();</script><script>if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
