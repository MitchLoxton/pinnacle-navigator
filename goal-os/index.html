<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060907"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Goal OS"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Goal OS</title><style>html,body{margin:0;background:#060907;color:#f4f7f3;font-family:system-ui}#l{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}b{color:#d8ff4f}button{font:inherit;border:1px solid #344137;background:#111813;color:#d8ff4f;border-radius:12px;padding:10px 14px;font-weight:800}</style></head><body><div id="l"><div><b>Opening Goal OS V31…</b><p>Loading Gym Coach + Woolworths Shop.</p></div></div><script>(async()=>{const box=document.getElementById('l');try{const fs=['v29-b1a.txt','v29-b1b.txt','v29-b2.txt','v29-b3.txt','v29-b4a.txt','v29-b4b.txt','v29-b5.txt','v29-b6.txt','v29-b7.txt'];const ps=await Promise.all(fs.map(f=>fetch(f+'?v=31woolies',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=ps.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=new TextDecoder().decode(bytes);if(!html.includes('V29 GYM COACH'))throw new Error('Invalid build');html=html.replace('</body>','<script src="grocery-patch.js?v=31woolies"><\/script></body>');document.open();document.write(html);document.close()}catch(e){box.innerHTML='<div><b>Goal OS could not open.</b><p>Tap retry.</p><button onclick="location.reload()">Retry</button></div>'}})();</script></body></html>
