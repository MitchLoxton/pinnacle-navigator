<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pinnacle Navigator</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#111;--muted:#676762;--line:#ddd;--red:#9f2626;--green:#176b3b;--greenbg:#eaf6ed}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{max-width:680px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center}.label{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}h1{font-size:29px;line-height:1.05;margin:8px 0}.intro{font-size:15px;color:var(--muted);line-height:1.45;margin:0 auto 18px;max-width:520px}.pinLabel{display:block;text-align:left;font-size:12px;font-weight:900;color:var(--muted);max-width:360px;margin:auto}.pin{display:block;width:100%;max-width:360px;margin:6px auto 14px;border:2px solid #bbb;border-radius:13px;padding:15px;font-size:24px;letter-spacing:.18em;text-align:center;background:#fff}.names{display:grid;gap:11px}.person{width:100%;min-height:76px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;font-size:22px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}.person:active{transform:scale(.99);background:#f1f1ee}.person:disabled{opacity:.55}.person small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.err{min-height:20px;margin-top:10px;font-size:12px;font-weight:900;color:var(--red)}.loading{padding:34px 10px}.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:18px auto;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;border:0;border-radius:12px;background:#111;color:#fff;min-height:54px;font-weight:900;font-size:16px;margin-top:12px}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}.offlineNote{background:var(--greenbg);color:var(--green);border-radius:12px;padding:10px;font-size:12px;font-weight:900;margin-top:12px}@media(max-width:520px){.app{padding:8px}.card{padding:14px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app"><div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · LIVE Shared Crew</div></div><div class="badge">WORKSHOP READY</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle';
const KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin';
const BUNDLE_CACHE='pn-private-bundle-v44',BUNDLE_CACHE_URL=new URL('./.private-navigator-v44',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'};const view=document.getElementById('view');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'';
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6);const valid=v=>/^[0-9]{6}$/.test(v);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(message=''){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR</div><h1>Who is using this phone?</h1><p class="intro">Enter the crew PIN, then tap your name. After a successful sign-in this device remembers you.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6 digits" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Same link on phone or computer. No file uploads or separate desktop version.</div></section>`;view.querySelectorAll('[data-person]').forEach(btn=>btn.onclick=()=>{const p=clean(document.getElementById('crewPin').value);if(!valid(p)){document.getElementById('err').textContent='Enter all 6 PIN digits first.';return}pin=p;person=btn.dataset.person;openNavigator({fromTap:true});});}
function loading(message='Loading your live job.'){view.innerHTML=`<section class="card loading"><div class="label">PINNACLE NAVIGATOR</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">${esc(message)}</div></section>`;}
async function saveCachedBundle(html){try{if(!('caches' in window))return;const c=await caches.open(BUNDLE_CACHE);await c.put(BUNDLE_CACHE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':'v44'}}));}catch(e){console.warn('Bundle cache write failed',e)}}
async function readCachedBundle(){try{if(!('caches' in window))return null;const c=await caches.open(BUNDLE_CACHE);const r=await c.match(BUNDLE_CACHE_URL);return r?await r.text():null}catch(e){return null}}
function hardenHtml(html){
  let out=String(html||'');
  const swap=(a,b)=>{if(out.includes(a))out=out.replace(a,b)};
  out=out.replaceAll('LIVE v43 · CLARITY','LIVE v44 · WORKSHOP READY');
  swap("const LOCAL_BACKUP_KEY='pn_mundi_live_shared_backup';",`const LOCAL_BACKUP_KEY='pn_mundi_live_shared_backup';\nconst LOCAL_SYNC_BASE_KEY='pn_mundi_live_sync_base_v44';\nconst LOCAL_DIRTY_KEY='pn_mundi_live_dirty_v44';`);
  swap(`let remoteVersion=0;\nlet lastRemoteState=null;\nlet syncReady=false;\nlet applyingRemote=false;\nlet saveTimer=null;\nlet saveInFlight=false;\nlet saveQueued=false;`,`const persistedSyncBase=(()=>{try{const raw=safeStorage.getItem(LOCAL_SYNC_BASE_KEY);const x=raw?JSON.parse(raw):null;return x&&typeof x==='object'?x:null;}catch(e){return null;}})();\nlet remoteVersion=Number(persistedSyncBase?.version)||0;\nlet lastRemoteState=persistedSyncBase?.state&&typeof persistedSyncBase.state==='object'?persistedSyncBase.state:null;\nlet syncReady=false;\nlet applyingRemote=false;\nlet saveTimer=null;\nlet saveInFlight=false;\nlet saveQueued=safeStorage.getItem(LOCAL_DIRTY_KEY)==='1';`);
  swap(`function persistLocal(){\n  if(state.currentUser) safeStorage.setItem(DEVICE_PERSON_KEY,state.currentUser); else safeStorage.removeItem(DEVICE_PERSON_KEY);\n  if(livePin) safeStorage.setItem(DEVICE_PIN_KEY,livePin); else safeStorage.removeItem(DEVICE_PIN_KEY);\n  safeStorage.setItem(LOCAL_BACKUP_KEY,JSON.stringify(state));\n}\n`,`function persistLocal(){\n  if(state.currentUser) safeStorage.setItem(DEVICE_PERSON_KEY,state.currentUser); else safeStorage.removeItem(DEVICE_PERSON_KEY);\n  if(livePin) safeStorage.setItem(DEVICE_PIN_KEY,livePin); else safeStorage.removeItem(DEVICE_PIN_KEY);\n  safeStorage.setItem(LOCAL_BACKUP_KEY,JSON.stringify(state));\n}\nfunction persistSyncBase(){\n  try{safeStorage.setItem(LOCAL_SYNC_BASE_KEY,JSON.stringify({version:remoteVersion,state:lastRemoteState}));}catch(e){}\n}\nfunction markLocalDirty(){safeStorage.setItem(LOCAL_DIRTY_KEY,'1');}\nfunction clearLocalDirty(){safeStorage.removeItem(LOCAL_DIRTY_KEY);}\n`);
  swap(`    lastRemoteState=JSON.parse(JSON.stringify(data.state||{}));\n    lastRemoteUpdateAt=data.updated_at||null;`,`    lastRemoteState=JSON.parse(JSON.stringify(data.state||{}));\n    persistSyncBase();\n    if(!saveQueued) clearLocalDirty();\n    lastRemoteUpdateAt=data.updated_at||null;`);
  swap(`function save(){\n  persistLocal();\n  if(applyingRemote || !livePin) return;`,`function save(){\n  persistLocal();\n  if(!applyingRemote) markLocalDirty();\n  if(applyingRemote || !livePin) return;`);
  swap(`    lastRemoteState=JSON.parse(JSON.stringify(data.state||local));\n    lastRemoteUpdateAt=data.updated_at||null;`,`    lastRemoteState=JSON.parse(JSON.stringify(data.state||local));\n    persistSyncBase();\n    if(!saveQueued) clearLocalDirty();\n    lastRemoteUpdateAt=data.updated_at||null;`);
  swap(`      lastRemoteState=JSON.parse(JSON.stringify(latest));\n      applyRemoteShared(merged);`,`      lastRemoteState=JSON.parse(JSON.stringify(latest));\n      persistSyncBase();\n      applyRemoteShared(merged);`);
  swap(`  lastRemoteState=JSON.parse(JSON.stringify(latest));\n  lastRemoteUpdateAt=data.updated_at||null;`,`  lastRemoteState=JSON.parse(JSON.stringify(latest));\n  persistSyncBase();\n  lastRemoteUpdateAt=data.updated_at||null;`);
  swap(`      await fetchRemoteState({render:false});\n      if(state.autoTeamFlow) autoFillTeam(true);\n      await flushRemoteSave();`,`      if(saveQueued){\n        await recoverOfflineChanges();\n        if(state.autoTeamFlow) autoFillTeam(true);\n        await flushRemoteSave();\n      }else{\n        await fetchRemoteState({render:false});\n        if(state.autoTeamFlow) autoFillTeam(true);\n        await flushRemoteSave();\n      }`);
  swap("showBootFailure('Navigator hit a phone-browser error. Nothing has been marked DONE. Reopen in Safari / the hosted Navigator link.');","try{console.warn('Navigator recovered from a browser error');setLiveStatus('bad','RECOVERED','Browser issue — progress kept safe');}catch(_){}");
  swap(`    }catch(err){\n      showIdentity();\n      const input=document.getElementById('crewPinInput'); if(input) input.value=livePin;\n      const el=document.getElementById('pinError'); if(el) el.textContent=err.status===401?'Crew PIN is no longer valid.':'Could not connect to the LIVE project from this viewer. The app itself is still running; try Safari / the hosted URL for shared sync.';\n    }`,`    }catch(err){\n      if(err.status===401){\n        showIdentity();\n        const input=document.getElementById('crewPinInput'); if(input) input.value=livePin;\n        const el=document.getElementById('pinError'); if(el) el.textContent='Crew PIN is no longer valid.';\n      }else{\n        syncReady=false;\n        setLiveStatus('bad','OFFLINE',\"Using this device's last saved workshop state\");\n        openPhoneHome();\n      }\n    }`);
  const workshopPatch=`<script>(function(){try{window.__PN_WORKSHOP_READY__=true;window.addEventListener('online',function(){try{resumeLiveSync();}catch(e){}});document.addEventListener('visibilitychange',function(){if(!document.hidden){try{resumeLiveSync();}catch(e){}}});}catch(e){console.warn('Workshop hardening patch',e)}})();<\/script>`;
  if(!out.includes('__PN_WORKSHOP_READY__'))out=out.replace('</body>',workshopPatch+'\n</body>');
  return out;
}
function launch(html){document.open();document.write(html);document.close();}
async function fetchBundle(){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{return await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal});}finally{clearTimeout(timer)}}
async function openNavigator({fromTap=false}={}){if(!person||!valid(pin)){login();return}loading();const previouslyValidated=localStorage.getItem(PIN_KEY)||'';try{const res=await fetchBundle();if(res.status===401){if(previouslyValidated===pin)localStorage.removeItem(PIN_KEY);pin='';login('Incorrect crew PIN.');return}if(!res.ok)throw new Error('HTTP '+res.status);let html=hardenHtml(await res.text());if(!html.toLowerCase().includes('<html')||!html.includes('Pinnacle Navigator'))throw new Error('Invalid bundle');localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);await saveCachedBundle(html);launch(html);}catch(e){const cached=await readCachedBundle();if(cached&&previouslyValidated&&previouslyValidated===pin){localStorage.setItem(PERSON_KEY,person);loading('Internet is unavailable — opening the last authenticated workshop copy. Changes will queue and sync when connection returns.');setTimeout(()=>launch(hardenHtml(cached)),120);return}showError('Could not connect to Navigator. Check internet and try again.');}}
function showError(message){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR</div><h1>Could not open</h1><p class="intro">${esc(message)}</p><button id="retry" class="retry">TRY AGAIN</button><div class="note">Your shared job state has not been reset or marked DONE.</div></section>`;document.getElementById('retry').onclick=()=>openNavigator();}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
