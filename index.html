<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pinnacle Navigator</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#111;--muted:#676762;--line:#ddd;--red:#9f2626}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{max-width:680px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center}.label{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}h1{font-size:29px;line-height:1.05;margin:8px 0}.intro{font-size:15px;color:var(--muted);line-height:1.45;margin:0 auto 18px;max-width:520px}.pinLabel{display:block;text-align:left;font-size:12px;font-weight:900;color:var(--muted);max-width:360px;margin:auto}.pin{display:block;width:100%;max-width:360px;margin:6px auto 14px;border:2px solid #bbb;border-radius:13px;padding:15px;font-size:24px;letter-spacing:.18em;text-align:center;background:#fff}.names{display:grid;gap:11px}.person{width:100%;min-height:76px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;font-size:22px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}.person:active{transform:scale(.99);background:#f1f1ee}.person small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.err{min-height:20px;margin-top:10px;font-size:12px;font-weight:900;color:var(--red)}.loading{padding:34px 10px}.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:18px auto;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;border:0;border-radius:12px;background:#111;color:#fff;min-height:54px;font-weight:900;font-size:16px;margin-top:12px}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}@media(max-width:520px){.app{padding:8px}.card{padding:14px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app"><div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · LIVE Shared Crew</div></div><div class="badge">PHONE EASY v42</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle';
const KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin';
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'};const view=document.getElementById('view');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'';
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6);const valid=v=>/^[0-9]{6}$/.test(v);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(message=''){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR</div><h1>Who is using this phone?</h1><p class="intro">Enter the crew PIN, then tap your name. This phone remembers you after that.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6 digits" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Use this webpage in Safari or Chrome. No file upload or app installation is required.</div></section>`;view.querySelectorAll('[data-person]').forEach(btn=>btn.onclick=()=>{const p=clean(document.getElementById('crewPin').value);if(!valid(p)){document.getElementById('err').textContent='Enter all 6 PIN digits first.';return}pin=p;person=btn.dataset.person;localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);openNavigator();});}
function loading(){view.innerHTML=`<section class="card loading"><div class="label">PHONE EASY v42</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">Loading your live job.</div></section>`;}
async function openNavigator(){if(!person||!valid(pin)){login();return}loading();try{const res=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({projectId:PROJECT,pin})});if(res.status===401){pin='';localStorage.removeItem(PIN_KEY);login('Incorrect crew PIN.');return}if(!res.ok){showError('Navigator is temporarily unavailable. Try again.');return}const html=await res.text();if(!html.toLowerCase().includes('<html')||!html.includes('Pinnacle Navigator')){showError('Navigator could not open correctly. Try again.');return}document.open();document.write(html);document.close();}catch(e){showError('Could not connect. Check internet and try again.');}}
function showError(message){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR</div><h1>Could not open</h1><p class="intro">${esc(message)}</p><button id="retry" class="retry">TRY AGAIN</button><div class="note">You never need to upload an HTML file here.</div></section>`;document.getElementById('retry').onclick=openNavigator;}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
</html>
