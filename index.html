<title>Pinnacle Navigator · v53.53</title>
<script>
(function(){
  const ROOT_SCOPE='/pinnacle-navigator/';
  if(!location.pathname.startsWith(ROOT_SCOPE+'ytintel/'))return;
  document.documentElement.style.visibility='hidden';
  if(!('serviceWorker' in navigator)){document.documentElement.style.visibility='';return;}
  navigator.serviceWorker.getRegistrations().then(async regs=>{
    let removed=false;
    for(const reg of regs){try{if(new URL(reg.scope).pathname===ROOT_SCOPE)removed=(await reg.unregister())||removed;}catch(e){}}
    if(removed){location.reload();return;}
    document.documentElement.style.visibility='';
  }).catch(()=>{document.documentElement.style.visibility='';});
  setTimeout(()=>{document.documentElement.style.visibility='';},2500);
})();
</script>
<style>
:root{--bg:#eeede8;--surface:#fff;--ink:#111417;--muted:#70726e;--line:#d6d5cf;--steel:#181d21;--steel2:#272f34;--amber:#f1b82d;--green:#23764a;--red:#9b3030;--shadow:0 24px 64px rgba(20,26,30,.13)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -180px,#fff 0,#f6f5f0 38%,#eeede8 78%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit}.shell{width:min(1040px,100%);margin:0 auto;padding:22px clamp(10px,3vw,26px) 38px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--steel),var(--steel2));color:#fff;display:grid;place-items:center;font-weight:950;letter-spacing:-.06em;box-shadow:0 9px 24px rgba(0,0,0,.14);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amber)}.brand{font-size:23px;font-weight:950;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);font-weight:850;margin-top:2px;letter-spacing:.065em}.badge{padding:8px 11px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:950;white-space:nowrap}.panel{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#293136 100%);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--amber),#ffd76a)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#c0c5c7}.introPanel h1{font-size:clamp(36px,5vw,54px);line-height:.96;letter-spacing:-.06em;margin:12px 0 15px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55;max-width:390px}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:25px}.readyChip{border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:950;color:#d9dddf}.readyChip.on{background:#e2f5e9;color:#1c603a;border-color:#e2f5e9}.loginPanel{padding:34px}.label{font-size:9px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.loginPanel h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.pinLabel{display:block;font-size:9px;font-weight:950;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}.pin{display:block;width:100%;border:2px solid #c8c7c0;border-radius:14px;padding:14px;font-size:24px;letter-spacing:.22em;text-align:center;background:#fafaf7;color:#111;outline:none}.pin:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(241,184,45,.16)}.names{display:grid;gap:8px;margin-top:12px}.person{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#111;text-align:left;padding:10px 14px;font-size:16px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.person:after{content:"›";font-size:26px;color:#777}.person:hover{border-color:#a7a69f;background:#fafaf7}.person:active{transform:scale(.995)}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}.err{min-height:18px;margin-top:9px;font-size:10px;font-weight:900;color:var(--red)}.loadingBox{padding:52px 32px;text-align:center}.loadingBox h2{font-size:32px;letter-spacing:-.04em;margin:8px 0}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:56px;border:0;border-radius:13px;background:var(--steel);color:#fff;font-weight:950;font-size:14px;margin-top:12px}.note{font-size:9px;color:var(--muted);line-height:1.45;margin-top:12px}@media(max-width:740px){.shell{padding-top:10px}.mast{margin-bottom:10px}.mark{width:40px;height:40px;border-radius:11px}.brand{font-size:19px}.sub{font-size:8px}.panel{display:block;border-radius:20px}.introPanel{padding:20px 17px}.introPanel h1{font-size:35px;margin:8px 0 9px}.introPanel p{font-size:12px}.readyRow{margin-top:14px}.loginPanel{padding:18px 16px 20px}.loginPanel h2{font-size:27px}.person{min-height:58px}.badge{font-size:8px}}
</style>

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge" id="versionBadge">v53.53</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5359';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.53',BUILD='5359';
const PRIVATE_CACHE='pn-private-bundle-stable-v2',PRIVATE_URL=new URL('./.private-navigator-stable-v2',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view'),versionBadge=document.getElementById('versionBadge');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'',loginBusy=false;
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function showVersion(v){const x=String(v||VERSION);if(versionBadge)versionBadge.textContent=x;document.title='Pinnacle Navigator · '+x;}showVersion(VERSION);
function runtimeTags(){let x='<script src="./fabrication.js?v='+BUILD+'"><\/script><script src="./stability.js?v='+BUILD+'"><\/script>';MODULES.forEach(s=>x+='<script crossorigin="anonymous" src="'+ROOT+s+'?b='+BUILD+'"><\/script>');x+='<script src="./morning-pack.js?v='+BUILD+'"><\/script><script src="./workshop-ui-v2.js?v='+BUILD+'"><\/script>';return x;}
function stripOldRuntime(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*(?:workshop-ui(?:-v2)?\.js|morning-pack\.js|stability\.js|fabrication\.js)[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<script[^>]+src=["'][^"']*supabase\.co\/functions\/v1\/navigator-v[^"']*["'][^>]*><\/script>/gi,'');return html;}
function decorate(raw){let html=stripOldRuntime(raw).replace(/LIVE v\d+(?:\.\d+)?\s*·\s*[^<]*/g,'LIVE '+VERSION+' · WORKSHOP READY');return before(html,'</body>',runtimeTags()+'<!-- PN-STABLE-5359 dual-route-runtime -->');}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE,'pn-private-bundle-stable-v1'].concat(names.filter(n=>n.indexOf('pn-private-bundle-')===0&&!['pn-private-bundle-stable-v1',PRIVATE_CACHE].includes(n)).sort().reverse());for(const name of order){const c=await caches.open(name),keys=await c.keys();for(const k of keys){if(k.url.indexOf('.private-navigator')===-1)continue;const r=await c.match(k);if(r){const html=await r.text();if(bundleValid(html))return html;}}}}catch(e){}return null;}
function launch(html){document.open();document.write(html);document.close();}
async function postBundle(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const html=decorate(await r.text());if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html};}finally{clearTimeout(timer)}}
async function fetchFresh(){let firstErr=null;try{return await postBundle(ENDPOINT,12000);}catch(e){firstErr=e;console.warn('primary Navigator bundle failed',e);}try{return await postBundle(SAFE_ENDPOINT,12000);}catch(e){console.warn('safe Navigator bundle failed',e);throw new Error((firstErr?firstErr.message+'; ':'')+e.message);}}
function backgroundRefresh(){try{if(!('serviceWorker'in navigator))return;navigator.serviceWorker.ready.then(reg=>{const w=navigator.serviceWorker.controller||reg.active||reg.waiting;if(w)w.postMessage({type:'REFRESH_BUNDLE',pin});}).catch(()=>{});}catch(e){}}
function choosePerson(key,event){if(event){event.preventDefault();event.stopPropagation();}if(loginBusy)return;const input=document.getElementById('crewPin'),p=clean(input&&input.value),err=document.getElementById('err');if(!valid(p)){if(err)err.textContent='Enter all 6 PIN digits first.';if(input){input.value=p;input.focus();}return;}loginBusy=true;pin=p;person=key;try{input.blur();}catch(e){}openNavigator();}
function bindLogin(){const input=document.getElementById('crewPin');if(input){input.addEventListener('input',function(){this.value=clean(this.value);});input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();choosePerson(localStorage.getItem(PERSON_KEY)||'me',e);}});}view.querySelectorAll('[data-person]').forEach(btn=>{const key=btn.dataset.person;btn.addEventListener('click',e=>choosePerson(key,e),{capture:true});btn.addEventListener('touchend',e=>choosePerson(key,e),{passive:false,capture:true});});}
function login(message=''){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Your whole workday, clear.</h1><p>Current job, morning packing, crew, plans and the full project in one workshop-first tool. After one successful sign-in, this device keeps a resilient local copy ready.</p><div class="readyRow"><span class="readyChip on">WORKSHOP READY</span><span class="readyChip">SHARED CREW</span><span class="readyChip">LOCAL RECOVERY</span></div></div><div class="loginPanel"><div class="label">CREW ACCESS</div><h2>Open Navigator</h2><div class="help">Enter the 6-digit crew PIN, then tap your name.</div><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Signing in or refreshing does not reset shared job progress.</div></div></section>`;bindLogin();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Your workshop copy is being prepared. Existing DONE states, assignments and project information remain intact.</p><div class="readyRow"><span class="readyChip on">STABLE BUILD</span><span class="readyChip">AUTO RECOVERY</span></div></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message||'Preparing this device…')}</div></div></section>`;}
function error(message){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>Navigator tried both workshop connection routes and could not prepare this device yet. No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">CONNECTION NEEDED</div><h2>Try again.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY BOTH ROUTES AGAIN</button></div></section>`;document.getElementById('retry').onclick=openNavigator;}
async function openNavigator(){
  if(!person||!valid(pin)){login();return;}
  const oldPin=localStorage.getItem(PIN_KEY)||'',cached=oldPin===pin?await readBundle():null;
  if(cached){const upgraded=decorate(cached);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(PIN_KEY,pin);localStorage.setItem(VERSION_KEY,VERSION);saveBundle(upgraded);backgroundRefresh();launch(upgraded);return;}
  loading('Connecting to the workshop service…');
  try{const r=await fetchFresh();if(!r.auth){pin='';person='';localStorage.removeItem(PIN_KEY);login('Incorrect crew PIN.');return;}localStorage.setItem(PERSON_KEY,person);localStorage.setItem(PIN_KEY,pin);localStorage.setItem(VERSION_KEY,VERSION);await saveBundle(r.html);backgroundRefresh();launch(r.html);}catch(e){error('Both live routes were unavailable. Your saved progress is untouched.');}
}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
