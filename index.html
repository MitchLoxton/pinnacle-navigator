<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navigator">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Pinnacle Navigator</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#111;--muted:#676762;--line:#ddd;--red:#9f2626}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{max-width:680px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:900;white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center}.label{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}h1{font-size:29px;line-height:1.05;margin:8px 0}.intro{font-size:15px;color:var(--muted);line-height:1.45;margin:0 auto 18px;max-width:520px}.pinLabel{display:block;text-align:left;font-size:12px;font-weight:900;color:var(--muted);max-width:360px;margin:auto}.pin{display:block;width:100%;max-width:360px;margin:6px auto 14px;border:2px solid #bbb;border-radius:13px;padding:15px;font-size:24px;letter-spacing:.18em;text-align:center;background:#fff}.names{display:grid;gap:11px}.person{width:100%;min-height:76px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;font-size:22px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}.person:active{transform:scale(.99);background:#f1f1ee}.person small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.err{min-height:20px;margin-top:10px;font-size:12px;font-weight:900;color:var(--red)}.loading{padding:34px 10px}.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:18px auto;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;border:0;border-radius:12px;background:#111;color:#fff;min-height:54px;font-weight:900;font-size:16px;margin-top:12px}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}@media(max-width:520px){.app{padding:8px}.card{padding:14px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app"><div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · LIVE Shared Crew</div></div><div class="badge">WORKSHOP v51</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle';
const KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin';
const BUNDLE_CACHE='pn-private-bundle-v51-2',BUNDLE_CACHE_URL=new URL('./.private-navigator-v51-2',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'};const view=document.getElementById('view');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'';
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(message=''){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR</div><h1>Who are you?</h1><p class="intro">Enter the crew PIN, then tap your name. After a successful sign-in Navigator remembers this device.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6 digits" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Same live Navigator on phone, tablet or computer.</div></section>`;view.querySelectorAll('[data-person]').forEach(btn=>btn.onclick=()=>{const p=clean(document.getElementById('crewPin').value);if(!valid(p)){document.getElementById('err').textContent='Enter all 6 PIN digits first.';return}pin=p;person=btn.dataset.person;openNavigator();});}
function loading(message='Loading your live job.'){view.innerHTML=`<section class="card loading"><div class="label">PINNACLE NAVIGATOR · v51</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">${esc(message)}</div></section>`;}
function bundleLooksValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('./v51.js?v=51')&&s.includes('./v51.css?v=51')&&s.includes('./foreman.js?v=1')&&s.includes('./progress.js?v=1')&&s.includes('LOCAL_SYNC_BASE_KEY')&&s.includes('__PN_V48_GUARD__');}
async function retireOldPrivateCaches(){try{if(!('caches' in window))return;const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pn-private-bundle-')&&k!==BUNDLE_CACHE).map(k=>caches.delete(k)));}catch(e){}}
async function saveCachedBundle(html){try{if(!('caches' in window)||!bundleLooksValid(html))return false;const c=await caches.open(BUNDLE_CACHE);await c.put(BUNDLE_CACHE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':'v51.2','x-pn-verified-at':new Date().toISOString()}}));await retireOldPrivateCaches();return true;}catch(e){console.warn('Navigator cache write failed',e);return false}}
async function readCachedBundle(){try{if(!('caches' in window))return null;const c=await caches.open(BUNDLE_CACHE);const r=await c.match(BUNDLE_CACHE_URL);if(!r||r.headers.get('x-pn-version')!=='v51.2')return null;const html=await r.text();return bundleLooksValid(html)?html:null;}catch(e){return null}}
function launch(html){document.open();document.write(html);document.close();}
async function fetchBundle(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{return await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer)}}
async function openNavigator(){
  if(!person||!valid(pin)){login();return}
  loading();
  const previouslyValidated=localStorage.getItem(PIN_KEY)||'';
  try{
    const forceFresh=(()=>{try{return new URLSearchParams(location.search).get('fresh')==='1'}catch(e){return false}})();
    if(!forceFresh&&previouslyValidated===pin){
      const cached=await readCachedBundle();
      if(cached){localStorage.setItem(PERSON_KEY,person);loading('Opening the verified workshop copy on this device…');setTimeout(()=>launch(cached),20);return;}
    }
    const res=await fetchBundle();
    if(res.status===401){if(previouslyValidated===pin)localStorage.removeItem(PIN_KEY);pin='';login('Incorrect crew PIN.');return}
    if(!res.ok)throw new Error('Navigator server returned '+res.status);
    const serverVersion=res.headers.get('x-navigator-bundle')||'',integrity=res.headers.get('x-navigator-integrity')||'';
    if(serverVersion!=='v51-workshop'||integrity!=='ok')throw new Error('Navigator build did not pass verification');
    const html=await res.text();
    if(!bundleLooksValid(html))throw new Error('Navigator bundle failed device verification');
    localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);await saveCachedBundle(html);launch(html);
  }catch(e){
    const cached=await readCachedBundle();
    if(cached&&previouslyValidated&&previouslyValidated===pin){localStorage.setItem(PERSON_KEY,person);loading('Connection is unavailable — opening this device’s last verified workshop copy. Changes will queue and merge when connection returns.');setTimeout(()=>launch(cached),100);return}
    showError(e&&e.message&&e.message.includes('verification')?'Navigator update could not be verified. Tap TRY AGAIN.':'Could not connect to Navigator. Check the connection and try again.');
  }
}
function showError(message){view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR · v51</div><h1>Could not open</h1><p class="intro">${esc(message)}</p><button id="retry" class="retry">TRY AGAIN</button><div class="note">Your shared job progress has not been reset or marked DONE.</div></section>`;document.getElementById('retry').onclick=openNavigator;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
</html>
