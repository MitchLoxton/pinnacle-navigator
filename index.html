<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pinnacle Navigator</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#111;--muted:#676762;--line:#ddd;--green:#176b3b;--greenbg:#eaf6ed;--blue:#205a8a;--bluebg:#eef5fb;--red:#9f2626;--redbg:#fff0f0}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:680px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.center{text-align:center}.label{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}h1{font-size:30px;line-height:1.05;margin:8px 0}.intro{font-size:15px;color:var(--muted);line-height:1.45;margin:0 auto 18px;max-width:520px}.pinLabel{display:block;text-align:left;font-size:12px;font-weight:900;color:var(--muted);max-width:360px;margin:auto}.pin{display:block;width:100%;max-width:360px;margin:6px auto 14px;border:2px solid #bbb;border-radius:13px;padding:14px;font-size:24px;letter-spacing:.18em;text-align:center;background:#fff}.names{display:grid;gap:11px}.person{width:100%;min-height:72px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;font-size:22px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}.person:active{transform:scale(.99);background:#f1f1ee}.person small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.err{min-height:20px;margin-top:10px;font-size:12px;font-weight:900;color:var(--red)}.loading{padding:34px 10px}.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:18px auto;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.restore{border:2px solid var(--blue);background:var(--bluebg)}.restore h1{font-size:25px}.restore p{font-size:14px;line-height:1.5}.feature{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:13px;line-height:1.5;margin:12px 0}.fileBox{display:block;border:2px dashed #8aa9c3;border-radius:14px;padding:16px;background:#fff;margin:12px 0;text-align:left}.fileBox input{width:100%;font-size:16px}.primary,.soft{width:100%;border:0;border-radius:12px;padding:14px;min-height:52px;font-size:15px;font-weight:900;margin-top:8px;touch-action:manipulation}.primary{background:#111;color:#fff}.soft{background:#e4e4df;color:#111}.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;font-size:13px;line-height:1.4}.status.good{background:var(--greenbg);color:var(--green)}.status.bad{background:var(--redbg);color:var(--red)}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}
@media(max-width:520px){.app{padding:9px}.card{padding:14px}h1{font-size:28px}.person{min-height:76px;font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · LIVE Shared Crew</div></div><div class="badge">FULL v41</div></div>
  <main id="view"></main>
</div>
<script>
(function(){
'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle';
const KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1';
const PERSON_KEY='pn_live_person';
const PIN_KEY='pn_live_pin';
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'};
const view=document.getElementById('view');
let person=localStorage.getItem(PERSON_KEY)||'';
let pin=localStorage.getItem(PIN_KEY)||'';
function cleanPin(v){return String(v||'').replace(/[^0-9]/g,'').slice(0,6)}
function validPin(v){return /^[0-9]{6}$/.test(v)}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(message=''){
  view.innerHTML=`<section class="card center"><div class="label">PINNACLE NAVIGATOR</div><h1>Who is using this phone?</h1><p class="intro">Enter the crew PIN, then tap your name. The full Navigator opens with the simple drawing first; real photos stay hidden until you choose to show them.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6 digits" value="${esc(cleanPin(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Use this hosted webpage on phones. Do not open the downloaded HTML file in the phone preview.</div></section>`;
  view.querySelectorAll('[data-person]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=cleanPin(document.getElementById('crewPin').value);
      const err=document.getElementById('err');
      if(!validPin(p)){err.textContent='Enter all 6 PIN digits first.';return}
      pin=p;person=btn.dataset.person;
      localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);
      openNavigator();
    });
  });
}
function loading(){view.innerHTML=`<section class="card center loading"><div class="label">FULL v41 NAVIGATOR</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">Loading the shared job, drawings, descriptions and optional photos.</div></section>`}
async function getBundle(){return fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({projectId:PROJECT,pin})})}
async function openNavigator(){
  if(!person||!validPin(pin)){login();return}
  loading();
  try{
    const res=await getBundle();
    if(res.status===401){pin='';localStorage.removeItem(PIN_KEY);login('Incorrect crew PIN.');return}
    if(res.status===404){restore();return}
    if(!res.ok){login('Could not load Navigator. Check internet and try again.');return}
    const html=await res.text();
    if(!html.toLowerCase().includes('<html')||!html.includes('Pinnacle Navigator')){login('The stored Navigator file was not valid.');return}
    document.open();document.write(html);document.close();
  }catch(e){login('Could not connect. Check internet and try again.')}
}
function restore(){
  view.innerHTML=`<section class="card restore"><div class="label">ONE-TIME SETUP</div><h1>Install the full v41 once</h1><p>The phone website is working. The private server just needs the full v41 file installed once. Do this on your computer; after that every phone only needs the normal PIN + name screen.</p><div class="feature"><b>v41 keeps:</b><br>simple drawings · plain-English instructions · Navigator plan check/insight · WHAT RIGHT LOOKS LIKE · STOP IF · DONE/BLOCK · full plan references.<br><br><b>Real photos stay hidden</b> until SHOW REAL PHOTO is tapped.</div><label class="fileBox"><b>SELECT Pinnacle_Navigator_v41_WORKER_CLEAR.html</b><br><br><input id="bundleFile" type="file" accept=".html,text/html"></label><button id="upload" class="primary">INSTALL FULL v41</button><button id="back" class="soft">BACK</button><div id="status" class="status">This does not reset the shared task progress.</div></section>`;
  document.getElementById('back').onclick=()=>login();
  document.getElementById('upload').onclick=upload;
}
async function upload(){
  const file=document.getElementById('bundleFile').files[0];const status=document.getElementById('status');
  if(!file){status.className='status bad';status.textContent='Choose the v41 HTML file first.';return}
  if(file.size<100000){status.className='status bad';status.textContent='That file is too small to be the full Navigator.';return}
  status.className='status';status.textContent='Installing v41 privately…';
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'text/html','apikey':KEY,'x-navigator-pin':pin,'x-navigator-project':PROJECT},body:file});
    let data={};try{data=await res.json()}catch(e){}
    if(res.status===401){status.className='status bad';status.textContent='Crew PIN was rejected.';return}
    if(!res.ok){status.className='status bad';status.textContent=data.error||'Install failed.';return}
    status.className='status good';status.textContent='Installed. Opening full v41…';setTimeout(openNavigator,500);
  }catch(e){status.className='status bad';status.textContent='Could not reach the private server. Check internet and try again.'}
}
if(person&&validPin(pin))openNavigator();else login();
})();
</script>
</body>
</html>
