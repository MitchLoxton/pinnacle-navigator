<link rel="manifest" href="./manifest.webmanifest?v=5354">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Pinnacle Navigator · v53.50</title>
<script>
(function(){
  const ROOT_SCOPE='/pinnacle-navigator/';
  if(!location.pathname.startsWith(ROOT_SCOPE+'ytintel/'))return;
  document.documentElement.style.visibility='hidden';
  if(!('serviceWorker' in navigator)){document.documentElement.style.visibility='';return;}
  navigator.serviceWorker.getRegistrations().then(async regs=>{
    let removed=false;
    for(const reg of regs){
      try{
        if(new URL(reg.scope).pathname===ROOT_SCOPE)removed=(await reg.unregister())||removed;
      }catch(e){}
    }
    if(removed){location.reload();return;}
    document.documentElement.style.visibility='';
  }).catch(()=>{document.documentElement.style.visibility='';});
  setTimeout(()=>{document.documentElement.style.visibility='';},3000);
})();
</script>
<style>
:root{--bg:#f4f4f1;--text:#111;--muted:#676762;--line:#ddd;--red:#9f2626}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-y:auto}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{max-width:680px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:900;white-space:nowrap}.card{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:center}.label{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}h1{font-size:29px;line-height:1.05;margin:8px 0}.intro{font-size:15px;color:var(--muted);line-height:1.45;margin:0 auto 18px;max-width:520px}.pinLabel{display:block;text-align:left;font-size:12px;font-weight:900;color:var(--muted);max-width:360px;margin:auto}.pin{position:relative;z-index:5;pointer-events:auto!important;display:block;width:100%;max-width:360px;margin:6px auto 14px;border:2px solid #bbb;border-radius:13px;padding:15px;font-size:24px;letter-spacing:.18em;text-align:center;background:#fff}.names{position:relative;z-index:10;display:grid;gap:11px;pointer-events:auto!important}.person{position:relative!important;z-index:20!important;pointer-events:auto!important;-webkit-user-select:none;user-select:none;width:100%;min-height:76px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;font-size:22px;font-weight:900;touch-action:manipulation}.person:active{transform:scale(.99);background:#f0f0ec}.person small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.err{min-height:20px;margin-top:10px;font-size:12px;font-weight:900;color:var(--red)}.loading{padding:34px 10px}.spinner{width:36px;height:36px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:18px auto;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{position:relative;z-index:20;pointer-events:auto!important;width:100%;border:0;border-radius:12px;background:#111;color:#fff;min-height:54px;font-weight:900;font-size:16px;margin-top:12px;touch-action:manipulation}.note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}@media(max-width:520px){.app{padding:8px}.card{padding:14px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="app"><div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · STABLE Shared Crew</div></div><div class="badge" id="versionBadge">v53.50</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ENHANCED_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5354';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.50';
const PRIVATE_CACHE='pn-private-bundle-stable-v1',PRIVATE_URL=new URL('./.private-navigator-stable',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view'),versionBadge=document.getElementById('versionBadge');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'',loginBusy=false;
function showVersion(v){const x=String(v||VERSION);if(versionBadge)versionBadge.textContent=x;document.title='Pinnacle Navigator · '+x;}showVersion(VERSION);
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function decorate(raw){let html=String(raw||'').replace(/LIVE v48 · WORKSHOP READY/g,'LIVE v53.50 · STABLE WORKSHOP');let body='<script src="./fabrication.js?v=5354"><\/script><script src="./stability.js?v=5354"><\/script>';MODULES.forEach(s=>body+='<script crossorigin="anonymous" src="'+ROOT+s+'?b=5354"><\/script>');body+='<!-- PN-STABILITY-5354 cached-first resilient-workshop -->';return before(html,'</body>',body);}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){
  try{
    if(!('caches'in window))return null;
    const names=await caches.keys(),order=[PRIVATE_CACHE].concat(names.filter(n=>n!==PRIVATE_CACHE&&n.indexOf('pn-private-bundle-')===0).sort().reverse());
    for(const name of order){const c=await caches.open(name);let r=await c.match(PRIVATE_URL);if(!r){const keys=await c.keys();for(const k of keys)if(k.url.indexOf('.private-navigator')!==-1){r=await c.match(k);if(r)break;}}if(r){const html=await r.text();if(bundleValid(html))return html;}}
  }catch(e){}
  return null;
}
function launch(html){document.open();document.write(html);document.close();}
async function postSafe(ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{return await fetch(SAFE_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer)}}
async function fetchFresh(ms){const r=await postSafe(ms);if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const raw=await r.text(),html=decorate(raw);if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html:html};}
function askBackgroundRefresh(){try{if(!('serviceWorker'in navigator))return;navigator.serviceWorker.ready.then(reg=>{const w=navigator.serviceWorker.controller||reg.active||reg.waiting;if(w)w.postMessage({type:'REFRESH_BUNDLE',pin:pin});}).catch(()=>{});}catch(e){}}
function choosePerson(key,event){if(event){event.preventDefault();event.stopPropagation();}if(loginBusy)return;const input=document.getElementById('crewPin'),p=clean(input&&input.value),err=document.getElementById('err');if(!valid(p)){if(err)err.textContent='Enter all 6 PIN digits first.';if(input){input.value=p;input.focus();}return;}loginBusy=true;pin=p;person=key;try{input.blur();}catch(e){}openNavigator();}
function bindLogin(){const input=document.getElementById('crewPin');if(input){input.addEventListener('input',function(){this.value=clean(this.value);});input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();choosePerson(localStorage.getItem(PERSON_KEY)||'me',e);}});}view.querySelectorAll('[data-person]').forEach(btn=>{const key=btn.dataset.person;btn.addEventListener('click',e=>choosePerson(key,e),{capture:true});btn.addEventListener('touchend',e=>choosePerson(key,e),{passive:false,capture:true});});}
function login(message=''){loginBusy=false;view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR · STABLE</div><h1>Who are you?</h1><p class="intro">Enter the 6-digit crew PIN, then tap your name.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6 digits" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Once this device has opened Navigator successfully, it keeps a verified workshop copy ready and refreshes it silently.</div></section>`;bindLogin();}
function loading(message){view.innerHTML=`<section class="card loading"><div class="label">PINNACLE NAVIGATOR · STABLE</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">${esc(message||'Opening the workshop…')}</div></section>`;}
async function openNavigator(){
  if(!person||!valid(pin)){login();return;}
  const oldPin=localStorage.getItem(PIN_KEY)||'',cached=oldPin===pin?await readBundle():null,current=cached&&cached.includes('PN-STABILITY-5354');
  if(current){localStorage.setItem(PERSON_KEY,person);askBackgroundRefresh();launch(cached);return;}
  if(cached){loading('Refreshing the stable workshop copy…');try{const r=await fetchFresh(2500);if(!r.auth){localStorage.removeItem(PIN_KEY);pin='';person='';login('Incorrect crew PIN.');return;}localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION);await saveBundle(r.html);launch(r.html);return;}catch(e){localStorage.setItem(PERSON_KEY,person);askBackgroundRefresh();launch(cached);return;}}
  loading('Preparing this device for reliable workshop use…');
  try{const r=await fetchFresh(12000);if(!r.auth){pin='';person='';login('Incorrect crew PIN.');return;}localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION);await saveBundle(r.html);askBackgroundRefresh();launch(r.html);return;}catch(e){showError('Navigator needs one successful connection on this device before its stable local copy is available. Tap TRY AGAIN.');}
}
function showError(message){loginBusy=false;view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR · STABLE</div><h1>Could not open yet</h1><p class="intro">${esc(message)}</p><button id="retry" class="retry" type="button">TRY AGAIN</button><div class="note">Shared job progress has not been changed.</div></section>`;const b=document.getElementById('retry'),go=e=>{if(e){e.preventDefault();e.stopPropagation();}openNavigator();};b.addEventListener('click',go,{capture:true});b.addEventListener('touchend',go,{passive:false,capture:true});}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=5355',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
</html>
