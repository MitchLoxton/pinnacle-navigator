<style>
:root{--bg:#eeede8;--surface:#fff;--ink:#111417;--muted:#70726e;--line:#d6d5cf;--steel:#181d21;--steel2:#272f34;--amber:#f1b82d;--green:#23764a;--red:#9b3030;--shadow:0 24px 64px rgba(20,26,30,.13)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -180px,#fff 0,#f6f5f0 38%,#eeede8 78%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.shell{width:min(1040px,100%);margin:0 auto;padding:22px clamp(10px,3vw,26px) 38px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--steel),var(--steel2));color:#fff;display:grid;place-items:center;font-weight:950;box-shadow:0 9px 24px rgba(0,0,0,.14);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amber)}.brand{font-size:23px;font-weight:950;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);font-weight:850;margin-top:2px;letter-spacing:.065em}.badge{padding:8px 11px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:950}.panel{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#293136 100%);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--amber),#ffd76a)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#c0c5c7}.introPanel h1{font-size:clamp(36px,5vw,54px);line-height:.96;letter-spacing:-.06em;margin:12px 0 15px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:25px}.readyChip{border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:950;color:#d9dddf}.readyChip.on{background:#e2f5e9;color:#1c603a;border-color:#e2f5e9}.loginPanel,.loadingBox{padding:34px}.label{font-size:9px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.loginPanel h2,.loadingBox h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.names{display:grid;gap:10px;margin-top:18px}.person{width:100%;min-height:72px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#111;text-align:left;padding:12px 16px;font-size:18px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-decoration:none;touch-action:manipulation}.person:after{content:"›";font-size:28px;color:#777}.person:hover{border-color:#aaa9a3;background:#fafaf7}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}.err{min-height:18px;margin-top:10px;font-size:10px;font-weight:900;color:var(--red)}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:56px;border:0;border-radius:13px;background:var(--steel);color:#fff;font-weight:950;font-size:14px;margin-top:12px;cursor:pointer}@media(max-width:740px){.shell{padding-top:10px}.mark{width:40px;height:40px}.brand{font-size:19px}.panel{display:block;border-radius:20px}.introPanel{padding:20px 17px}.introPanel h1{font-size:35px}.loginPanel,.loadingBox{padding:18px 16px 20px}.person{min-height:64px}}

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge" id="versionBadge">v53.56</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5363';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',ACCESS_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.56',BUILD='5363';
const PRIVATE_CACHE='pn-private-bundle-stable-v2',PRIVATE_URL=new URL('./.private-navigator-stable-v2',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view');
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);let person=localStorage.getItem(PERSON_KEY)||'',access=clean(localStorage.getItem(ACCESS_KEY)||''),busy=false;const forcedPerson=qs.get('crew');if(NAMES[forcedPerson]){person=forcedPerson;try{localStorage.setItem(PERSON_KEY,person)}catch(e){}}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function crewRescueTag(){return `<script>(function(){var busy=false,suppress=false;function n(v){return String(v||'').replace(/\\s+/g,' ').trim().toUpperCase()}function chooser(){return n(document.body&&document.body.innerText).indexOf('WHO IS USING THIS PHONE')!==-1}function savedPerson(){try{var k=localStorage.getItem('pn_live_person')||'';return /^(me|ronan|colin)$/.test(k)?k:''}catch(e){return''}}function savedPin(){try{return String(localStorage.getItem('pn_live_pin')||'').replace(/[^0-9]/g,'').slice(0,6)}catch(e){return''}}function fillPin(){var p=savedPin();if(!/^\\d{6}$/.test(p))return;var ins=document.querySelectorAll('input');for(var i=0;i<ins.length;i++){var im=String(ins[i].inputMode||'').toLowerCase(),val=String(ins[i].value||'').replace(/[^0-9]/g,'');if(im==='numeric'||val.length<=6){try{ins[i].value=p;ins[i].dispatchEvent(new Event('input',{bubbles:true}));ins[i].dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}break}}}function keyFrom(node){var map={MITCHELL:'me',RONAN:'ronan',COLIN:'colin'},x=node,depth=0;while(x&&x!==document.body&&depth<7){var t=n(x.textContent);var names=Object.keys(map);for(var i=0;i<names.length;i++){var name=names[i];if(t===name||t.indexOf(name+' ')===0||t.indexOf(name+' WORKER')===0||t.indexOf(name+' FOREMAN')===0)return map[name]}x=x.parentElement;depth++}return''}function directRender(k){var ok=false;try{if(typeof state!=='undefined'&&state){state.currentUser=k;try{if(state.identity&&typeof state.identity==='object')state.identity.currentUser=k}catch(e){}}}catch(e){}try{if(typeof renderTask==='function'){renderTask();ok=!chooser();}}catch(e){}if(!ok)try{if(typeof render==='function'){render();ok=!chooser();}}catch(e){}return ok}function findName(k){var label=k==='me'?'MITCHELL':k==='ronan'?'RONAN':'COLIN',all=document.querySelectorAll('button,[role=button],[onclick],a,div');for(var i=0;i<all.length;i++){var t=n(all[i].textContent);if(t===label||t.indexOf(label+' WORKER')===0||t.indexOf(label+' FOREMAN')===0)return all[i]}return null}function enter(k,e){if(busy||!chooser())return;if(e){try{e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()}catch(x){}}busy=true;try{localStorage.setItem('pn_live_person',k);localStorage.setItem('pn_live_version','v53.56')}catch(x){}fillPin();if(directRender(k)){busy=false;return}var el=findName(k);if(el){try{suppress=true;el.click();}catch(x){}suppress=false;}setTimeout(function(){if(!chooser()){busy=false;return}if(directRender(k)){busy=false;return}var tries=0;try{tries=Number(sessionStorage.getItem('pn_crew_rescue_tries')||0)}catch(x){}if(tries<1){try{sessionStorage.setItem('pn_crew_rescue_tries',String(tries+1))}catch(x){}location.replace('./?crew='+encodeURIComponent(k)+'&fresh=1&b=5363&t='+Date.now());}else{busy=false;try{sessionStorage.removeItem('pn_crew_rescue_tries')}catch(x){}}},180)}function delegate(e){if(suppress||!chooser())return;var k=keyFrom(e.target);if(k)enter(k,e)}function auto(){if(!chooser())return;fillPin();var k=savedPerson();if(k)enter(k,null)}document.addEventListener('click',delegate,true);document.addEventListener('touchend',delegate,{capture:true,passive:false});setTimeout(auto,0);setTimeout(auto,120);setTimeout(auto,500);setTimeout(auto,1400);window.addEventListener('pageshow',auto)})();<\/script>`;}
function runtimeTags(){let x=crewRescueTag()+'<script src="./fabrication.js?v='+BUILD+'"><\/script><script src="./stability.js?v='+BUILD+'"><\/script>';MODULES.forEach(s=>x+='<script crossorigin="anonymous" src="'+ROOT+s+'?b='+BUILD+'"><\/script>');x+='<script src="./morning-pack.js?v='+BUILD+'"><\/script><script src="./workshop-ui-v2.js?v='+BUILD+'"><\/script>';return x;}
function stripOldRuntime(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*(?:workshop-ui(?:-v2)?\.js|morning-pack\.js|stability\.js|fabrication\.js)[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<script[^>]+src=["'][^"']*supabase\.co\/functions\/v1\/navigator-v[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<!-- PN-STABLE-[\s\S]*?-->/g,'');return html;}
function decorate(raw){let html=stripOldRuntime(raw).replace(/LIVE v\d+(?:\.\d+)?\s*·\s*[^<]*/g,'LIVE '+VERSION+' · WORKSHOP READY');return before(html,'</body>',runtimeTags()+'<!-- PN-STABLE-5363 crew-auto-bypass -->');}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE,'pn-private-bundle-stable-v1'].concat(names.filter(n=>n.indexOf('pn-private-bundle-')===0&&!['pn-private-bundle-stable-v1',PRIVATE_CACHE].includes(n)).sort().reverse());for(const name of order){const c=await caches.open(name),keys=await c.keys();for(const k of keys){if(k.url.indexOf('.private-navigator')===-1)continue;const r=await c.match(k);if(r){const html=await r.text();if(bundleValid(html))return html;}}}}catch(e){}return null;}
function launch(html){document.open();document.write(html);document.close();}
async function postBundle(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:access}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const html=decorate(await r.text());if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html};}finally{clearTimeout(timer)}}
async function fetchFresh(){let firstErr=null;try{return await postBundle(ENDPOINT,12000);}catch(e){firstErr=e;}try{return await postBundle(SAFE_ENDPOINT,12000);}catch(e){throw new Error((firstErr?firstErr.message+'; ':'')+e.message);}}
function refresh(){try{if(!('serviceWorker'in navigator)||!valid(access))return;navigator.serviceWorker.ready.then(reg=>{const w=navigator.serviceWorker.controller||reg.active||reg.waiting;if(w)w.postMessage({type:'REFRESH_BUNDLE',pin:access});}).catch(()=>{});}catch(e){}}
function choosePerson(key,e){if(e){e.preventDefault();e.stopPropagation();}if(busy)return;busy=true;person=key;try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(x){}openNavigator();}
function bindChooser(){view.querySelectorAll('[data-person]').forEach(btn=>{btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),true);btn.addEventListener('touchend',e=>choosePerson(btn.dataset.person,e),{capture:true,passive:false});});}
function chooser(message=''){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Your whole workday, clear.</h1><p>Current job, morning packing, crew, plans and the full project in one workshop-first tool.</p><div class="readyRow"><span class="readyChip on">NO PASSWORD PROMPT</span><span class="readyChip">SHARED CREW</span><span class="readyChip">LOCAL RECOVERY</span></div></div><div class="loginPanel"><div class="label">WHO IS WORKING?</div><h2>Choose your name</h2><div class="help">Tap your name. The link itself works even if a JavaScript button handler fails.</div><div class="names"><a class="person" data-person="me" href="./?crew=me&go=1"><span>MITCHELL<small>Worker</small></span></a><a class="person" data-person="ronan" href="./?crew=ronan&go=1"><span>RONAN<small>Worker</small></span></a><a class="person" data-person="colin" href="./?crew=colin&go=1"><span>COLIN<small>Foreman / decisions</small></span></a></div><div class="err">${esc(message)}</div></div></section>`;bindChooser();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Your workshop copy is being prepared. Existing progress remains intact.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">DEVICE ACCESS</div><h2>Try again.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button><a class="retry" href="./?change=1" style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fff;color:#181d21;border:1px solid #d6d5cf">CHANGE CREW MEMBER</a></div></section>`;document.getElementById('retry').onclick=openNavigator;}
async function openNavigator(){if(!person){chooser();return;}const forceFresh=qs.get('fresh')==='1';const cached=await readBundle();if(!forceFresh&&cached){const upgraded=decorate(cached);try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}saveBundle(upgraded);refresh();launch(upgraded);return;}if(valid(access)){loading('Connecting to the workshop service…');try{const r=await fetchFresh();if(r.auth){try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}await saveBundle(r.html);refresh();launch(r.html);return;}}catch(e){}}if(cached){const upgraded=decorate(cached);saveBundle(upgraded);launch(upgraded);return;}error('This device does not yet have a saved workshop copy. No task progress has been changed.');}
if(qs.get('change')==='1'){person='';try{localStorage.removeItem(PERSON_KEY)}catch(e){}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person)openNavigator();else chooser();
})();
</script>
