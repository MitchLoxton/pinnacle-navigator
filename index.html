<title>Pinnacle Navigator · v53.58</title>
<style>
:root{--bg:#eeede8;--surface:#fff;--ink:#111417;--muted:#70726e;--line:#d6d5cf;--steel:#181d21;--steel2:#272f34;--amber:#f1b82d;--green:#23764a;--red:#9b3030;--shadow:0 24px 64px rgba(20,26,30,.13)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -180px,#fff 0,#f6f5f0 38%,#eeede8 78%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.shell{width:min(1040px,100%);margin:0 auto;padding:22px clamp(10px,3vw,26px) 38px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--steel),var(--steel2));color:#fff;display:grid;place-items:center;font-weight:950;box-shadow:0 9px 24px rgba(0,0,0,.14);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amber)}.brand{font-size:23px;font-weight:950;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);font-weight:850;margin-top:2px;letter-spacing:.065em}.badge{padding:8px 11px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:950}.panel{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#293136 100%);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--amber),#ffd76a)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#c0c5c7}.introPanel h1{font-size:clamp(36px,5vw,54px);line-height:.96;letter-spacing:-.06em;margin:12px 0 15px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:25px}.readyChip{border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:950;color:#d9dddf}.readyChip.on{background:#e2f5e9;color:#1c603a;border-color:#e2f5e9}.loginPanel,.loadingBox{padding:34px}.label{font-size:9px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.loginPanel h2,.loadingBox h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.names{display:grid;gap:10px;margin-top:18px}.person{width:100%;min-height:72px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#111;text-align:left;padding:12px 16px;font-size:18px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.person:after{content:"›";font-size:28px;color:#777}.person:hover{border-color:#aaa9a3;background:#fafaf7}.person:active{transform:scale(.995)}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}.err{min-height:18px;margin-top:10px;font-size:10px;font-weight:900;color:var(--red)}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:56px;border:0;border-radius:13px;background:var(--steel);color:#fff;font-weight:950;font-size:14px;margin-top:12px;cursor:pointer}.secondary{background:#fff;color:var(--steel);border:1px solid var(--line)}@media(max-width:740px){.shell{padding-top:10px}.mark{width:40px;height:40px}.brand{font-size:19px}.panel{display:block;border-radius:20px}.introPanel{padding:20px 17px}.introPanel h1{font-size:35px}.loginPanel,.loadingBox{padding:18px 16px 20px}.person{min-height:64px}}
</style>

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge">v53.58</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5365';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',ACCESS_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.58',BUILD='5365';
const PRIVATE_CACHE='pn-private-bundle-stable-v4',PRIVATE_URL=new URL('./.private-navigator-stable-v4',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view');
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);let person=qs.get('crew')||localStorage.getItem(PERSON_KEY)||'',access=clean(localStorage.getItem(ACCESS_KEY)||''),busy=false;if(!NAMES[person])person='';if(person)try{localStorage.setItem(PERSON_KEY,person)}catch(e){}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function augment(raw){let html=String(raw||'');if(html.indexOf('runtime-late.js')===-1)html=before(html,'</body>','<script src="./runtime-late.js?v='+BUILD+'"><\/script><!-- PN-LATE-5365 -->');return html;}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const c=await caches.open(PRIVATE_CACHE),r=await c.match(PRIVATE_URL);if(!r)return null;const html=await r.text();return bundleValid(html)?html:null;}catch(e){return null;}}
function launch(html){document.open();document.write(html);document.close();}
async function fetchEnhanced(ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:access}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const integrity=r.headers.get('x-navigator-integrity');if(integrity&&integrity!=='ok')throw new Error('integrity');const raw=await r.text();if(!bundleValid(raw))throw new Error('invalid bundle');return {auth:true,html:augment(raw)};}finally{clearTimeout(timer)}}
function choosePerson(key,e){if(e){e.preventDefault();e.stopPropagation();}if(busy)return;busy=true;person=key;try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(x){}openNavigator(true);}
function bindChooser(){view.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),false));}
function chooser(message=''){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Your whole workday, clear.</h1><p>Current job, morning packing, crew, plans and the full project in one workshop-first tool.</p><div class="readyRow"><span class="readyChip on">ONE-TAP CREW</span><span class="readyChip">SHARED PROGRESS</span><span class="readyChip">OFFLINE COPY</span></div></div><div class="loginPanel"><div class="label">WHO IS WORKING?</div><h2>Choose your name</h2><div class="help">No password prompt. Tap your name and Navigator opens the saved workshop access on this device.</div><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div class="err">${esc(message)}</div></div></section>`;bindChooser();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Using the original verified Navigator bundle. No crew-click interception or login bridge is running.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">DEVICE ACCESS</div><h2>Couldn’t open yet.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button><button id="change" class="retry secondary" type="button">CHANGE CREW MEMBER</button></div></section>`;document.getElementById('retry').onclick=()=>openNavigator(true);document.getElementById('change').onclick=()=>{person='';localStorage.removeItem(PERSON_KEY);chooser();};}
async function openNavigator(forceFresh){
  if(!person){chooser();return;}
  if(!valid(access)){const cached=await readBundle();if(cached){launch(cached);return;}error('This browser no longer has its saved workshop access. The visible password field has been removed, so a brand-new or cleared browser still needs its device access restored once.');return;}
  if(!forceFresh){const cached=await readBundle();if(cached){launch(cached);return;}}
  loading('Connecting to the verified workshop bundle…');
  try{const r=await fetchEnhanced(12000);if(!r.auth){error('The saved device access was rejected. No task progress was changed.');return;}try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}await saveBundle(r.html);launch(r.html);return;}catch(e){const cached=await readBundle();if(cached){launch(cached);return;}error('The workshop service could not be reached and this device has not yet saved the new v53.58 offline copy. Tap TRY AGAIN when connected.');}
}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(access))openNavigator(true);else chooser();
})();
</script>
