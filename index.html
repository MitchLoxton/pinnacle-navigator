<style>
:root{--bg:#eeede8;--surface:#fff;--ink:#111417;--muted:#70726e;--line:#d6d5cf;--steel:#181d21;--steel2:#272f34;--amber:#f1b82d;--green:#23764a;--red:#9b3030;--shadow:0 24px 64px rgba(20,26,30,.13)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -180px,#fff 0,#f6f5f0 38%,#eeede8 78%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;touch-action:manipulation}.shell{width:min(1040px,100%);margin:0 auto;padding:22px clamp(10px,3vw,26px) 38px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--steel),var(--steel2));color:#fff;display:grid;place-items:center;font-weight:950;box-shadow:0 9px 24px rgba(0,0,0,.14);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amber)}.brand{font-size:23px;font-weight:950;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);font-weight:850;margin-top:2px;letter-spacing:.065em}.badge{padding:8px 11px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:950}.panel{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#293136 100%);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--amber),#ffd76a)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#c0c5c7}.introPanel h1{font-size:clamp(36px,5vw,54px);line-height:.96;letter-spacing:-.06em;margin:12px 0 15px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:25px}.readyChip{border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:950;color:#d9dddf}.readyChip.on{background:#e2f5e9;color:#1c603a;border-color:#e2f5e9}.loginPanel,.loadingBox{padding:34px}.label{font-size:9px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.loginPanel h2,.loadingBox h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.names{display:grid;gap:10px;margin-top:18px}.person{width:100%;min-height:72px;border:1px solid var(--line);border-radius:15px;background:#fff;color:#111;text-align:left;padding:12px 16px;font-size:18px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.person:after{content:"›";font-size:28px;color:#777}.person:hover{border-color:#aaa9a3;background:#fafaf7}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}.err{min-height:18px;margin-top:10px;font-size:10px;font-weight:900;color:var(--red)}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:56px;border:0;border-radius:13px;background:var(--steel);color:#fff;font-weight:950;font-size:14px;margin-top:12px;cursor:pointer}.secondary{background:#fff;color:var(--steel);border:1px solid var(--line)}@media(max-width:740px){.shell{padding-top:10px}.mark{width:40px;height:40px}.brand{font-size:19px}.panel{display:block;border-radius:20px}.introPanel{padding:20px 17px}.introPanel h1{font-size:35px}.loginPanel,.loadingBox{padding:18px 16px 20px}.person{min-height:64px}}

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge">v53.57</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5364';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',ACCESS_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.57',BUILD='5364';
const PRIVATE_CACHE='pn-private-bundle-stable-v3',PRIVATE_URL=new URL('./.private-navigator-stable-v3',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view');
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);let person=localStorage.getItem(PERSON_KEY)||'',access=clean(localStorage.getItem(ACCESS_KEY)||''),busy=false;const forcedPerson=qs.get('crew');if(NAMES[forcedPerson]){person=forcedPerson;try{localStorage.setItem(PERSON_KEY,person)}catch(e){}}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function bridgeTag(){return `<script>(function(){'use strict';if(window.__PN_CREW_BRIDGE_5364__)return;window.__PN_CREW_BRIDGE_5364__=1;var started=false,clicked=false;function text(v){return String(v||'').replace(/\\s+/g,' ').trim().toUpperCase()}function chooser(){return text(document.body&&document.body.innerText).indexOf('WHO IS USING THIS PHONE')!==-1}function who(){try{var k=localStorage.getItem('pn_live_person')||'';return /^(me|ronan|colin)$/.test(k)?k:''}catch(e){return''}}function access(){try{return String(localStorage.getItem('pn_live_pin')||'').replace(/[^0-9]/g,'').slice(0,6)}catch(e){return''}}function fillPin(){var p=access();if(!/^\\d{6}$/.test(p))return;var ins=document.querySelectorAll('input');for(var i=0;i<ins.length;i++){var im=String(ins[i].inputMode||'').toLowerCase(),v=String(ins[i].value||'').replace(/[^0-9]/g,'');if(im==='numeric'||v.length<=6){try{ins[i].value=p;ins[i].dispatchEvent(new Event('input',{bubbles:true}));ins[i].dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}break}}}function hidePin(){if(!/^\\d{6}$/.test(access()))return;var ins=document.querySelectorAll('input');for(var i=0;i<ins.length;i++){var im=String(ins[i].inputMode||'').toLowerCase(),v=String(ins[i].value||'').replace(/[^0-9]/g,'');if(im==='numeric'||v.length===6){ins[i].style.position='absolute';ins[i].style.opacity='0';ins[i].style.pointerEvents='none';ins[i].style.width='1px';ins[i].style.height='1px';var labels=document.querySelectorAll('label,div,span,p');for(var j=0;j<labels.length;j++){if(text(labels[j].textContent)==='CREW PIN')labels[j].style.display='none'}break}}var all=document.querySelectorAll('p,div,span');for(var k=0;k<all.length;k++){var t=text(all[k].textContent);if(t.indexOf('ENTER THE CREW PIN ONCE')===0){all[k].textContent='Opening your saved crew profile…';break}}}function target(k){var name=k==='me'?'MITCHELL':k==='ronan'?'RONAN':'COLIN',els=document.querySelectorAll('button,[role="button"],a,[onclick]');for(var i=0;i<els.length;i++){var t=text(els[i].textContent);if(t===name||t.indexOf(name+' WORKER')===0||t.indexOf(name+' FOREMAN')===0)return els[i]}return null}function direct(k){var ok=false;try{if(typeof state!=='undefined'&&state)state.currentUser=k}catch(e){}try{if(typeof renderTask==='function'){renderTask();ok=!chooser()}}catch(e){}if(!ok)try{if(typeof render==='function'){render();ok=!chooser()}}catch(e){}return ok}function load(src){return new Promise(function(resolve){if(document.querySelector('script[data-pn-src="'+src.replace(/"/g,'')+'"]'))return resolve();var s=document.createElement('script');s.src=src;s.async=false;s.crossOrigin='anonymous';s.setAttribute('data-pn-src',src.replace(/"/g,''));s.onload=resolve;s.onerror=resolve;document.body.appendChild(s)})}async function runtime(){if(started)return;started=true;var list=['./fabrication.js?v=5364'];for(var i=0;i<${JSON.stringify(MODULES)}.length;i++)list.push('${ROOT}'+${JSON.stringify(MODULES)}[i]+'?b=5364');list.push('./morning-pack.js?v=5364','./workshop-ui-v2.js?v=5364','./stability.js?v=5364');for(var j=0;j<list.length;j++)await load(list[j])}function attempt(){if(!chooser()){runtime();return}fillPin();hidePin();var k=who();if(!k)return;if(direct(k)){runtime();return}var el=target(k);if(el&&!clicked){clicked=true;setTimeout(function(){try{el.click()}catch(e){}},40)}setTimeout(function(){if(!chooser())runtime();else{clicked=false;var again=target(k);if(again)try{again.click()}catch(e){}}},450);setTimeout(function(){if(!chooser())runtime();else direct(k)},1200)}setTimeout(attempt,0);setTimeout(attempt,160);setTimeout(attempt,600);setTimeout(attempt,1500);setTimeout(attempt,3000);window.addEventListener('pageshow',attempt);document.addEventListener('visibilitychange',function(){if(!document.hidden)attempt()})})();<\/script>`;}
function stripOldRuntime(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*(?:workshop-ui(?:-v2)?\.js|morning-pack\.js|stability\.js|fabrication\.js)[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<script[^>]+src=["'][^"']*supabase\.co\/functions\/v1\/navigator-v[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<!-- PN-STABLE-[\s\S]*?-->/g,'');return html;}
function decorate(raw){let html=stripOldRuntime(raw).replace(/LIVE v\d+(?:\.\d+)?\s*·\s*[^<]*/g,'LIVE '+VERSION+' · WORKSHOP READY');return before(html,'</body>',bridgeTag()+'<!-- PN-STABLE-5364 pass-through-crew-bridge -->');}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const c=await caches.open(PRIVATE_CACHE),r=await c.match(PRIVATE_URL);if(!r)return null;const html=await r.text();return bundleValid(html)?html:null;}catch(e){return null;}}
function launch(html){document.open();document.write(html);document.close();}
async function postBundle(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:access}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const html=decorate(await r.text());if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html};}finally{clearTimeout(timer)}}
async function fetchFresh(){let firstErr=null;try{return await postBundle(ENDPOINT,12000);}catch(e){firstErr=e;}try{return await postBundle(SAFE_ENDPOINT,12000);}catch(e){throw new Error((firstErr?firstErr.message+'; ':'')+e.message);}}
function choosePerson(key,e){if(e){e.preventDefault();e.stopPropagation();}if(busy)return;busy=true;person=key;try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(x){}openNavigator(true);}
function bindChooser(){view.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),false));}
function chooser(message=''){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Your whole workday, clear.</h1><p>Current job, morning packing, crew, plans and the full project in one workshop-first tool.</p><div class="readyRow"><span class="readyChip on">ONE-TAP CREW</span><span class="readyChip">SHARED PROGRESS</span><span class="readyChip">OFFLINE COPY</span></div></div><div class="loginPanel"><div class="label">WHO IS WORKING?</div><h2>Choose your name</h2><div class="help">Tap once. Navigator remembers this device and opens your work.</div><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div class="err">${esc(message)}</div></div></section>`;bindChooser();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Loading the verified workshop copy. Your existing progress is untouched.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">DEVICE ACCESS</div><h2>Couldn’t open yet.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button><button id="change" class="retry secondary" type="button">CHANGE CREW MEMBER</button></div></section>`;document.getElementById('retry').onclick=()=>openNavigator(true);document.getElementById('change').onclick=()=>{person='';localStorage.removeItem(PERSON_KEY);chooser();};}
async function openNavigator(forceFresh){if(!person){chooser();return;}if(!valid(access)){const cached=await readBundle();if(cached){launch(cached);return;}error('This browser does not have its saved workshop access yet. Open Navigator once on a previously trusted device or restore its saved browser data.');return;}loading('Connecting to the workshop service…');if(!forceFresh){const cached=await readBundle();if(cached){launch(cached);fetchFresh().then(r=>{if(r.auth&&r.html)saveBundle(r.html)}).catch(()=>{});return;}}try{const r=await fetchFresh();if(!r.auth){error('The saved device access was rejected. No task progress was changed.');return;}try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}await saveBundle(r.html);launch(r.html);}catch(e){const cached=await readBundle();if(cached){launch(cached);return;}error('The live workshop service is temporarily unavailable and this device does not yet have the new stable offline copy.');}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person)openNavigator(true);else chooser();
})();
