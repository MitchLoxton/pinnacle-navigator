:root{--bg:#f4f5f2;--surface:#fff;--ink:#111820;--muted:#69727a;--line:#e4e6e2;--navy:#102534;--gold:#d2a63d;--green:#23764a;--red:#a44740;--shadow:0 18px 46px rgba(22,31,38,.08)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg);scrollbar-gutter:stable}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fbfcfa 0,#f4f5f2 56%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}body:before{content:"";position:fixed;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--navy) 0 82%,var(--gold) 82%);z-index:9999}.shell{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 44px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:950;position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.sub{font-size:9px;color:var(--muted);font-weight:800;margin-top:3px;letter-spacing:.07em}.badge{padding:8px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:9px;font-weight:900}.panel{display:grid;grid-template-columns:minmax(0,.92fr) minmax(360px,1.08fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:var(--navy);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--gold)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#c8d0d7}.introPanel h1{font-size:clamp(35px,5vw,52px);line-height:.98;letter-spacing:-.055em;margin:12px 0 14px}.introPanel p{margin:0;color:#cbd2d8;font-size:14px;line-height:1.55} <body>
<!-- PN-LAUNCHER-5375 -->
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge">v53.68</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const PRIMARY='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5375';
const SAFE='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const PUBLIC_KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',ACCESS_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.68',BUILD='5375';
const PRIVATE_CACHE='pn-private-bundle-canonical',PRIVATE_URL=new URL('./.private-navigator-canonical',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view');
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seedAccessFromUrl(){try{const url=new URL(location.href),hp=new URLSearchParams(String(url.hash||'').replace(/^#/,''));let v=clean(url.searchParams.get('pn-access')||url.searchParams.get('access')||url.searchParams.get('pin')||hp.get('pn-access')||hp.get('access')||hp.get('pin')||'');if(!valid(v))return'';localStorage.setItem(ACCESS_KEY,v);url.searchParams.delete('pn-access');url.searchParams.delete('access');url.searchParams.delete('pin');url.hash='';history.replaceState(null,'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams.toString():''));return v;}catch(e){return'';}}
function recoverStoredAccess(){let found=seedAccessFromUrl()||clean(localStorage.getItem(ACCESS_KEY)||'');if(valid(found))return found;for(const store of [localStorage,sessionStorage]){try{for(let i=0;i<store.length;i++){const k=store.key(i)||'';if(!/(pin|access|navigator|crew)/i.test(k))continue;const v=clean(store.getItem(k)||'');if(valid(v)){localStorage.setItem(ACCESS_KEY,v);return v;}}}catch(e){}}return'';}
const qs=new URLSearchParams(location.search);let person=qs.get('crew')||localStorage.getItem(PERSON_KEY)||'',access=recoverStoredAccess(),busy=false;if(!NAMES[person])person='';if(person)try{localStorage.setItem(PERSON_KEY,person)}catch(e){}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function augment(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*workshop-ui-v2\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*workshop-ui-fast\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*workshop-ui\.js[^"']*["'][^>]*><\/script>/gi,'').replace(/<script[^>]+src=["'][^"']*runtime-late\.js[^"']*["'][^>]*><\/script>/gi,'');html=before(html,'</head>','<script src="./workshop-ui-fast.js?v='+BUILD+'"><\/script><!-- PN-NOVA-5375 -->');html=before(html,'</body>','<script src="./runtime-late.js?v='+BUILD+'"><\/script><!-- PN-LATE-5375 -->');return html;}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>')&&!/PN-LAUNCHER-\d+/.test(s);}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readCandidate(c,req){try{const r=await c.match(req);if(!r)return null;const html=await r.text();return bundleValid(html)?augment(html):null}catch(e){return null}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE,...names.filter(n=>n.startsWith('pn-private-bundle-')&&n!==PRIVATE_CACHE).sort().reverse()],seen=new Set();for(const name of order){if(seen.has(name))continue;seen.add(name);const c=await caches.open(name);if(name===PRIVATE_CACHE){const hit=await readCandidate(c,PRIVATE_URL);if(hit)return hit;}const keys=await c.keys();for(let i=keys.length-1;i>=0;i--){const hit=await readCandidate(c,keys[i]);if(hit){saveBundle(hit);return hit;}}}return null;}catch(e){return null;}}
function launch(html){document.open();document.write(html);document.close();}
async function fetchRoute(url,ms,pin){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','apikey':PUBLIC_KEY,'x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:pin||''}),signal:controller.signal,cache:'no-store'});if(r.status===401||r.status===403)return {auth:false,status:r.status};if(!r.ok)throw new Error('server '+r.status);const integrity=r.headers.get('x-navigator-integrity');if(integrity&&integrity!=='ok')throw new Error('integrity');const raw=await r.text();if(!bundleValid(raw))throw new Error('invalid bundle');return {auth:true,html:augment(raw)};}finally{clearTimeout(timer)}}
async function fetchLive(pin){let rejected=false,last=null;for(const url of [PRIMARY,SAFE]){try{const r=await fetchRoute(url,10000,pin);if(r.auth)return r;rejected=true;}catch(e){last=e;}}if(rejected)return {auth:false};throw last||new Error('workshop unavailable');}
function choosePerson(key,e){if(e){e.preventDefault();e.stopPropagation();}if(busy)return;busy=true;person=key;try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(x){}openNavigator(false);}
function bindChooser(){view.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),false));}
function chooser(message=''){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Work, made clear.</h1><p>One current job, simple crew controls, plans, packing and progress.</p><div class="readyRow"><span class="readyChip on">ONE-TAP CREW</span><span class="readyChip">SHARED PROGRESS</span><span class="readyChip">RECOVERY READY</span></div></div><div class="loginPanel"><div class="label">WHO IS WORKING?</div><h2>Choose your name</h2><div class="help">Tap once. Navigator remembers this browser and opens your work.</div><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div class="err">${esc(message)}</div></div></section>`;bindChooser();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Using the fastest verified workshop copy available.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">DEVICE ACCESS</div><h2>Couldn’t open yet.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button><button id="change" class="retry secondary" type="button">CHANGE CREW MEMBER</button></div></section>`;document.getElementById('retry').onclick=()=>{access=recoverStoredAccess();openNavigator(true)};document.getElementById('change').onclick=()=>{person='';localStorage.removeItem(PERSON_KEY);chooser();};}
async function openNavigator(forceFresh){if(!person){chooser();return;}access=recoverStoredAccess();loading('Checking this browser for a saved workshop copy…');const cached=await readBundle();if(cached&&!forceFresh){launch(cached);return;}if(!valid(access)){if(cached){launch(cached);return;}error('This browser has not been enrolled yet. Open the one-tap setup link once; there is no password field.');return;}loading('Connecting to the verified workshop service…');try{const r=await fetchLive(access);if(!r.auth){if(cached){launch(cached);return;}error('The saved workshop access was rejected. Open the one-tap setup link again.');return;}try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(ACCESS_KEY,access);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}await saveBundle(r.html);launch(r.html);}catch(e){if(cached){launch(cached);return;}error('The workshop service could not be reached and this browser has no saved workshop copy yet.');}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}if(person)openNavigator(false);else chooser();
})();
</script>
