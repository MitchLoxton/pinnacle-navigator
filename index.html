<div class="app"><div class="head"><div><div class="brand">Pinnacle Navigator</div><div class="sub">Mundi POS 1 · LIVE Shared Crew</div></div><div class="badge" id="versionBadge">v53.46</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5349';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const KEY='sb_publishable_VATM2AkVyl-yvxv28S2FXw_CqMpBr6q';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin',VERSION_KEY='pn_live_version',FALLBACK_VERSION='v53.46';
const BUNDLE_CACHE='pn-private-bundle-live-v5349',BUNDLE_CACHE_URL=new URL('./.private-navigator-live-v5349',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view'),versionBadge=document.getElementById('versionBadge');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'',loginBusy=false;
function showVersion(v){const x=String(v||FALLBACK_VERSION).trim()||FALLBACK_VERSION;if(versionBadge)versionBadge.textContent=x;document.title='Pinnacle Navigator · '+x;}showVersion(FALLBACK_VERSION);
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bundleLooksValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
function choosePerson(key,event){if(event){event.preventDefault();event.stopPropagation();}if(loginBusy)return;const input=document.getElementById('crewPin'),p=clean(input&&input.value),err=document.getElementById('err');if(!valid(p)){if(err)err.textContent='Enter all 6 PIN digits first.';if(input){input.value=p;input.focus();}return;}loginBusy=true;if(input)try{input.blur();}catch(e){}pin=p;person=key;openNavigator();}
function bindLogin(){const input=document.getElementById('crewPin');if(input){input.addEventListener('input',function(){this.value=clean(this.value);});input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();choosePerson(localStorage.getItem(PERSON_KEY)||'me',e);}});}view.querySelectorAll('[data-person]').forEach(btn=>{const key=btn.dataset.person;btn.addEventListener('click',e=>choosePerson(key,e),{capture:true});btn.addEventListener('touchend',e=>choosePerson(key,e),{passive:false,capture:true});});}
function login(message=''){loginBusy=false;view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR · LIVE</div><h1>Who are you?</h1><p class="intro">Enter the 6-digit crew PIN, then tap your name.</p><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="6 digits" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me">MITCHELL<small>Worker</small></button><button type="button" class="person" data-person="ronan">RONAN<small>Worker</small></button><button type="button" class="person" data-person="colin">COLIN<small>Foreman / decisions</small></button></div><div id="err" class="err">${esc(message)}</div><div class="note">v53.46 stable shell · minimal runtime · shared progress preserved.</div></section>`;bindLogin();}
function loading(message){view.innerHTML=`<section class="card loading"><div class="label">PINNACLE NAVIGATOR · LIVE</div><h1>Opening ${esc(NAMES[person]||'Navigator')}…</h1><div class="spinner"></div><div class="intro">${esc(message||'Opening the live workshop…')}</div></section>`;}
async function retireOldPrivateCaches(){try{if(!('caches'in window))return;const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pn-private-bundle-')&&k!==BUNDLE_CACHE).map(k=>caches.delete(k)));}catch(e){}}
async function saveCachedBundle(html){try{if(!('caches'in window)||!bundleLooksValid(html))return;const c=await caches.open(BUNDLE_CACHE);await c.put(BUNDLE_CACHE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8'}}));await retireOldPrivateCaches();}catch(e){}}
async function readCachedBundle(){try{if(!('caches'in window))return null;const c=await caches.open(BUNDLE_CACHE),r=await c.match(BUNDLE_CACHE_URL);if(!r)return null;const html=await r.text();return bundleLooksValid(html)?html:null;}catch(e){return null}}
function launch(html){document.open();document.write(html);document.close();}
async function post(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{return await fetch(url,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'x-navigator-shell':'v53.46-5349'},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer)}}
async function getResult(url,ms,enhanced){const res=await post(url,ms);if(res.status===401)return {auth:false};if(!res.ok)throw new Error('server '+res.status);if(enhanced&&(res.headers.get('x-navigator-integrity')||'')!=='ok')throw new Error('integrity');const html=await res.text();if(!bundleLooksValid(html))throw new Error('invalid bundle');return {auth:true,html,version:enhanced?((res.headers.get('x-navigator-version')||FALLBACK_VERSION).trim()||FALLBACK_VERSION):FALLBACK_VERSION};}
async function useResult(r){localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,r.version);showVersion(r.version);await saveCachedBundle(r.html);launch(r.html);}
async function openNavigator(){if(!person||!valid(pin)){login();return}const oldPin=localStorage.getItem(PIN_KEY)||'';loading('Opening the stable workshop…');try{const r=await getResult(ENDPOINT,12000,true);if(!r.auth){localStorage.removeItem(PIN_KEY);pin='';person='';login('Incorrect crew PIN.');return;}await useResult(r);return;}catch(e){console.error('enhanced open failed',e);}loading('Opening the safe workshop copy…');try{const r=await getResult(SAFE_ENDPOINT,12000,false);if(!r.auth){localStorage.removeItem(PIN_KEY);pin='';person='';login('Incorrect crew PIN.');return;}await useResult(r);return;}catch(e){console.error('safe open failed',e);}const cached=await readCachedBundle();if(cached&&oldPin===pin){launch(cached);return;}showError('Could not open Navigator. Tap TRY AGAIN.');}
function showError(message){loginBusy=false;view.innerHTML=`<section class="card"><div class="label">PINNACLE NAVIGATOR · LIVE</div><h1>Could not open</h1><p class="intro">${esc(message)}</p><button id="retry" class="retry" type="button">TRY AGAIN</button><div class="note">Your shared job progress has not been reset or marked DONE.</div></section>`;const b=document.getElementById('retry'),go=e=>{if(e){e.preventDefault();e.stopPropagation();}openNavigator();};b.addEventListener('click',go,{capture:true});b.addEventListener('touchend',go,{passive:false,capture:true});}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=5349',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
