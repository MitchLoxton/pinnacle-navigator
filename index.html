<style>
:root{--bg:#eeede8;--surface:#fff;--ink:#111417;--muted:#70726e;--line:#d6d5cf;--steel:#181d21;--steel2:#272f34;--amber:#f1b82d;--green:#23764a;--red:#9b3030;--shadow:0 24px 64px rgba(20,26,30,.13)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -180px,#fff 0,#f6f5f0 38%,#eeede8 78%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.shell{width:min(1040px,100%);margin:0 auto;padding:22px clamp(10px,3vw,26px) 38px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--steel),var(--steel2));color:#fff;display:grid;place-items:center;font-weight:950;box-shadow:0 9px 24px rgba(0,0,0,.14);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amber)}.brand{font-size:23px;font-weight:950;letter-spacing:-.035em}.sub{font-size:9px;color:var(--muted);font-weight:850;margin-top:2px;letter-spacing:.065em}.badge{padding:8px 11px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:950}.panel{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#293136 100%);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--amber),#ffd76a)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#c0c5c7}.introPanel h1{font-size:clamp(36px,5vw,54px);line-height:.96;letter-spacing:-.06em;margin:12px 0 15px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:25px}.readyChip{border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:950;color:#d9dddf}.readyChip.on{background:#e2f5e9;color:#1c603a;border-color:#e2f5e9}.loginPanel,.loadingBox{padding:34px}.label{font-size:9px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.loginPanel h2,.loadingBox h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.pinLabel{display:block;font-size:9px;font-weight:950;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}.pin{display:block;width:100%;border:2px solid #c8c7c0;border-radius:14px;padding:14px;font-size:24px;letter-spacing:.22em;text-align:center;background:#fafaf7;color:#111;outline:none}.pin:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(241,184,45,.16)}.names{display:grid;gap:8px;margin-top:12px}.person{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#111;text-align:left;padding:10px 14px;font-size:16px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.err{min-height:18px;margin-top:9px;font-size:10px;font-weight:900;color:var(--red)}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:56px;border:0;border-radius:13px;background:var(--steel);color:#fff;font-weight:950;font-size:14px;margin-top:12px}@media(max-width:740px){.shell{padding-top:10px}.mark{width:40px;height:40px}.brand{font-size:19px}.panel{display:block;border-radius:20px}.introPanel{padding:20px 17px}.introPanel h1{font-size:35px}.loginPanel,.loadingBox{padding:18px 16px 20px}}

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge" id="versionBadge">v53.54</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5361';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.54',BUILD='5361';
const PRIVATE_CACHE='pn-private-bundle-stable-v2',PRIVATE_URL=new URL('./.private-navigator-stable-v2',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view'),versionBadge=document.getElementById('versionBadge');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'',loginBusy=false;
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function crewRescueTag(){return `<script>(function(){function n(v){return String(v||'').replace(/\\s+/g,' ').trim().toUpperCase()}function chooser(){return n(document.body&&document.body.innerText).indexOf('WHO IS USING THIS PHONE')!==-1}function pin(){var a=document.querySelectorAll('input');for(var i=0;i<a.length;i++){var d=String(a[i].value||'').replace(/[^0-9]/g,'').slice(0,6);if(/^\\d{6}$/.test(d))return d}try{return localStorage.getItem('pn_live_pin')||''}catch(e){return''}}function enter(k,e){if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()}var p=pin();if(!/^\\d{6}$/.test(p)){alert('Enter the 6-digit crew PIN first.');return}try{localStorage.setItem('pn_live_pin',p);localStorage.setItem('pn_live_person',k);localStorage.setItem('pn_live_version','v53.54')}catch(x){}try{if(typeof state!=='undefined'&&state)state.currentUser=k;if(typeof renderTask==='function'){renderTask();if(!chooser())return}}catch(x){}setTimeout(function(){location.replace('./?crew='+encodeURIComponent(k)+'&force=5361&t='+Date.now())},80)}function bind(){if(!chooser())return;var map={MITCHELL:'me',RONAN:'ronan',COLIN:'colin'},els=document.querySelectorAll('button,[role=button],[onclick]');for(var i=0;i<els.length;i++){var el=els[i],t=n(el.textContent),k='';Object.keys(map).some(function(name){if(t===name||t.indexOf(name+' ')===0){k=map[name];return true}return false});if(!k||el.__pnCrewHardBind)continue;el.__pnCrewHardBind=1;el.style.pointerEvents='auto';el.style.cursor='pointer';(function(node,key){node.addEventListener('click',function(e){enter(key,e)},true);node.addEventListener('touchend',function(e){enter(key,e)},{capture:true,passive:false})})(el,k)}}bind();setTimeout(bind,100);setTimeout(bind,500);setTimeout(bind,1500);window.addEventListener('pageshow',bind)})();<\/script>`;}
function runtimeTags(){let x=crewRescueTag()+'<script src="./fabrication.js?v='+BUILD+'"><\/script><script src="./stability.js?v='+BUILD+'"><\/script>';MODULES.forEach(s=>x+='<script crossorigin="anonymous" src="'+ROOT+s+'?b='+BUILD+'"><\/script>');x+='<script src="./morning-pack.js?v='+BUILD+'"><\/script><script src="./workshop-ui-v2.js?v='+BUILD+'"><\/script>';return x;}
function stripOldRuntime(raw){let html=String(raw||'');html=html.replace(/<script[^>]+src=["'][^"']*(?:workshop-ui(?:-v2)?\.js|morning-pack\.js|stability\.js|fabrication\.js)[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<script[^>]+src=["'][^"']*supabase\.co\/functions\/v1\/navigator-v[^"']*["'][^>]*><\/script>/gi,'');html=html.replace(/<!-- PN-STABLE-[\s\S]*?-->/g,'');return html;}
function decorate(raw){let html=stripOldRuntime(raw).replace(/LIVE v\d+(?:\.\d+)?\s*·\s*[^<]*/g,'LIVE '+VERSION+' · WORKSHOP READY');return before(html,'</body>',runtimeTags()+'<!-- PN-STABLE-5361 crew-entry-hard-fix -->');}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE,'pn-private-bundle-stable-v1'].concat(names.filter(n=>n.indexOf('pn-private-bundle-')===0&&!['pn-private-bundle-stable-v1',PRIVATE_CACHE].includes(n)).sort().reverse());for(const name of order){const c=await caches.open(name),keys=await c.keys();for(const k of keys){if(k.url.indexOf('.private-navigator')===-1)continue;const r=await c.match(k);if(r){const html=await r.text();if(bundleValid(html))return html;}}}}catch(e){}return null;}
function launch(html){document.open();document.write(html);document.close();}
async function postBundle(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const html=decorate(await r.text());if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html};}finally{clearTimeout(timer)}}
async function fetchFresh(){let firstErr=null;try{return await postBundle(ENDPOINT,12000);}catch(e){firstErr=e;}try{return await postBundle(SAFE_ENDPOINT,12000);}catch(e){throw new Error((firstErr?firstErr.message+'; ':'')+e.message);}}
function backgroundRefresh(){try{if(!('serviceWorker'in navigator))return;navigator.serviceWorker.ready.then(reg=>{const w=navigator.serviceWorker.controller||reg.active||reg.waiting;if(w)w.postMessage({type:'REFRESH_BUNDLE',pin});}).catch(()=>{});}catch(e){}}
function choosePerson(key,event){if(event){event.preventDefault();event.stopPropagation();}if(loginBusy)return;const input=document.getElementById('crewPin'),p=clean(input&&input.value),err=document.getElementById('err');if(!valid(p)){if(err)err.textContent='Enter all 6 PIN digits first.';if(input)input.focus();return;}loginBusy=true;pin=p;person=key;openNavigator();}
function bindLogin(){const input=document.getElementById('crewPin');if(input)input.addEventListener('input',function(){this.value=clean(this.value);});view.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),true));}
function login(message=''){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Your whole workday, clear.</h1><p>Current job, morning packing, crew, plans and the full project in one workshop-first tool.</p><div class="readyRow"><span class="readyChip on">WORKSHOP READY</span><span class="readyChip">SHARED CREW</span><span class="readyChip">LOCAL RECOVERY</span></div></div><div class="loginPanel"><div class="label">CREW ACCESS</div><h2>Open Navigator</h2><div class="help">Enter the 6-digit crew PIN, then tap your name.</div><label class="pinLabel">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" maxlength="6" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div id="err" class="err">${esc(message)}</div></div></section>`;bindLogin();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Your workshop copy is being prepared. Existing progress remains intact.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">CONNECTION NEEDED</div><h2>Try again.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button></div></section>`;document.getElementById('retry').onclick=openNavigator;}
async function openNavigator(){if(!person||!valid(pin)){login();return;}const oldPin=localStorage.getItem(PIN_KEY)||'',cached=oldPin===pin?await readBundle():null;if(cached){const upgraded=decorate(cached);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(PIN_KEY,pin);localStorage.setItem(VERSION_KEY,VERSION);saveBundle(upgraded);backgroundRefresh();launch(upgraded);return;}loading('Connecting to the workshop service…');try{const r=await fetchFresh();if(!r.auth){pin='';person='';localStorage.removeItem(PIN_KEY);login('Incorrect crew PIN.');return;}localStorage.setItem(PERSON_KEY,person);localStorage.setItem(PIN_KEY,pin);localStorage.setItem(VERSION_KEY,VERSION);await saveBundle(r.html);backgroundRefresh();launch(r.html);}catch(e){error('Both workshop routes were unavailable. Your saved progress is untouched.');}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
</body>
