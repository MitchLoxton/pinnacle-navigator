<title>Pinnacle Navigator · v53.64</title>
<style>
:root{--bg:#f4f5f2;--surface:#fff;--ink:#111820;--muted:#69727a;--line:#e4e6e2;--navy:#102534;--gold:#d2a63d;--green:#23764a;--red:#a44740;--shadow:0 18px 46px rgba(22,31,38,.08)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg);scrollbar-gutter:stable}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fbfcfa 0,#f4f5f2 56%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}body:before{content:"";position:fixed;left:0;right:0;top:0;height:4px;background:var(--navy);z-index:9999}.shell{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:28px 0 44px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brandWrap{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:950;position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.sub{font-size:9px;color:var(--muted);font-weight:800;margin-top:3px;letter-spacing:.07em}.badge{padding:8px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:9px;font-weight:900}.panel{display:grid;grid-template-columns:minmax(0,.92fr) minmax(360px,1.08fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:var(--navy);color:#fff;padding:34px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--gold)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#c8d0d7}.introPanel h1{font-size:clamp(35px,5vw,52px);line-height:.98;letter-spacing:-.055em;margin:12px 0 14px}.introPanel p{margin:0;color:#cbd2d8;font-size:14px;line-height:1.55}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px}.readyChip{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 9px;font-size:8px;font-weight:850;color:#dce1e5}.readyChip.on{background:#e8f6ed;color:#1d6a40;border-color:#e8f6ed}.loginPanel,.loadingBox{padding:34px}.label{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--muted)}.loginPanel h2,.loadingBox h2{font-size:31px;letter-spacing:-.045em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:20px}.names{display:grid;gap:10px;margin-top:18px}.person{width:100%;min-height:70px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:left;padding:12px 16px;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.person:after{content:"›";font-size:28px;color:#777}.person:hover{border-color:#c7c0b7;background:#fdfcf9}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:750}.err{min-height:18px;margin-top:10px;font-size:10px;font-weight:850;color:var(--red)}.spinner{width:38px;height:38px;border:4px solid #e5e1da;border-top-color:var(--gold);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:54px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:900;font-size:14px;margin-top:12px;cursor:pointer}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button{font:inherit;touch-action:manipulation}@media(max-width:740px){html{scrollbar-gutter:auto}.shell{width:calc(100% - 14px);padding-top:14px}.mark{width:40px;height:40px}.brand{font-size:20px}.panel{display:block;border-radius:20px}.introPanel{padding:21px 18px}.introPanel h1{font-size:35px}.loginPanel,.loadingBox{padding:18px 16px 20px}.person{min-height:62px}}
</style>
</head>
<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge">v53.64</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5371';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',ACCESS_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.64',BUILD='5371';
const PRIVATE_CACHE='pn-private-bundle-stable-v10',PRIVATE_URL=new URL('./.private-navigator-stable-v10',location.href).href;
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view');
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);let person=qs.get('crew')||localStorage.getItem(PERSON_KEY)||'',access=clean(localStorage.getItem(ACCESS_KEY)||''),busy=false;if(!NAMES[person])person='';if(person)try{localStorage.setItem(PERSON_KEY,person)}catch(e){}
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function augment(raw){
  let html=String(raw||'');
  html=html.replace(/<script[^>]+src=["'][^"']*workshop-ui-v2\.js[^"']*["'][^>]*><\/script>/gi,'');
  html=html.replace(/<script[^>]+src=["'][^"']*workshop-ui-fast\.js[^"']*["'][^>]*><\/script>/gi,'');
  html=html.replace(/<script[^>]+src=["'][^"']*workshop-ui\.js[^"']*["'][^>]*><\/script>/gi,'');
  html=html.replace(/<script[^>]+src=["'][^"']*runtime-late\.js[^"']*["'][^>]*><\/script>/gi,'');
  html=before(html,'</head>','<script src="./workshop-ui-fast.js?v='+BUILD+'"><\/script><!-- PN-NOVA-UI-5371 -->');
  html=before(html,'</body>','<script src="./runtime-late.js?v='+BUILD+'"><\/script><!-- PN-LATE-5371 -->');
  return html;
}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const c=await caches.open(PRIVATE_CACHE),r=await c.match(PRIVATE_URL);if(!r)return null;const html=await r.text();return bundleValid(html)?html:null;}catch(e){return null;}}
function launch(html){document.open();document.write(html);document.close();}
async function fetchEnhanced(ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':VERSION+'-'+BUILD},body:JSON.stringify({projectId:PROJECT,pin:access}),signal:controller.signal,cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const integrity=r.headers.get('x-navigator-integrity');if(integrity&&integrity!=='ok')throw new Error('integrity');const raw=await r.text();if(!bundleValid(raw))throw new Error('invalid bundle');return {auth:true,html:augment(raw)};}finally{clearTimeout(timer)}}
function choosePerson(key,e){if(e){e.preventDefault();e.stopPropagation();}if(busy)return;busy=true;person=key;try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(x){}openNavigator(true);}
function bindChooser(){view.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',e=>choosePerson(btn.dataset.person,e),false));}
function chooser(message=''){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Work, made clear.</h1><p>One current job, simple crew controls, plans, packing and progress.</p><div class="readyRow"><span class="readyChip on">ONE-TAP CREW</span><span class="readyChip">SHARED PROGRESS</span><span class="readyChip">NEW VISUALS</span></div></div><div class="loginPanel"><div class="label">WHO IS WORKING?</div><h2>Choose your name</h2><div class="help">Tap once. Navigator remembers this device and opens your work.</div><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div class="err">${esc(message)}</div></div></section>`;bindChooser();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · ${VERSION}</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Loading the simplified visual interface.</p></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>Nearly there.</h2><div class="spinner"></div><div class="help">${esc(message)}</div></div></section>`;}
function error(message){busy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · RECOVERY</div><h1>Your job state is safe.</h1><p>No shared task progress has been changed.</p></div><div class="loadingBox"><div class="label">DEVICE ACCESS</div><h2>Couldn’t open yet.</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button><button id="change" class="retry secondary" type="button">CHANGE CREW MEMBER</button></div></section>`;document.getElementById('retry').onclick=()=>openNavigator(true);document.getElementById('change').onclick=()=>{person='';localStorage.removeItem(PERSON_KEY);chooser();};}
async function openNavigator(forceFresh){if(!person){chooser();return;}if(!valid(access)){const cached=await readBundle();if(cached){launch(cached);return;}error('This browser does not have its saved workshop access yet. No task data was changed.');return;}if(!forceFresh){const cached=await readBundle();if(cached){launch(cached);return;}}loading('Connecting to the verified workshop bundle…');try{const r=await fetchEnhanced(12000);if(!r.auth){error('The saved device access was rejected. No task progress was changed.');return;}try{localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION)}catch(e){}await saveBundle(r.html);launch(r.html);return;}catch(e){const cached=await readBundle();if(cached){launch(cached);return;}error('The workshop service could not be reached and this device has not yet saved the v53.64 offline copy. Tap TRY AGAIN when connected.');}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}if(person&&valid(access))openNavigator(true);else chooser();
})();
</script>
</body>
