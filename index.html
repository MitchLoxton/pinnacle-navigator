<title>Pinnacle Navigator · v53.51</title>
<script>
(function(){
  const ROOT_SCOPE='/pinnacle-navigator/';
  if(!location.pathname.startsWith(ROOT_SCOPE+'ytintel/'))return;
  document.documentElement.style.visibility='hidden';
  if(!('serviceWorker' in navigator)){document.documentElement.style.visibility='';return;}
  navigator.serviceWorker.getRegistrations().then(async regs=>{
    let removed=false;
    for(const reg of regs){try{if(new URL(reg.scope).pathname===ROOT_SCOPE)removed=(await reg.unregister())||removed;}catch(e){}}
    if(removed){location.reload();return;}
    document.documentElement.style.visibility='';
  }).catch(()=>{document.documentElement.style.visibility='';});
  setTimeout(()=>{document.documentElement.style.visibility='';},3000);
})();
</script>
<style>
:root{--bg:#efeee8;--surface:#fff;--ink:#111417;--muted:#73746f;--line:#d9d8d1;--steel:#1b2025;--amber:#f0b429;--green:#237449;--red:#9f2d2d;--shadow:0 22px 60px rgba(22,28,32,.12)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#e7e6df 0,#f5f4ef 340px,#efeee8 100%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit}.shell{width:min(920px,100%);margin:0 auto;padding:18px clamp(10px,3vw,24px) 34px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brandWrap{display:flex;align-items:center;gap:11px}.mark{width:45px;height:45px;border-radius:12px;background:var(--steel);color:#fff;display:grid;place-items:center;font-weight:950;letter-spacing:-.05em;box-shadow:0 8px 20px rgba(0,0,0,.12);position:relative;overflow:hidden}.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--amber)}.brand{font-size:21px;font-weight:950;letter-spacing:-.025em}.sub{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px;letter-spacing:.03em}.badge{padding:8px 10px;border-radius:999px;background:var(--steel);color:#fff;font-size:9px;font-weight:900;white-space:nowrap}.panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(340px,1.1fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.introPanel{background:linear-gradient(145deg,#171c20 0,#242b31 100%);color:#fff;padding:30px;position:relative}.introPanel:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--amber)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#bfc4c7}.introPanel h1{font-size:clamp(32px,5vw,50px);line-height:.98;letter-spacing:-.055em;margin:12px 0 14px}.introPanel p{margin:0;color:#cbd0d2;font-size:14px;line-height:1.55;max-width:380px}.readyRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px}.readyChip{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 8px;font-size:8px;font-weight:900;color:#d9dddf}.readyChip.on{background:#dff3e6;color:#1c5e39;border-color:#dff3e6}.loginPanel{padding:30px}.label{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--muted)}.loginPanel h2{font-size:30px;letter-spacing:-.035em;margin:6px 0 5px}.help{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:20px}.pinLabel{display:block;font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}.pin{display:block;width:100%;border:2px solid #c8c7c0;border-radius:13px;padding:14px;font-size:24px;letter-spacing:.22em;text-align:center;background:#fafaf7;color:#111;outline:none}.pin:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(240,180,41,.16)}.names{display:grid;gap:8px;margin-top:12px}.person{width:100%;min-height:62px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#111;text-align:left;padding:10px 13px;font-size:16px;font-weight:950;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.person:after{content:"›";font-size:26px;color:#777}.person:hover{border-color:#a7a69f;background:#fafaf7}.person:active{transform:scale(.995)}.person small{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}.err{min-height:18px;margin-top:9px;font-size:10px;font-weight:900;color:var(--red)}.loadingBox{padding:48px 30px;text-align:center}.loadingBox h2{font-size:32px;letter-spacing:-.035em;margin:8px 0}.spinner{width:40px;height:40px;border:4px solid #deddd7;border-top-color:var(--amber);border-radius:50%;margin:20px auto;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--steel);color:#fff;font-weight:900;font-size:14px;margin-top:12px}.note{font-size:9px;color:var(--muted);line-height:1.45;margin-top:12px}@media(max-width:720px){.shell{padding-top:10px}.mast{margin-bottom:9px}.mark{width:39px;height:39px}.brand{font-size:18px}.sub{font-size:8px}.panel{display:block;border-radius:19px}.introPanel{padding:19px 17px}.introPanel h1{font-size:34px;margin:8px 0 9px}.introPanel p{font-size:12px}.readyRow{margin-top:14px}.loginPanel{padding:18px 16px 20px}.loginPanel h2{font-size:26px}.person{min-height:58px}.badge{font-size:8px}}
</style>

<body>
<div class="shell"><div class="mast"><div class="brandWrap"><div class="mark">PN</div><div><div class="brand">Pinnacle Navigator</div><div class="sub">MUNDI POS 1 · WORKSHOP CONTROL</div></div></div><div class="badge" id="versionBadge">v53.51</div></div><main id="view"></main></div>
<script>
(function(){'use strict';
const ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-v52?shell=5356';
const SAFE_ENDPOINT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/navigator-bundle-safe';
const ROOT='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/';
const PROJECT='mundi-pos1',PERSON_KEY='pn_live_person',PIN_KEY='pn_live_pin',VERSION_KEY='pn_live_version',VERSION='v53.51';
const PRIVATE_CACHE='pn-private-bundle-stable-v1',PRIVATE_URL=new URL('./.private-navigator-stable',location.href).href;
const MODULES=['navigator-v536-mobile-stable','navigator-v5335-today','navigator-v5338-colin-method','navigator-v5345-work-register','navigator-v5349-anyone-done'];
const NAMES={me:'Mitchell',ronan:'Ronan',colin:'Colin'},view=document.getElementById('view'),versionBadge=document.getElementById('versionBadge');
let person=localStorage.getItem(PERSON_KEY)||'',pin=localStorage.getItem(PIN_KEY)||'',loginBusy=false;
function showVersion(v){const x=String(v||VERSION);if(versionBadge)versionBadge.textContent=x;document.title='Pinnacle Navigator · '+x;}showVersion(VERSION);
const clean=v=>String(v||'').replace(/[^0-9]/g,'').slice(0,6),valid=v=>/^\d{6}$/.test(v),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function before(html,needle,insert){const i=html.lastIndexOf(needle);return i<0?html+insert:html.slice(0,i)+insert+html.slice(i);}
function runtimeTags(){let x='<script src="./fabrication.js?v=5356"><\/script><script src="./stability.js?v=5356"><\/script><script src="./workshop-ui.js?v=5356"><\/script>';MODULES.forEach(s=>x+='<script crossorigin="anonymous" src="'+ROOT+s+'?b=5356"><\/script>');return x;}
function decorateSafe(raw){let html=String(raw||'').replace(/LIVE v48 · WORKSHOP READY/g,'LIVE v53.51 · WORKSHOP');return before(html,'</body>',runtimeTags()+'<!-- PN-STABLE-5356 polished-cached-first -->');}
function upgradeCached(raw){let html=String(raw||'');if(html.indexOf('workshop-ui.js')===-1)html=before(html,'</body>','<script src="./stability.js?v=5356"><\/script><script src="./workshop-ui.js?v=5356"><\/script><!-- PN-UI-UPGRADE-5356 -->');return html;}
function bundleValid(html){const s=String(html||'');return s.toLowerCase().includes('<html')&&s.includes('Pinnacle Navigator')&&s.includes('</body>');}
async function saveBundle(html,version){try{if(!('caches'in window)||!bundleValid(html))return;const c=await caches.open(PRIVATE_CACHE);await c.put(PRIVATE_URL,new Response(html,{headers:{'content-type':'text/html;charset=utf-8','x-pn-version':version||VERSION,'x-pn-cached-at':new Date().toISOString()}}));}catch(e){}}
async function readBundle(){try{if(!('caches'in window))return null;const names=await caches.keys(),order=[PRIVATE_CACHE].concat(names.filter(n=>n!==PRIVATE_CACHE&&n.indexOf('pn-private-bundle-')===0).sort().reverse());for(const name of order){const c=await caches.open(name);let r=await c.match(PRIVATE_URL);if(!r){const keys=await c.keys();for(const k of keys)if(k.url.indexOf('.private-navigator')!==-1){r=await c.match(k);if(r)break;}}if(r){const html=await r.text();if(bundleValid(html))return html;}}}catch(e){}return null;}
function launch(html){document.open();document.write(html);document.close();}
async function post(url,ms){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{return await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-navigator-shell':'v53.51-5356'},body:JSON.stringify({projectId:PROJECT,pin}),signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer);}}
async function fetchEnhanced(ms){const r=await post(ENDPOINT,ms);if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);if((r.headers.get('x-navigator-integrity')||'')!=='ok')throw new Error('integrity');const html=await r.text();if(!bundleValid(html))throw new Error('invalid bundle');return {auth:true,html:html,version:(r.headers.get('x-navigator-version')||VERSION)};}
async function fetchSafe(ms){const r=await post(SAFE_ENDPOINT,ms);if(r.status===401)return {auth:false};if(!r.ok)throw new Error('server '+r.status);const html=decorateSafe(await r.text());if(!bundleValid(html))throw new Error('invalid safe bundle');return {auth:true,html:html,version:VERSION};}
function askBackgroundRefresh(){try{if(!('serviceWorker'in navigator))return;navigator.serviceWorker.ready.then(reg=>{const w=navigator.serviceWorker.controller||reg.active||reg.waiting;if(w)w.postMessage({type:'REFRESH_BUNDLE',pin:pin});}).catch(()=>{});}catch(e){}}
function choosePerson(key,event){if(event){event.preventDefault();event.stopPropagation();}if(loginBusy)return;const input=document.getElementById('crewPin'),p=clean(input&&input.value),err=document.getElementById('err');if(!valid(p)){if(err)err.textContent='Enter all 6 PIN digits first.';if(input){input.value=p;input.focus();}return;}loginBusy=true;pin=p;person=key;try{input.blur();}catch(e){}openNavigator();}
function bindLogin(){const input=document.getElementById('crewPin');if(input){input.addEventListener('input',function(){this.value=clean(this.value);});input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();choosePerson(localStorage.getItem(PERSON_KEY)||'me',e);}});}view.querySelectorAll('[data-person]').forEach(btn=>{const key=btn.dataset.person;btn.addEventListener('click',e=>choosePerson(key,e),{capture:true});btn.addEventListener('touchend',e=>choosePerson(key,e),{passive:false,capture:true});});}
function login(message=''){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE BUILDERS · LIVE JOB TOOL</div><h1>Built for the workshop.</h1><p>Open the current job, plans, crew state and full project work without digging through paperwork. The device keeps a verified local workshop copy ready after the first successful sign-in.</p><div class="readyRow"><span class="readyChip on">READY</span><span class="readyChip">SHARED CREW</span><span class="readyChip">LOCAL RECOVERY</span></div></div><div class="loginPanel"><div class="label">CREW ACCESS</div><h2>Who are you?</h2><div class="help">Enter the 6-digit crew PIN, then tap your name.</div><label class="pinLabel" for="crewPin">CREW PIN</label><input id="crewPin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" value="${esc(clean(pin))}"><div class="names"><button type="button" class="person" data-person="me"><span>MITCHELL<small>Worker</small></span></button><button type="button" class="person" data-person="ronan"><span>RONAN<small>Worker</small></span></button><button type="button" class="person" data-person="colin"><span>COLIN<small>Foreman / decisions</small></span></button></div><div id="err" class="err">${esc(message)}</div><div class="note">Your shared task progress is not changed by signing in or refreshing.</div></div></section>`;bindLogin();}
function loading(message){view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR · WORKSHOP</div><h1>Opening ${esc(NAMES[person]||'Navigator')}.</h1><p>Your verified job copy is being prepared. Existing DONE states, assignments and project information stay intact.</p><div class="readyRow"><span class="readyChip on">STABLE BUILD</span></div></div><div class="loadingBox"><div class="label">OPENING WORKSHOP</div><h2>${esc(message||'Loading the job…')}</h2><div class="spinner"></div><div class="note">First load on a new device needs a successful connection. After that, Navigator opens from its saved workshop copy first.</div></div></section>`;}
async function openNavigator(){
  if(!person||!valid(pin)){login();return;}
  const oldPin=localStorage.getItem(PIN_KEY)||'',cached=oldPin===pin?await readBundle():null;
  if(cached){localStorage.setItem(PERSON_KEY,person);askBackgroundRefresh();launch(upgradeCached(cached));return;}
  loading('Preparing this device…');
  try{const r=await fetchEnhanced(12000);if(!r.auth){localStorage.removeItem(PIN_KEY);pin='';person='';login('Incorrect crew PIN.');return;}localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,r.version||VERSION);await saveBundle(r.html,r.version);askBackgroundRefresh();launch(r.html);return;}catch(e){console.error('enhanced open failed',e);}
  loading('Opening the recovery copy…');
  try{const r=await fetchSafe(12000);if(!r.auth){localStorage.removeItem(PIN_KEY);pin='';person='';login('Incorrect crew PIN.');return;}localStorage.setItem(PIN_KEY,pin);localStorage.setItem(PERSON_KEY,person);localStorage.setItem(VERSION_KEY,VERSION);await saveBundle(r.html,VERSION);askBackgroundRefresh();launch(r.html);return;}catch(e){console.error('safe open failed',e);}
  showError('This device needs one successful connection before its saved workshop copy exists. Tap TRY AGAIN.');
}
function showError(message){loginBusy=false;view.innerHTML=`<section class="panel"><div class="introPanel"><div class="eyebrow">PINNACLE NAVIGATOR</div><h1>Job data is safe.</h1><p>Navigator could not seed this device yet. No shared task state was reset or marked complete.</p></div><div class="loadingBox"><div class="label">RECOVERY</div><h2>Could not open yet</h2><div class="help">${esc(message)}</div><button id="retry" class="retry" type="button">TRY AGAIN</button></div></section>`;const b=document.getElementById('retry'),go=e=>{if(e){e.preventDefault();e.stopPropagation();}openNavigator();};b.addEventListener('click',go,{capture:true});b.addEventListener('touchend',go,{passive:false,capture:true});}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=5356',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});}
if(person&&valid(pin))openNavigator();else login();
})();
</script>
