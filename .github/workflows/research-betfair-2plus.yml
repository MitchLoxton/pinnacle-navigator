name: Research Betfair 2plus reconstruction

on:
  push:
    branches:
      - research/betfair-2plus
    paths:
      - 'research/betfair_2plus_scan.py'
      - '.github/workflows/research-betfair-2plus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Reconstruct and test
        run: python research/betfair_2plus_scan.py

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betfair-2plus-research
          path: research/output_2plus/
          if-no-files-found: warn
          retention-days: 30
