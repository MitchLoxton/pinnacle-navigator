name: Fix Racing History Tab

on:
  push:
    paths:
      - '.github/workflows/fix-racing-history-tab.yml'

permissions:
  contents: write

jobs:
  fix-history:
    if: github.event.head_commit.message == 'Add one-time racing History repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch History render collision and bump client build
        shell: python
        run: |
          from pathlib import Path

          p = Path('racing/premium-ui.js')
          s = p.read_text(encoding='utf-8')

          old = """    window.addEventListener('mitchell-base-ready',event=>{data=event.detail||window.__MITCHELL_BASE_DATA||data;render();});
    window.addEventListener('mitchell-assist-health',event=>{assist={...assist,...(event.detail||{})};render();});
    window.addEventListener('mitchell-preflight-health',event=>{preflight={...preflight,...(event.detail||{})};render();});
    window.addEventListener('mitchell-live-health',event=>{live={...live,...(event.detail||{})};if(activeTab==='home') render();});
    window.addEventListener('online',render);
    window.addEventListener('offline',render);"""

          new = """    const renderPassive=()=>{ if(activeTab!=='history') render(); };
    window.addEventListener('mitchell-base-ready',event=>{data=event.detail||window.__MITCHELL_BASE_DATA||data;renderPassive();});
    window.addEventListener('mitchell-assist-health',event=>{assist={...assist,...(event.detail||{})};renderPassive();});
    window.addEventListener('mitchell-preflight-health',event=>{preflight={...preflight,...(event.detail||{})};renderPassive();});
    window.addEventListener('mitchell-live-health',event=>{live={...live,...(event.detail||{})};if(activeTab==='home') render();});
    window.addEventListener('online',renderPassive);
    window.addEventListener('offline',renderPassive);"""

          if old not in s:
              raise SystemExit('premium-ui.js target block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Keep every update layer on one build so the service worker cannot bounce the page.
          p = Path('racing/app.js')
          s = p.read_text(encoding='utf-8')
          if "const CLIENT_BUILD = '1.11.0';" not in s:
              raise SystemExit('app.js build marker not found')
          s = s.replace("const CLIENT_BUILD = '1.11.0';", "const CLIENT_BUILD = '1.11.3';", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('racing/version.json')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"build": "1.11.0"', '"build": "1.11.3"')
          s = s.replace('"minimumClientBuild": "1.11.0"', '"minimumClientBuild": "1.11.3"')
          p.write_text(s, encoding='utf-8')

          p = Path('racing/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('data-build="1.11.2"', 'data-build="1.11.3"')
          s = s.replace('Race-Day v1.11.2', 'Race-Day v1.11.3')
          s = s.replace('./app.js?v=111', './app.js?v=113')
          s = s.replace('./premium-ui.js?v=111', './premium-ui.js?v=113')
          s = s.replace('./bet-history.js?v=3', './bet-history.js?v=4')
          p.write_text(s, encoding='utf-8')

          p = Path('racing/sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const BUILD = '1.11.2';", "const BUILD = '1.11.3';")
          s = s.replace("const CACHE = 'mitchell-racing-v1112-system-history';", "const CACHE = 'mitchell-racing-v1113-history-stable';")
          s = s.replace("'./premium-ui.js?v=111'", "'./premium-ui.js?v=113'")
          s = s.replace("'./bet-history.js?v=3'", "'./bet-history.js?v=4'")
          p.write_text(s, encoding='utf-8')

      - name: Sanity checks
        run: |
          node --check racing/premium-ui.js
          node --check racing/app.js
          node --check racing/bet-history.js
          node --check racing/sw.js
          python -m json.tool racing/version.json >/dev/null
          git diff --check
          grep -q "activeTab!=='history'" racing/premium-ui.js
          grep -q "1.11.3" racing/app.js
          grep -q "1.11.3" racing/version.json
          grep -q "1.11.3" racing/index.html
          grep -q "1.11.3" racing/sw.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add racing/premium-ui.js racing/app.js racing/version.json racing/index.html racing/sw.js
          git rm .github/workflows/fix-racing-history-tab.yml
          git commit -m "Fix racing History tab flashing"
          git push origin HEAD:main
