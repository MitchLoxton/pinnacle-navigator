name: Fix Watchlist Flash

on:
  push:
    paths:
      - '.github/workflows/fix-watchlist-flash.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python .github/scripts/fix_watchlist_stability.py

      - name: Sanity checks
        run: |
          node --check racing/premium-ui.js
          node --check racing/watchlist-odds.js
          node --check racing/app.js
          node --check racing/sw.js
          python -m json.tool racing/version.json >/dev/null
          git diff --check
          grep -q "marketRenderKey" racing/watchlist-odds.js
          grep -q "activeTab==='home'" racing/premium-ui.js
          grep -q "1.11.7" racing/index.html

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add racing/premium-ui.js racing/watchlist-odds.js racing/app.js racing/version.json racing/index.html racing/sw.js
          git rm .github/workflows/fix-watchlist-flash.yml .github/scripts/fix_watchlist_stability.py
          git commit -m "Fix Watchlist flashing while odds refresh"
          git push origin HEAD:main
