name: YTIntel Live Phone Check
on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-phone:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser emulation
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Verify real production layout - no AI requests
        run: node ytintel/tests/phone0331-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytintel-live-phone-proof
          path: phone-live-proof
          retention-days: 7
