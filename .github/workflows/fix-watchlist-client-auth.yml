name: Fix Watchlist Client Auth

on:
  push:
    paths:
      - '.github/workflows/fix-watchlist-client-auth.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch client and bump build
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('racing/watchlist-odds.js')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r"\n\s*const ANON = '[^']+';", "\n  const APP_TOKEN = 'mitchell-racing-watchlist-readonly-v1';", s, count=1)
          if n != 1:
              raise SystemExit('old Watchlist key declaration not found')
          s = s2
          pattern = r"headers:\{\s*'Content-Type':'application/json',\s*apikey:ANON,\s*Authorization:`Bearer \$\{ANON\}`\s*\},"
          replacement = "headers:{\n        'Content-Type':'application/json',\n        'x-mitchell-watchlist':APP_TOKEN\n      },"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('old Watchlist auth headers not found')
          p.write_text(s2, encoding='utf-8')

          p = Path('racing/app.js')
          s = p.read_text(encoding='utf-8')
          if "const CLIENT_BUILD = '1.11.7';" not in s:
              raise SystemExit('app.js build 1.11.7 not found')
          p.write_text(s.replace("const CLIENT_BUILD = '1.11.7';", "const CLIENT_BUILD = '1.11.8';", 1), encoding='utf-8')

          p = Path('racing/version.json')
          s = p.read_text(encoding='utf-8')
          if '"build": "1.11.7"' not in s:
              raise SystemExit('version build 1.11.7 not found')
          s = s.replace('"build": "1.11.7"', '"build": "1.11.8"', 1)
          s = s.replace('"minimumClientBuild": "1.11.7"', '"minimumClientBuild": "1.11.8"', 1)
          s = s.replace('STABLE LIVE WATCHLIST ODDS', 'STABLE LIVE WATCHLIST ODDS · LIVE AUTH OK', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('racing/index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-build="1.11.7"' not in s:
              raise SystemExit('index build 1.11.7 not found')
          s = s.replace('data-build="1.11.7"', 'data-build="1.11.8"', 1)
          s = s.replace('Race-Day v1.11.7 · STABLE LIVE WATCHLIST ODDS', 'Race-Day v1.11.8 · STABLE LIVE WATCHLIST ODDS', 1)
          s = s.replace('./app.js?v=117', './app.js?v=118', 1)
          s = s.replace('./watchlist-odds.js?v=2', './watchlist-odds.js?v=3', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('racing/sw.js')
          s = p.read_text(encoding='utf-8')
          if "const BUILD = '1.11.7';" not in s:
              raise SystemExit('sw build 1.11.7 not found')
          s = s.replace("const BUILD = '1.11.7';", "const BUILD = '1.11.8';", 1)
          s = s.replace("const CACHE = 'mitchell-racing-v1117-stable-live-watchlist-odds';", "const CACHE = 'mitchell-racing-v1118-live-watchlist-odds-auth';", 1)
          s = s.replace("'./watchlist-odds.js?v=2'", "'./watchlist-odds.js?v=3'", 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        run: |
          node --check racing/watchlist-odds.js
          node --check racing/app.js
          node --check racing/sw.js
          python -m json.tool racing/version.json >/dev/null
          git diff --check
          grep -q "x-mitchell-watchlist" racing/watchlist-odds.js
          grep -q "mitchell-racing-watchlist-readonly-v1" racing/watchlist-odds.js
          if grep -q "Authorization.*ANON" racing/watchlist-odds.js; then exit 1; fi
          grep -q "1.11.8" racing/app.js
          grep -q "1.11.8" racing/version.json
          grep -q "1.11.8" racing/index.html
          grep -q "1.11.8" racing/sw.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add racing/watchlist-odds.js racing/app.js racing/version.json racing/index.html racing/sw.js
          git rm .github/workflows/fix-watchlist-client-auth.yml
          git commit -m "Fix Watchlist live odds client auth"
          git push origin HEAD:main
