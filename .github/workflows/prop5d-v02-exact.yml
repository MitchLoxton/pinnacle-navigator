name: PROP5D v0.2 exact chronology

on:
  push:
    branches:
      - research/prop5d-v02-exact-20260828
    paths:
      - 'research/prop5d_nqquant_partial_replay.py'
      - '.github/workflows/prop5d-v02-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nqquant-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas pyarrow pyyaml scipy

      - name: Fetch frozen public strategy source
        run: git clone --depth 1 https://github.com/s583381747/nq-quant.git /tmp/nq-quant

      - name: Fetch independent NQ one-minute history
        run: |
          curl -L --fail --retry 3 -o /tmp/Dataset_NQ_1min_2022_2025.csv https://raw.githubusercontent.com/s-k-28/nq-es-trader-5k-payout/main/data/Dataset_NQ_1min_2022_2025.csv
          ls -lh /tmp/Dataset_NQ_1min_2022_2025.csv

      - name: Run independent chronological NQ Quant V4 replay
        env:
          NQ_QUANT_DIR: /tmp/nq-quant
          NQ_CSV: /tmp/Dataset_NQ_1min_2022_2025.csv
          PROP5D_OUT: prop5d_nqquant_results
        run: python research/prop5d_nqquant_partial_replay.py | tee prop5d_nqquant_replay.log

      - name: Upload exact chronology artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prop5d-v02-nqquant-independent
          path: |
            prop5d_nqquant_results/
            prop5d_nqquant_replay.log
          if-no-files-found: warn
