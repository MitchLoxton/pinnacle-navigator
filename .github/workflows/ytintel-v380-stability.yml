name: YTIntel v0.39 Stability Smoke

on:
  push:
    branches: [main]
    paths:
      - 'ytintel/latest/index.html'
      - 'ytintel/latest/v390-stable-shell.js'
      - 'ytintel/latest/v390-wpm-guard.js'
      - 'ytintel/latest/v390-stable-intelligence.js'
      - 'ytintel/latest/v340-zero-credit.js'
      - 'ytintel/latest/v340-zero-credit.css'
      - 'ytintel/latest/v371-mobile-containment.css'
      - 'ytintel/latest/sw.js'
      - 'ytintel/tests/v390-browser.mjs'
      - '.github/workflows/ytintel-v380-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and one-entry contract
        run: |
          set -euo pipefail
          node --check ytintel/latest/v390-stable-shell.js
          node --check ytintel/latest/v390-wpm-guard.js
          node --check ytintel/latest/v390-stable-intelligence.js
          node --check ytintel/latest/v340-zero-credit.js
          test "$(grep -o '<script ' ytintel/latest/index.html | wc -l)" -eq 1
          grep -q 'v390-stable-shell.js?v=0390' ytintel/latest/index.html
          ! grep -q 'v360-entry.js' ytintel/latest/index.html
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Real source, intelligence, navigation and phone smoke
        run: node ytintel/tests/v390-browser.mjs
