name: YTIntel v037 Premium Endgame Gate
on:
  push:
    branches: ["endgame-v0360"]
    paths:
      - "ytintel/latest/**"
      - "ytintel/backend/**"
      - "ytintel/tests/v360-*.mjs"
      - "ytintel/tests/v361-review-browser.mjs"
      - "ytintel/tests/v363-premium-browser.mjs"
      - "ytintel/tests/production-v370.mjs"
      - ".github/workflows/ytintel-v360-branch.yml"
      - ".github/workflows/ytintel-production-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ytintel-v037-premium-endgame-gate
  cancel-in-progress: true
jobs:
  premium-endgame:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and v037 release contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < ytintel/latest/v360-entry.js
          node --input-type=module --check < ytintel/latest/v366-local-ai-shield.js
          node --input-type=module --check < ytintel/latest/v361-capability-guard.js
          node --input-type=module --check < ytintel/latest/v361-review-fixes.js
          node --input-type=module --check < ytintel/latest/v360-endgame.js
          node --input-type=module --check < ytintel/latest/v366-local-ai-optin.js
          node --input-type=module --check < ytintel/latest/v362-source-polish.js
          node --input-type=module --check < ytintel/latest/v363-premium-brief.js
          node --input-type=module --check < ytintel/latest/v364-fact-surfaces.js
          node --input-type=module --check < ytintel/latest/v365-canonical-shell.js
          node --input-type=module --check < ytintel/latest/v360-local-ai.js
          node --input-type=module --check < ytintel/latest/v360-media-intel.js
          node --input-type=module --check < ytintel/latest/v360-cloud.js
          node --check ytintel/tests/production-v370.mjs
          jq empty ytintel/latest/manifest.webmanifest
          jq empty ytintel/latest/release.json
          grep -q 'v360-entry.js?v=0370' ytintel/latest/index.html
          grep -q 'v360-endgame.css?v=0370' ytintel/latest/index.html
          grep -q 'v366-local-ai-shield.js?v=0370' ytintel/latest/v360-entry.js
          grep -q 'v366-local-ai-optin.js?v=0370' ytintel/latest/v360-entry.js
          grep -q 'v363-premium-brief.js?v=0370' ytintel/latest/v360-entry.js
          grep -q 'v364-fact-surfaces.js?v=0370' ytintel/latest/v360-entry.js
          grep -q 'v365-canonical-shell.js?v=0370' ytintel/latest/v360-entry.js
          grep -q "const RELEASE='0.37.0'" ytintel/latest/v360-entry.js
          grep -q 'ytintel-shell-v0370-r2' ytintel/latest/sw.js
          grep -q 'v366-local-ai-shield.js?v=0370' ytintel/latest/sw.js
          grep -q 'v366-local-ai-optin.js?v=0370' ytintel/latest/sw.js
          grep -q 'The claims ledger' ytintel/latest/v363-premium-brief.js
          grep -q 'Cross-channel validation sample' ytintel/latest/v363-premium-brief.js
          grep -q 'Download Markdown' ytintel/latest/v363-premium-brief.js
          grep -q 'TITLE SURFACE CHECK' ytintel/latest/v364-fact-surfaces.js
          grep -q '18-section premium source-backed analysis' ytintel/latest/v365-canonical-shell.js
          grep -q 'production-v370.mjs' .github/workflows/ytintel-production-smoke.yml
          test "$(grep -o '<script ' ytintel/latest/index.html | wc -l)" -eq 1
          ! grep -q 'research-stage' ytintel/latest/v360-endgame.js
          ! grep -q 'ytintel-v093' ytintel/latest/v360-endgame.js
          grep -q 'GROUP VIDEO ANALYSIS' ytintel/latest/v360-endgame.js
          grep -q 'WATCHTOWER' ytintel/latest/v360-endgame.js
          grep -q 'ytintel_analysis_vault' ytintel/latest/v360-cloud.js
      - name: Real zero-credit media backend contract
        run: node ytintel/tests/v360-media-contract.mjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start local YTIntel shell
        shell: bash
        run: |
          nohup python3 -m http.server 4173 </dev/null >/tmp/ytintel-v037-http.log 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ytintel/latest/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/ytintel-v037-http.log
          exit 1
      - name: Premium 09-09 benchmark-depth browser acceptance
        run: node ytintel/tests/v363-premium-browser.mjs
      - name: Capture tested v037 source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-v037-source-and-proof
          path: |
            ytintel/latest
            ytintel/tests/v360-*.mjs
            ytintel/tests/v363-premium-browser.mjs
            ytintel/tests/production-v370.mjs
            ytintel-v037-premium-mobile.png
          retention-days: 7
