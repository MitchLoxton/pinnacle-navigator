name: Closing Odds Smoke Test

on:
  push:
    branches:
      - racing-v163-closing-odds

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call closing odds endpoint
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrbWFja3RjZmh1YnN1bXdyeWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTY4OTQsImV4cCI6MjEwMjAzMjg5NH0.EUZ5Xd6rLsxoZIpfPwVzH-TUcz1t8-j1DVZ6ES8A1zk
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 50 \
            -X POST 'https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/racing-closing-odds' \
            -H 'Content-Type: application/json' \
            -H "apikey: ${ANON}" \
            -H "Authorization: Bearer ${ANON}" \
            --data '{"requests":[{"race":"PR2","date":"2026-08-29","venue":"Belmont Park"},{"race":"SR6","date":"2026-08-29","venue":"Rosehill Gardens"}]}' \
            -o response.json
          cat response.json | jq .
          jq -e '.ok == true' response.json >/dev/null
          jq -e '.results | length == 2' response.json >/dev/null
          jq -e '.results[0].ok == true' response.json >/dev/null
          jq -e '.results[0].favourites | map(.name) | index("SEPTEMBER BORN") != null' response.json >/dev/null
          jq -e '.results[0].favouritePrice == 2.8' response.json >/dev/null
