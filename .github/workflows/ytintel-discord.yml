name: YTIntel Discord Notifications

on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Release notification rule:
# - YTIntel code/assets can be committed freely without Discord spam.
# - When a release is ready, update ytintel/latest/release.json LAST.
# - Only a successful Pages deployment containing that release.json change posts to Discord.
# - Cancelled/intermediate/failed deploys never create release spam.

jobs:
  release-notify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check whether this commit finalizes a YTIntel release
        id: release
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          FILES="$(git diff-tree --no-commit-id --name-only -r "$SHA" || true)"
          echo "$FILES"
          if printf '%s\n' "$FILES" | grep -qx 'ytintel/latest/release.json'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post one release note to Discord
        if: steps.release.outputs.ready == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_YTINTEL_WEBHOOK is not configured; skipping Discord post."
            exit 0
          fi
          if [ ! -f ytintel/latest/release.json ]; then
            echo "release.json missing; skipping."
            exit 0
          fi

          VERSION="$(jq -r '.version // "Unversioned"' ytintel/latest/release.json)"
          RELEASE_TITLE="$(jq -r '.title // "YTIntel update"' ytintel/latest/release.json)"
          SUMMARY="$(jq -r '.summary // "The newest YTIntel release is live."' ytintel/latest/release.json)"
          WHY="$(jq -r '.why_it_matters // empty' ytintel/latest/release.json)"
          CHANGES="$(jq -r '[.changes[]? | "• " + .] | join("\n")' ytintel/latest/release.json)"
          SHORT_SHA="${SHA:0:7}"

          # Discord embed field values cap at 1024 characters.
          CHANGES="${CHANGES:0:1000}"
          WHY="${WHY:0:1000}"

          PAYLOAD="$(jq -n \
            --arg version "$VERSION" \
            --arg release_title "$RELEASE_TITLE" \
            --arg summary "$SUMMARY" \
            --arg changes "$CHANGES" \
            --arg why "$WHY" \
            --arg live "$LIVE_URL" \
            --arg run "$RUN_URL" \
            --arg sha "$SHORT_SHA" \
            '{
              username:"YTIntel Updates",
              embeds:[{
                title:("🚀 YTIntel " + $version + " — " + $release_title),
                description:$summary,
                url:$live,
                color:5763719,
                fields:(
                  [{name:"What changed",value:(if $changes=="" then "Release notes not supplied." else $changes end),inline:false}]
                  + (if $why=="" then [] else [{name:"Why it matters",value:$why,inline:false}] end)
                  + [
                    {name:"Open YTIntel",value:("[Launch the live update]("+$live+")"),inline:false},
                    {name:"Deployment",value:("[GitHub Actions]("+$run+") · `"+$sha+"`"),inline:false}
                  ]
                ),
                footer:{text:"One Discord post per successful YTIntel release"},
                timestamp:(now|todateiso8601)
              }]
            }')"

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$WEBHOOK"

  manual-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send one formatting test
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
        shell: bash
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_YTINTEL_WEBHOOK is not configured."
            exit 1
          fi
          PAYLOAD="$(jq -n --arg live "$LIVE_URL" '{username:"YTIntel Updates",embeds:[{title:"✅ YTIntel release notifications configured",description:"Future releases will send one message containing the actual update log — cancelled/intermediate deploys are ignored.",url:$live,color:5763719,footer:{text:"YTIntel release feed"},timestamp:(now|todateiso8601)}]}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
