name: YTIntel Discord Manual Test

on:
  workflow_dispatch:

permissions:
  contents: read

# Automatic YTIntel release notifications now live inside pages.yml so the
# Discord post happens only after the new app version is successfully live.
# Keep this workflow only as an explicit webhook/manual-preview test.

jobs:
  manual-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send YTIntel Discord test card
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."
            exit 1
          fi
          PAYLOAD="$(jq -n --arg live "$LIVE_URL" '{username:"YTIntel",embeds:[{title:"✨ YTIntel · Notification test",description:("The Discord webhook is connected and ready for automatic post-deployment release notifications.\n\n[**Open YTIntel →**]("+$live+")"),url:$live,color:5763719}]}')"
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$WEBHOOK"
