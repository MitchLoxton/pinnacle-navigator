name: YTIntel Phone Compatibility
on:
  push:
    branches: ["fix/ytintel-phone-0331"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ytintel-phone-0331
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ytintel-phone-0331
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate presentation-only changes
        run: python ytintel/engineering/install_phone0331.py
      - name: Isolate the pending Script Studio for compatibility testing only
        run: |
          git fetch --depth=1 origin 767ad14139794252dc621542faa10eb5f27e63b9
          mkdir -p .phone-studio phone-artifacts
          git archive FETCH_HEAD ytintel/latest/v320-script-studio.js ytintel/latest/v320-script-studio.css ytintel/latest/v320-script-contract.mjs | tar -x -C .phone-studio
      - name: Syntax and existing quality contracts
        run: |
          for file in ytintel/latest/*.js ytintel/latest/*.mjs; do node --check "$file"; done
          node --test ytintel/tests/contract.test.mjs ytintel/tests/brief033.test.mjs
      - name: Install both browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Existing analysis and full-shell regression
        run: |
          node ytintel/tests/browser-smoke.mjs
          node ytintel/tests/full-shell-smoke.mjs
      - name: Phone interaction and layout acceptance - synthetic responses
        run: node ytintel/tests/phone0331-browser.mjs
      - name: Commit tested presentation integration on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ytintel/latest/index.html ytintel/latest/v201-always-on.js ytintel/latest/v300-core-analysis.js ytintel/latest/sw.js ytintel/latest/release.json ytintel/tests/production-v031.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate tested v0.33.1 phone presentation'
            git push origin HEAD:fix/ytintel-phone-0331
          fi
      - name: Capture exact tested source and failure details
        if: always()
        run: |
          mkdir -p phone-artifacts
          cat phone-artifacts/failure.json 2>/dev/null || true
          tar -czf phone-artifacts/source.tgz ytintel/style.css ytintel/latest ytintel/tests ytintel/engineering .phone-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytintel-phone-proof
          path: |
            phone-artifacts
            ytintel-test-proof
          retention-days: 7
