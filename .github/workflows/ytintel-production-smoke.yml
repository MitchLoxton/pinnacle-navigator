name: YTIntel Production Browser Smoke
on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ytintel-production-browser-smoke
  cancel-in-progress: true
jobs:
  signed-out-core:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Real deployed v0.37.6 Analyse regression proof
        shell: bash
        run: |
          mkdir -p ytintel-live-proof
          set +e
          node ytintel/tests/production-v371.mjs > ytintel-live-proof/analyse.log 2>&1
          code=$?
          cat ytintel-live-proof/analyse.log
          exit $code
      - name: Real deployed v0.37.6 shell + Creator Assets proof
        shell: bash
        run: |
          set +e
          node ytintel/tests/production-v372.mjs > ytintel-live-proof/shell.log 2>&1
          code=$?
          cat ytintel-live-proof/shell.log
          exit $code
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-v0376-live-production-proof
          path: ytintel-live-proof
          retention-days: 14
