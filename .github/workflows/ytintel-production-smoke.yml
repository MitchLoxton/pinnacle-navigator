name: YTIntel Production Browser Smoke

on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-out-core:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run signed-out production core smoke
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const url = 'https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/?qa=production-signed-out';
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForFunction(() => window.YTIntelAuth && typeof window.YTIntelAuthDiagnostic === 'function', null, { timeout: 45000 });
              await page.waitForFunction(() => document.documentElement.dataset.ytintelAuth === 'signed-out', null, { timeout: 30000 });
              const diag = await page.evaluate(() => window.YTIntelAuthDiagnostic());
              assert(diag && diag.canonical_client === true, 'canonical auth client not ready');
              assert(diag.signed_in === false, 'fresh production context should be signed out');
              assert(diag.analyse_enabled === true, 'Analyse must remain enabled while signed out');
              assert(diag.stale_auth_error === false, 'stale authentication-required error is visible');
              await page.waitForSelector('#analyseForm #videoUrl', { state: 'visible', timeout: 30000 });
              await page.fill('#videoUrl', 'https://www.youtube.com/watch?v=094y1Z2wpJg');
              await page.click('#analyseForm button');
              await page.waitForFunction(() => {
                const report = (document.querySelector('#report')?.innerText || '').trim();
                const error = (document.querySelector('#error')?.innerText || '').trim();
                return report.length > 250 || error.length > 0;
              }, null, { timeout: 110000 });
              const result = await page.evaluate(() => ({
                report_text: (document.querySelector('#report')?.innerText || '').trim(),
                error_text: (document.querySelector('#error')?.innerText || '').trim(),
                package_disabled: !!document.querySelector('#packageBtn')?.disabled,
                auth_state: document.documentElement.dataset.ytintelAuth || '',
                status: document.querySelector('#status')?.textContent || ''
              }));
              assert(!/sign\s*in|authentication required/i.test(result.error_text), `signed-out Analyse hit auth gate: ${result.error_text}`);
              assert(result.error_text === '', `Analyse production error: ${result.error_text}`);
              assert(result.report_text.length > 250, 'Analyse did not render a substantive production report');
              assert(result.package_disabled === false, 'Packaging button remained disabled after signed-out Analyse');
              assert(result.auth_state === 'signed-out', 'auth state changed unexpectedly during signed-out Analyse');
              await page.screenshot({ path: 'ytintel-signed-out-smoke.png', fullPage: true });
              console.log(JSON.stringify({ pass: true, auth: diag, report_chars: result.report_text.length, status: result.status }, null, 2));
            } catch (e) {
              await page.screenshot({ path: 'ytintel-signed-out-smoke.png', fullPage: true }).catch(() => {});
              throw e;
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-signed-out-production-smoke
          path: ytintel-signed-out-smoke.png
          if-no-files-found: warn
          retention-days: 14
