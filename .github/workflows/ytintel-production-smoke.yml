name: YTIntel Production Browser Smoke

on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-v390:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: ytintel-v390-production-browser-smoke
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Real deployed v0.39 stability + intelligence proof
        run: node ytintel/tests/production-v390.mjs
      - name: Detect release change
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -qx 'ytintel/latest/release.json'; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Send verified YTIntel Discord release
        if: steps.release.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          ICON_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/icon.svg
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."; exit 1; fi
          VERSION="$(jq -r '.version // "v0.39.0"' ytintel/latest/release.json)"
          TITLE="$(jq -r '.title // "Stable intelligence"' ytintel/latest/release.json)"
          SUMMARY="$(jq -r '.summary // "YTIntel stable intelligence release verified live."' ytintel/latest/release.json)"
          BULLETS="$(jq -r '[ (.discord_changes // .changes // [])[] ][0:4] | map("✦ " + .) | join("\n")' ytintel/latest/release.json)"
          PAYLOAD="$(jq -n --arg version "$VERSION" --arg title "$TITLE" --arg summary "$SUMMARY" --arg bullets "$BULLETS" --arg live "$LIVE_URL" --arg icon "$ICON_URL" --arg sha "$(git rev-parse --short HEAD)" '{username:"YTIntel",avatar_url:$icon,content:"🏆 **LIVE + VERIFIED — YTINTEL**",allowed_mentions:{parse:[]},embeds:[{title:("🚀 " + $version + " — " + $title),url:$live,description:($summary + "\n\n" + $bullets + "\n\n✅ **Production browser proof passed**\n\n**[OPEN YTINTEL →](" + $live + ")**"),color:16171850,footer:{text:("✓ LIVE + TESTED  •  build " + $sha)}}]}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
          echo "Verified YTIntel Discord release notification sent."
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-v0390-live-production-proof-${{ github.run_id }}
          path: ytintel-live-proof
          if-no-files-found: warn
          retention-days: 14
