name: YTIntel Production Browser Smoke
on:
  workflow_run:
    workflows: ["Deploy Pinnacle Navigator to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      ytintel: ${{ steps.scope.outputs.ytintel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: scope
        name: Decide whether this deploy needs YTIntel browser proof
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ytintel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "ytintel=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          if git diff --name-only "$BEFORE" HEAD | grep -Eq '^(ytintel/|\.github/workflows/(ytintel-production-smoke|ytintel-v300-ci|pages)\.yml$)'; then
            echo "ytintel=true" >> "$GITHUB_OUTPUT"
          else
            echo "ytintel=false" >> "$GITHUB_OUTPUT"
          fi

  navigation-return:
    needs: scope
    if: needs.scope.outputs.ytintel == 'true'
    concurrency:
      group: ytintel-navigation-return-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Real deployed v0.37.8 leave + return resilience proof
        shell: bash
        run: |
          mkdir -p ytintel-live-proof
          set +e
          node ytintel/tests/production-v378-navigation.mjs > ytintel-live-proof/navigation.log 2>&1
          code=$?
          cat ytintel-live-proof/navigation.log
          exit $code
      - name: Upload navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-v0378-navigation-proof-${{ github.run_id }}
          path: ytintel-live-proof
          retention-days: 14

  signed-out-core:
    needs: scope
    if: needs.scope.outputs.ytintel == 'true'
    concurrency:
      group: ytintel-production-browser-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Real deployed v0.37.8 Analyse regression proof
        shell: bash
        run: |
          mkdir -p ytintel-live-proof
          set +e
          node ytintel/tests/production-v371.mjs > ytintel-live-proof/analyse.log 2>&1
          code=$?
          cat ytintel-live-proof/analyse.log
          exit $code
      - name: Real deployed v0.37.8 shell + Scene Index Creator Assets proof
        shell: bash
        run: |
          set +e
          node ytintel/tests/production-v372.mjs > ytintel-live-proof/shell.log 2>&1
          code=$?
          cat ytintel-live-proof/shell.log
          exit $code
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytintel-v0378-live-production-proof-${{ github.run_id }}
          path: ytintel-live-proof
          retention-days: 14
