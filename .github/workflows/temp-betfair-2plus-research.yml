name: TEMP Betfair 2plus research

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/temp-betfair-2plus-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest research branch
        uses: actions/checkout@v4
        with:
          ref: research/betfair-2plus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests
      - name: Run archived venue-aware sweep
        run: python research/betfair_2plus_fast2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betfair-2plus-final-research
          path: research/output_2plus_fast/
          if-no-files-found: warn
          retention-days: 30
