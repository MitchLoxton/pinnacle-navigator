name: Probe TABtouch race pages
on:
  push:
    branches: [racing-fix-live-source-v16]
    paths: ['.github/workflows/probe-tabtouch.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test public live bridge
        shell: bash
        env:
          SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrbWFja3RjZmh1YnN1bXdyeWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTY4OTQsImV4cCI6MjEwMjAzMjg5NH0.EUZ5Xd6rLsxoZIpfPwVzH-TUcz1t8-j1DVZ6ES8A1zk
        run: |
          echo "::add-mask::$SUPABASE_ANON"
          python - <<'PY'
          import json, os, urllib.request
          url='https://dkmacktcfhubsumwrydw.supabase.co/functions/v1/racing-tab-live'
          payload={"requests":[
              {"race":"PR2","date":"2026-08-29","venue":"Belmont Park"},
              {"race":"SR6","date":"2026-08-29","venue":"Rosehill Gardens"}
          ]}
          token=os.environ['SUPABASE_ANON']
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers={
              'Content-Type':'application/json','apikey':token,'Authorization':'Bearer '+token,
              'Origin':'https://mitchloxton.github.io','User-Agent':'Mozilla/5.0'
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              body=json.loads(r.read().decode())
              print('HTTP',r.status,'SOURCE',body.get('source'))
          assert body.get('ok') is True, body
          results=body.get('results') or []
          assert len(results)==2, results
          for result in results:
              race=result.get('race')
              print('\n',race,'ok=',result.get('ok'),'error=',result.get('error'))
              print('verification=',result.get('verificationMethod'))
              print('favourite=',[(x.get('name'),x.get('price')) for x in result.get('favourites') or []])
              active=[x for x in result.get('runners') or [] if not x.get('scratched')]
              print('active prices=',[(x.get('number'),x.get('name'),x.get('price')) for x in active])
              assert result.get('ok') is True, result
              assert result.get('source')=='TABTOUCH_FIXED_WIN', result
              assert active and all(x.get('price') for x in active), result
              assert result.get('favourites'), result
          PY
