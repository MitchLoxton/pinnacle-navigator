name: Probe TABtouch race pages
on:
  push:
    branches: [racing-fix-live-source-v16]
    paths: ['.github/workflows/probe-tabtouch.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect race market payloads
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html as htmlmod

          def fetch(url):
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml',
                  'Accept-Language':'en-AU,en;q=0.9',
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8','replace')

          for label,url,names in [
              ('PR2','https://www.tabtouch.com.au/racing/2026-08-29/pr/2',['SEPTEMBER BORN','GINNIVAN','MAN CRUSH']),
              ('SR6','https://www.tabtouch.com.au/racing/2026-08-29/sr/6',["SHE'S AN ARTIST",'STREET ARTIST']),
          ]:
              print('\n===== ',label,' =====')
              status,final,b=fetch(url)
              print('STATUS',status,'URL',final,'LEN',len(b))
              upper=b.upper()
              for key in names + ['RACEBETTING','FIXEDPRICE','FIXEDODDS','RETURNWIN','RUNNERS','COMPETITORS','MARKET','ODDS','INITIALDATA','RACEDATA']:
                  pos=upper.find(key.upper())
                  print('\nKEY',key,'POS',pos)
                  if pos>=0:
                      print(b[max(0,pos-1200):min(len(b),pos+3000)])
              print('\n--- LAST 18000 ---')
              print(b[-18000:])

              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',b,re.I)
              print('\nSCRIPT_SRCS',srcs[-15:])
          PY
