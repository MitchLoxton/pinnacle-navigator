name: PROP5D v0.15 fresh 2026 OOS

on:
  workflow_dispatch:
  push:
    branches:
      - research/prop5d-v02-exact-20260828
    paths:
      - .github/workflows/prop5d-v15-2026-oos.yml

jobs:
  mpo-2026-oos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch frozen MPO source
        run: |
          git clone https://github.com/s-k-28/nq-es-trader-5k-payout.git /tmp/mpo
          cd /tmp/mpo
          git checkout 0ee4392d4e11b1ab9a110cc05122f70c3b8af667

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /tmp/mpo/requirements.txt

      - name: Run fresh 2026 out-of-time backtest
        run: |
          cd /tmp/mpo
          python run_multi.py \
            --nq data/mnq_2026_1min.csv \
            --history data/Dataset_NQ_1min_2022_2025.csv \
            --csv /tmp/mpo_2026_trades.csv | tee /tmp/mpo_2026.log
          ls -lh /tmp/mpo_2026_trades.csv
          tail -n 120 /tmp/mpo_2026.log

      - name: Upload 2026 ledger
        uses: actions/upload-artifact@v4
        with:
          name: prop5d-v15-mpo-2026-oos
          path: |
            /tmp/mpo_2026_trades.csv
            /tmp/mpo_2026.log
