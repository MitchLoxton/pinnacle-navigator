name: Post YTIntel Weekly Review to Discord

on:
  push:
    branches: ["main"]
    paths:
      - "operations/ytintel-weekly-reviews/*.md"
      - ".github/workflows/ytintel-weekly-discord.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytintel-weekly-discord
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post review and record receipt
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEEKLY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          FILE=""
          if [ "${{ github.event_name }}" = "push" ]; then
            FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^operations/ytintel-weekly-reviews/20[0-9]{2}-[0-9]{2}-[0-9]{2}\.md$' | tail -n 1 || true)"
          fi
          if [ -z "${FILE:-}" ]; then
            FILE="$(find operations/ytintel-weekly-reviews -maxdepth 1 -type f -name '20??-??-??.md' | sort | tail -n 1)"
          fi

          if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
            echo "::error::No dated YTIntel weekly review file was found."
            exit 1
          fi

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_YTINTEL_WEEKLY_WEBHOOK is not configured for this repository/environment."
            exit 1
          fi

          REVIEW_DATE="$(basename "$FILE" .md)"
          REVIEW_HASH="$(sha256sum "$FILE" | awk '{print $1}')"
          RECEIPT="operations/ytintel-weekly-reviews/.posted/${REVIEW_DATE}.sha"
          REVIEW_NO="$(find operations/ytintel-weekly-reviews -maxdepth 1 -type f -name '20??-??-??.md' | wc -l | tr -d ' ')"

          git fetch origin main --quiet
          OLD_HASH="$(git show "origin/main:${RECEIPT}" 2>/dev/null | tr -d '\r\n' || true)"
          if [ "$OLD_HASH" = "$REVIEW_HASH" ]; then
            echo "Review $REVIEW_DATE was already posted; nothing to do."
            exit 0
          fi

          TITLE="$(head -n 1 "$FILE" | sed 's/^# *//' | cut -c1-150)"
          if [ -z "$TITLE" ]; then
            TITLE="YTIntel Weekly Review - $REVIEW_DATE"
          fi

          PREVIEW="$(python3 -c 'import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip(); print((t[:2197].rstrip()+"...") if len(t)>2200 else t)' "$FILE")"
          URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/${FILE}"

          PAYLOAD="$(jq -n \
            --arg title "$TITLE" \
            --arg description "$PREVIEW" \
            --arg url "$URL" \
            --arg date "$REVIEW_DATE" \
            --arg review_no "$REVIEW_NO" \
            '{
              username:"🏆 YTIntel Progress Bot",
              content:"@everyone 🏆 **WEEKLY WIN UNLOCKED — THE WORK IS BANKED.**",
              allowed_mentions:{parse:["everyone"]},
              embeds:[{
                title:("🏆 REVIEW #" + $review_no + " COMPLETE — " + $title),
                description:(
                  "# YOU SHOWED UP AND DID THE WORK.\n\n" +
                  "This is the part that actually compounds: **work completed, lessons captured, proof archived, momentum kept.** Most people talk about building. You have another week permanently banked.\n\n" +
                  "🔥 **Do not skim past this win. Take it. You earned it.**\n\n" +
                  "────────────────────\n\n" +
                  $description +
                  "\n\n────────────────────\n\n" +
                  "**FULL REVIEW:** Open the attached markdown file or the linked permanent archive."
                ),
                url:$url,
                color:15844367,
                fields:[
                  {
                    name:"⚡ REWARD UNLOCKED",
                    value:"**+1 weekly review completed**\n**+1 proof-of-work entry archived**\n**+1 week of momentum stacked**",
                    inline:true
                  },
                  {
                    name:"✅ STATUS",
                    value:("**Review #" + $review_no + " locked in**\nArchive saved ✅\nDiscord delivered ✅"),
                    inline:true
                  },
                  {
                    name:"🎯 NEXT MISSION",
                    value:"**Beat this week. Ship more. Learn faster. Keep stacking undeniable proof that you are moving forward.**",
                    inline:false
                  }
                ],
                footer:{text:("YTIntel • WORK COMPOUNDS • " + $date)}
              }]
            }')"

          posted=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -F "payload_json=${PAYLOAD}" \
              -F "files[0]=@${FILE};type=text/markdown" \
              "$WEBHOOK"; then
              posted=true
              break
            fi
            echo "Discord attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done

          if [ "$posted" != "true" ]; then
            echo "::error::Weekly review could not be posted after 3 attempts."
            exit 1
          fi

          mkdir -p "$(dirname "$RECEIPT")"
          printf '%s\n' "$REVIEW_HASH" > "$RECEIPT"
          git config user.name "YTIntel Weekly Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT"
          git commit -m "Record YTIntel weekly Discord post $REVIEW_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "YTIntel weekly review posted and receipt recorded."
