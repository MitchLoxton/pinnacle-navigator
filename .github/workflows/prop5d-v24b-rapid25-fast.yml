name: PROP5D v0.24b Rapid25 fast exact

on:
  workflow_dispatch:
  push:
    branches:
      - research/prop5d-v02-exact-20260828
    paths:
      - .github/workflows/prop5d-v24b-rapid25-fast.yml

jobs:
  rapid25-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch frozen MPO source
        run: |
          git clone -q https://github.com/s-k-28/nq-es-trader-5k-payout.git /tmp/mpo
          cd /tmp/mpo
          git checkout -q 0ee4392d4e11b1ab9a110cc05122f70c3b8af667
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r /tmp/mpo/requirements.txt python-dateutil >/dev/null
      - name: Reproduce fresh 2026 only
        run: |
          cd /tmp/mpo
          python run_multi.py --nq data/mnq_2026_1min.csv --history data/Dataset_NQ_1min_2022_2025.csv --csv /tmp/mpo_2026.csv > /tmp/mpo_2026.log 2>&1
          tail -40 /tmp/mpo_2026.log
      - name: Run Rapid25 exact lifecycle using frozen committed historical ledger
        run: |
          python research/prop5d_v24_mffu_rapid25_barpath.py \
            --hist-trades /tmp/mpo/data/trades_backtest_full.csv \
            --hist-bars /tmp/mpo/data/Dataset_NQ_1min_2022_2025.csv \
            --fresh-trades /tmp/mpo_2026.csv \
            --fresh-bars /tmp/mpo/data/mnq_2026_1min.csv \
            --out /tmp/PROP5D_V24B_RAPID25.json | tee /tmp/v24b.log
          cat /tmp/PROP5D_V24B_RAPID25.json
      - uses: actions/upload-artifact@v4
        with:
          name: prop5d-v24b-rapid25-fast
          path: |
            /tmp/PROP5D_V24B_RAPID25.json
            /tmp/v24b.log
            /tmp/mpo_2026.log
