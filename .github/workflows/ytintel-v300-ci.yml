name: YTIntel Core CI
on:
  push:
    branches: ["main"]
    paths:
      - "ytintel/latest/**"
      - "ytintel/tests/**"
      - "ytintel/backend/**"
      - ".github/workflows/ytintel-v300-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Monday Brief integration
        shell: bash
        run: |
          set -euo pipefail
          for file in ytintel/latest/*.js ytintel/latest/*.mjs; do node --check "$file"; done
          node --check ytintel/backend/research-v033.mjs
          node --test ytintel/tests/contract.test.mjs ytintel/tests/brief033.test.mjs
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q "ytintel-shell-v0330" ytintel/latest/sw.js
          grep -q "v330-brief.js" ytintel/latest/v201-always-on.js
          grep -q "v310-deep-research.js" ytintel/latest/v201-always-on.js
          grep -q "v031-integration" ytintel/latest/v300-core-analysis.js
          if grep -q "v300-final-review.js" ytintel/latest/v201-always-on.js; then echo 'Duplicate legacy reviewer must not be loaded'; exit 1; fi
          echo "YTIntel Monday Brief integration and quality contracts passed."
