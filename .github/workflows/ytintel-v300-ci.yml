name: YTIntel Core CI
on:
  push:
    branches: ["main"]
    paths:
      - "ytintel/latest/**"
      - "ytintel/tests/**"
      - "ytintel/backend/**"
      - "ytintel/ENDGAME_BRIEF.md"
      - ".github/workflows/ytintel-v300-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v0.35.0 heart-lock Monday Brief core
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v340-zero-credit.js
          node --check ytintel/latest/v341-quality-core.js
          node --check ytintel/latest/v342-brief-intelligence.js
          node --check ytintel/latest/v350-heart-lock.js
          node --check ytintel/latest/sw.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q "ytintel-shell-v0350" ytintel/latest/sw.js
          grep -q "v350-heart-lock.js?v=0350" ytintel/latest/index.html
          grep -q "v340-zero-credit.css?v=0350" ytintel/latest/index.html
          test "$(grep -o '<script src=' ytintel/latest/index.html | wc -l)" -eq 1
          ! grep -q "v201-always-on.js" ytintel/latest/index.html
          ! grep -q "v310-deep-research.js" ytintel/latest/index.html
          ! grep -q "v291-auth-core.js" ytintel/latest/index.html
          ! grep -q "Smart Start" ytintel/latest/index.html
          ! grep -q "Research Sprint" ytintel/latest/index.html
          grep -q "section(17,'Full transcript'" ytintel/latest/v340-zero-credit.js
          grep -q "cross_segment_overlap_removed" ytintel/latest/v341-quality-core.js
          grep -q "YouTube’s shift toward television viewing" ytintel/latest/v342-brief-intelligence.js
          grep -q "ROADMAP" ytintel/latest/v350-heart-lock.js
          grep -q "Creator DNA" ytintel/latest/v350-heart-lock.js
          grep -q "No fake 10-minute wait" ytintel/latest/v350-heart-lock.js
          grep -q "WHY IT POPPED" ytintel/latest/v350-heart-lock.js
          grep -q "P0 — Heart of the tool" ytintel/ENDGAME_BRIEF.md
          grep -q "research-stage" ytintel/tests/production-v031.mjs
          node --test ytintel/tests/contract.test.mjs ytintel/tests/brief033.test.mjs
          echo "YTIntel v0.35.0 heart-lock contracts passed."
