name: YTIntel Core CI
on:
  push:
    branches: ["main"]
    paths:
      - "ytintel/latest/**"
      - "ytintel/tests/**"
      - "ytintel/backend/**"
      - "ytintel/ENDGAME_BRIEF.md"
      - ".github/workflows/ytintel-v300-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v0.36.1 intelligence-review core
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v340-zero-credit.js
          node --check ytintel/latest/v341-quality-core.js
          node --check ytintel/latest/v342-brief-intelligence.js
          node --check ytintel/latest/v350-heart-lock.js
          node --input-type=module --check < ytintel/latest/v360-entry.js
          node --input-type=module --check < ytintel/latest/v361-capability-guard.js
          node --input-type=module --check < ytintel/latest/v361-review-fixes.js
          node --input-type=module --check < ytintel/latest/v362-source-polish.js
          node --input-type=module --check < ytintel/latest/v360-endgame.js
          node --input-type=module --check < ytintel/latest/v360-local-ai.js
          node --input-type=module --check < ytintel/latest/v360-media-intel.js
          node --input-type=module --check < ytintel/latest/v360-cloud.js
          node --check ytintel/latest/sw.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q "ytintel-shell-v0361" ytintel/latest/sw.js
          grep -q "v360-entry.js?v=0361" ytintel/latest/index.html
          grep -q "v360-endgame.css?v=0361" ytintel/latest/index.html
          test "$(grep -o '<script ' ytintel/latest/index.html | wc -l)" -eq 1
          ! grep -q "v201-always-on.js" ytintel/latest/index.html
          ! grep -q "v310-deep-research.js" ytintel/latest/index.html
          ! grep -q "v291-auth-core.js" ytintel/latest/index.html
          grep -q "SOURCE-SYNTHESIZED WATCH REPLACEMENT" ytintel/latest/v361-review-fixes.js
          grep -q "Sign in before Creator DNA" ytintel/latest/v361-review-fixes.js
          grep -q "DEEP VIDEO ANALYSIS" ytintel/latest/v362-source-polish.js
          grep -q "GROUP VIDEO ANALYSIS" ytintel/latest/v360-endgame.js
          grep -q "WATCHTOWER" ytintel/latest/v360-endgame.js
          grep -q "ytintel_analysis_vault" ytintel/latest/v360-cloud.js
          ! grep -q "research-stage" ytintel/latest/v360-endgame.js
          ! grep -q "ytintel-v093" ytintel/latest/v360-endgame.js
          grep -q "P0 — Heart of the tool" ytintel/ENDGAME_BRIEF.md
          node --test ytintel/tests/contract.test.mjs ytintel/tests/brief033.test.mjs
          echo "YTIntel v0.36.1 intelligence-review contracts passed."
