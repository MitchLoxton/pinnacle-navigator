name: YTIntel Core CI
on:
  push:
    branches: ["main"]
    paths:
      - "ytintel/latest/**"
      - "ytintel/tests/**"
      - "ytintel/backend/**"
      - "ytintel/ENDGAME_BRIEF.md"
      - ".github/workflows/ytintel-v300-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v0.35.1 intelligence repair
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v340-zero-credit.js
          node --check ytintel/latest/v341-quality-core.js
          node --check ytintel/latest/v342-brief-intelligence.js
          node --check ytintel/latest/v350-heart-lock.js
          node --check ytintel/latest/v351-intelligence-repair.js
          node --check ytintel/latest/v310-deep-research.js
          node --check ytintel/latest/v291-auth-core.js
          node --check ytintel/latest/v281-auth-fix.js
          node --check ytintel/latest/sw.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q "ytintel-shell-v0351" ytintel/latest/sw.js
          grep -q "v351-intelligence-repair.js?v=0351" ytintel/latest/index.html
          grep -q "v340-zero-credit.css?v=0351" ytintel/latest/index.html
          grep -q 'id="creatorCard"' ytintel/latest/index.html
          grep -q 'hidden aria-hidden="true"' ytintel/latest/index.html
          test "$(grep -o '<script src=' ytintel/latest/index.html | wc -l)" -eq 1
          ! grep -q "MONDAY BRIEF" ytintel/latest/index.html
          grep -q "analysed video, not Creator DNA" ytintel/latest/v351-intelligence-repair.js
          grep -q "MODEL-REVIEWED WATCH REPLACEMENT" ytintel/latest/v351-intelligence-repair.js
          grep -q "duplicate rolling captions are ignored" ytintel/latest/v351-intelligence-repair.js
          grep -q "Creator DNA" ytintel/latest/v350-heart-lock.js
          grep -q "ROADMAP" ytintel/latest/v350-heart-lock.js
          grep -q "P0 — Heart of the tool" ytintel/ENDGAME_BRIEF.md
          grep -q "research-stage" ytintel/tests/production-v031.mjs
          node --test ytintel/tests/contract.test.mjs ytintel/tests/brief033.test.mjs
          echo "YTIntel v0.35.1 intelligence repair contracts passed."
