name: YTIntel v0.30 Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "ytintel/latest/v300-*.js"
      - "ytintel/latest/v300-*.css"
      - "ytintel/latest/v201-always-on.js"
      - "ytintel/latest/sw.js"
      - "ytintel/latest/release.json"
      - ".github/workflows/ytintel-v300-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v0.30 core
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v300-core-analysis.js
          node --check ytintel/latest/v300-vault-ui.js
          node --check ytintel/latest/v300-visual-pass.js
          node --check ytintel/latest/v201-always-on.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q "ytintel-shell-v0300" ytintel/latest/sw.js
          grep -q "v300-core-analysis.js" ytintel/latest/v201-always-on.js
          grep -q "v300-vault-ui.js" ytintel/latest/v201-always-on.js
          grep -q "v300-visual-pass.js" ytintel/latest/v201-always-on.js
          echo "YTIntel v0.30 core checks passed."
