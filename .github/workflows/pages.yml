name: Deploy Pinnacle Navigator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Discord is deliberately downstream of the live deployment. A failed or
      # cancelled deployment must never announce an update that is not live.
      - name: Detect YTIntel changes since last successful live deploy
        if: github.event_name == 'push'
        id: ytintel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AFTER="${{ github.sha }}"

          # This run is still in progress, so the newest successful pages run is
          # the previous live deployment. Comparing against it also catches YTIntel
          # changes from an intermediate deployment that was cancelled by concurrency.
          BASE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=10" \
            | jq -r '.workflow_runs[0].head_sha // empty')"

          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${AFTER}^" 2>/dev/null || printf '%s' "$AFTER")"
          fi

          FILES="$(git diff --name-only "$BASE" "$AFTER" || true)"
          YT_FILES="$(printf '%s\n' "$FILES" | grep '^ytintel/' || true)"

          if [ -z "$YT_FILES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$YT_FILES" | grep -qx 'ytintel/latest/release.json'; then
            echo "release_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Save the changed paths for the posting step without fighting multiline outputs.
          printf '%s\n' "$YT_FILES" > /tmp/ytintel-changed-files.txt

      - name: Post YTIntel live update to Discord
        if: github.event_name == 'push' && steps.ytintel.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          RELEASE_CHANGED: ${{ steps.ytintel.outputs.release_changed }}
          BASE_SHA: ${{ steps.ytintel.outputs.base }}
          AFTER_SHA: ${{ steps.ytintel.outputs.after }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."
            exit 1
          fi

          VERSION=""
          RELEASE_TITLE=""
          SUMMARY=""
          CHANGES=""

          if [ "$RELEASE_CHANGED" = "true" ] && [ -f ytintel/latest/release.json ]; then
            VERSION="$(jq -r '.version // ""' ytintel/latest/release.json)"
            RELEASE_TITLE="$(jq -r '.title // "New update"' ytintel/latest/release.json)"
            SUMMARY="$(jq -r '.summary // empty' ytintel/latest/release.json)"
            CHANGES="$(jq -r '[.changes[]?][0:5] | map("✦ " + .) | join("\n")' ytintel/latest/release.json)"
          else
            # No hand-written release note is required anymore. Use the latest
            # YTIntel commit plus the actual changed files as a clean fallback.
            YT_COMMIT="$(git log -1 --format='%H' "${BASE_SHA}..${AFTER_SHA}" -- ytintel/ 2>/dev/null || true)"
            if [ -z "$YT_COMMIT" ]; then YT_COMMIT="$AFTER_SHA"; fi
            RELEASE_TITLE="$(git log -1 --format='%s' "$YT_COMMIT")"
            SUMMARY="A new YTIntel update is live."
            CHANGES="$(head -n 5 /tmp/ytintel-changed-files.txt \
              | sed 's#^ytintel/latest/##' \
              | sed 's#^ytintel/##' \
              | sed 's#^#✦ Updated `#' \
              | sed 's#$#`#')"
          fi

          RELEASE_TITLE="${RELEASE_TITLE:0:180}"
          SUMMARY="${SUMMARY:0:420}"
          CHANGES="${CHANGES:0:1500}"

          DESCRIPTION="$SUMMARY"
          if [ -n "$CHANGES" ]; then
            if [ -n "$DESCRIPTION" ]; then DESCRIPTION="$DESCRIPTION\n\n"; fi
            DESCRIPTION="${DESCRIPTION}**What’s new**\n${CHANGES}"
          fi
          DESCRIPTION="${DESCRIPTION}\n\n[**Open YTIntel →**](${LIVE_URL})"

          SHORT_SHA="${AFTER_SHA:0:7}"
          PAYLOAD="$(jq -n \
            --arg version "$VERSION" \
            --arg release_title "$RELEASE_TITLE" \
            --arg description "$DESCRIPTION" \
            --arg live "$LIVE_URL" \
            --arg sha "$SHORT_SHA" \
            '{
              username:"YTIntel",
              embeds:[{
                title:("✨ " + (if $version=="" then "YTIntel" else "YTIntel " + $version end) + " · " + $release_title),
                description:$description,
                url:$live,
                color:5763719,
                footer:{text:("Live deployment · " + $sha)}
              }]
            }')"

          # Retry transient Discord failures instead of silently losing the notification.
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" \
              "$WEBHOOK"; then
              echo "YTIntel Discord notification sent."
              exit 0
            fi
            echo "Discord attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done

          echo "::error::YTIntel deployed successfully, but Discord notification failed after 3 attempts."
          exit 1
