name: Deploy Pinnacle Navigator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect YTIntel files changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then echo "ytintel=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"; AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$AFTER")"; fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^ytintel/'; then echo "ytintel=true" >> "$GITHUB_OUTPUT"; else echo "ytintel=false" >> "$GITHUB_OUTPUT"; fi

      - name: Validate YTIntel v0.38 stable shell
        if: github.event_name != 'push' || steps.changes.outputs.ytintel == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v380-stable-shell.js
          node --check ytintel/latest/v340-zero-credit.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          test "$(grep -o '<script ' ytintel/latest/index.html | wc -l)" -eq 1
          grep -q 'v380-stable-shell.js?v=0380' ytintel/latest/index.html
          grep -q 'v0.38.0' ytintel/latest/index.html
          grep -q "const RELEASE='0.38.0'" ytintel/latest/v380-stable-shell.js
          grep -q 'ytintel-shell-v0380' ytintel/latest/sw.js
          grep -q 'data-tab="analyse"' ytintel/latest/index.html
          grep -q 'data-tab="competitors"' ytintel/latest/index.html
          grep -q 'data-tab="vault"' ytintel/latest/index.html
          grep -q 'id="competitorInput"' ytintel/latest/index.html
          grep -q 'id="vaultList"' ytintel/latest/index.html
          grep -q 'id="saveCreator"' ytintel/latest/index.html
          if grep -q 'v360-entry.js' ytintel/latest/index.html; then echo "Old multi-layer entry returned"; exit 1; fi
          if grep -q '<div class="boot" id="boot"' ytintel/latest/index.html; then echo "Blocking boot overlay returned"; exit 1; fi
          if grep -q '<main class="app" id="app" hidden' ytintel/latest/index.html; then echo "App shell is hidden"; exit 1; fi
          echo "YTIntel v0.38 stable shell validation passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Detect YTIntel release change
        if: github.event_name == 'push'
        id: ytintel
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"; AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$AFTER")"; fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'ytintel/latest/release.json'; then echo "release_changed=true" >> "$GITHUB_OUTPUT"; else echo "release_changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Send YTIntel Discord release
        if: github.event_name == 'push' && steps.ytintel.outputs.release_changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          ICON_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/icon.svg
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."; exit 1; fi
          VERSION="$(jq -r '.version // "v0.38.0"' ytintel/latest/release.json)"
          TITLE="$(jq -r '.title // "Stable single-entry shell"' ytintel/latest/release.json)"
          SUMMARY="$(jq -r '.summary // "YTIntel now boots through one stable shell so navigation stays usable even when a research source fails."' ytintel/latest/release.json)"
          MENTION="$(jq -r '.discord_mention // ""' ytintel/latest/release.json)"
          BULLETS="$(jq -r '[ (.discord_changes // .changes // [])[] ][0:4] | map("✦ " + .) | join("\n")' ytintel/latest/release.json)"
          PAYLOAD="$(jq -n --arg version "$VERSION" --arg title "$TITLE" --arg summary "$SUMMARY" --arg bullets "$BULLETS" --arg live "$LIVE_URL" --arg icon "$ICON_URL" --arg sha "${GITHUB_SHA:0:7}" --arg mention "$MENTION" '{username:"YTIntel",avatar_url:$icon,content:((if $mention=="" then "" else ($mention + " ") end) + "🏆 **SHIP COMPLETE — YTINTEL**"),allowed_mentions:{parse:["users","roles"]},embeds:[{title:("🚀 " + $version + " — " + $title),url:$live,description:($summary + "\n\n" + $bullets + "\n\n**[OPEN YTINTEL →](" + $live + ")**"),color:16171850,footer:{text:("✓ LIVE NOW  •  build " + $sha)}}]}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
          echo "YTIntel Discord release notification sent."