name: Deploy Pinnacle Navigator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect YTIntel files changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then echo "ytintel=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"; AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$AFTER")"; fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^ytintel/'; then echo "ytintel=true" >> "$GITHUB_OUTPUT"; else echo "ytintel=false" >> "$GITHUB_OUTPUT"; fi

      - name: Validate YTIntel v0.39 stable intelligence shell
        if: github.event_name != 'push' || steps.changes.outputs.ytintel == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v390-stable-shell.js
          node --check ytintel/latest/v390-wpm-guard.js
          node --check ytintel/latest/v390-stable-intelligence.js
          node --check ytintel/latest/v340-zero-credit.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          test "$(grep -o '<script ' ytintel/latest/index.html | wc -l)" -eq 1
          grep -q 'v390-stable-shell.js?v=0390' ytintel/latest/index.html
          grep -q 'v0.39.0' ytintel/latest/index.html
          grep -q "const RELEASE='0.39.0'" ytintel/latest/v390-stable-shell.js
          grep -q 'v390-wpm-guard.js?v=0390' ytintel/latest/v390-stable-shell.js
          grep -q 'v390-stable-intelligence.js?v=0390' ytintel/latest/v390-stable-shell.js
          grep -q 'ytintel-shell-v0390' ytintel/latest/sw.js
          grep -q 'data-tab="analyse"' ytintel/latest/index.html
          grep -q 'data-tab="competitors"' ytintel/latest/index.html
          grep -q 'data-tab="vault"' ytintel/latest/index.html
          grep -q 'id="competitorInput"' ytintel/latest/index.html
          grep -q 'id="vaultList"' ytintel/latest/index.html
          grep -q 'id="saveCreator"' ytintel/latest/index.html
          if grep -q 'v360-entry.js' ytintel/latest/index.html; then echo "Old multi-layer entry returned"; exit 1; fi
          if grep -q '<div class="boot" id="boot"' ytintel/latest/index.html; then echo "Blocking boot overlay returned"; exit 1; fi
          if grep -q '<main class="app" id="app" hidden' ytintel/latest/index.html; then echo "App shell is hidden"; exit 1; fi
          if grep -q 'ytintel-v093\|api.openai.com' ytintel/latest/v390-stable-intelligence.js; then echo "Paid model route leaked into zero-credit release"; exit 1; fi
          echo "YTIntel v0.39 stable intelligence validation passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Release notification handoff
        if: github.event_name == 'push' && steps.changes.outputs.ytintel == 'true'
        run: echo "YTIntel deployed. Discord release is intentionally deferred to YTIntel Production Browser Smoke after the live URL passes."
