name: Deploy Pinnacle Navigator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate YTIntel v0.38 owner release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < ytintel/latest/v360-entry.js
          node --input-type=module --check < ytintel/latest/v366-local-ai-shield.js
          node --input-type=module --check < ytintel/latest/v361-capability-guard.js
          node --input-type=module --check < ytintel/latest/v361-review-fixes.js
          node --check ytintel/latest/v371-media-rescue.js
          node --input-type=module --check < ytintel/latest/v360-endgame.js
          node --input-type=module --check < ytintel/latest/v366-local-ai-optin.js
          node --input-type=module --check < ytintel/latest/v362-source-polish.js
          node --input-type=module --check < ytintel/latest/v363-premium-brief.js
          node --input-type=module --check < ytintel/latest/v364-fact-surfaces.js
          node --input-type=module --check < ytintel/latest/v369-packaging-depth.js
          node --input-type=module --check < ytintel/latest/v365-canonical-shell.js
          node --input-type=module --check < ytintel/latest/v367-premium-lock.js
          node --input-type=module --check < ytintel/latest/v370-transcript-receipt.js
          node --check ytintel/latest/v372-analysis-redesign.js
          node --check ytintel/latest/v374-progressive-analysis.js
          node --check ytintel/latest/v373-owner-polish.js
          node --input-type=module --check < ytintel/latest/v360-local-ai.js
          node --input-type=module --check < ytintel/latest/v360-media-intel.js
          node --input-type=module --check < ytintel/latest/v360-cloud.js
          node --check ytintel/tests/production-v370.mjs
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          grep -q '"version": "v0.38.0"' ytintel/latest/release.json
          grep -q 'v360-entry.js?v=0380' ytintel/latest/index.html
          grep -q 'v371-media-rescue.js?v=0380' ytintel/latest/v360-entry.js
          grep -q 'v372-analysis-redesign.js?v=0380' ytintel/latest/v360-entry.js
          grep -q 'v374-progressive-analysis.js?v=0380' ytintel/latest/v360-entry.js
          grep -q 'v373-owner-polish.js?v=0380' ytintel/latest/v360-entry.js
          grep -q 'v371-mobile-containment.css?v=0380' ytintel/latest/index.html
          grep -q 'ytintel-shell-v0380-r2' ytintel/latest/sw.js
          grep -q 'VAULTED TO PACKAGE BANK' ytintel/latest/v372-analysis-redesign.js
          grep -q 'Copy full Markdown for AI' ytintel/latest/v372-analysis-redesign.js
          echo "YTIntel v0.38 owner release validation passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Detect YTIntel release change
        if: github.event_name == 'push'
        id: ytintel
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$AFTER")"; fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'ytintel/latest/release.json'; then echo "release_changed=true" >> "$GITHUB_OUTPUT"; else echo "release_changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Send YTIntel Discord release
        if: github.event_name == 'push' && steps.ytintel.outputs.release_changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          ICON_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/icon.svg
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."; exit 1; fi
          VERSION="$(jq -r '.version // "v0.38.0"' ytintel/latest/release.json)"
          TITLE="$(jq -r '.title // "Owner Analyse rebuild live"' ytintel/latest/release.json)"
          SUMMARY="$(jq -r '.summary // "The YTIntel Analyse rebuild is live."' ytintel/latest/release.json)"
          BULLETS="$(jq -r '[ (.discord_changes // .changes // [])[] ][0:4] | map("✦ " + .) | join("\n")' ytintel/latest/release.json)"
          PAYLOAD="$(jq -n --arg version "$VERSION" --arg title "$TITLE" --arg summary "$SUMMARY" --arg bullets "$BULLETS" --arg live "$LIVE_URL" --arg icon "$ICON_URL" --arg sha "${GITHUB_SHA:0:7}" '{username:"YTIntel",avatar_url:$icon,content:"🏆 **SHIP COMPLETE — YTINTEL ANALYSE REBUILD**",allowed_mentions:{parse:[]},embeds:[{title:("🚀 " + $version + " — " + $title),url:$live,description:($summary + "\n\n" + $bullets + "\n\n**[OPEN YTINTEL →](" + $live + ")**"),color:16171850,footer:{text:("✓ LIVE NOW  •  build " + $sha)}}]}')"
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
          echo "YTIntel Discord release notification sent."
