name: Deploy Pinnacle Navigator to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate YTIntel release
        shell: bash
        run: |
          set -euo pipefail
          node --check ytintel/latest/v201-always-on.js
          node --check ytintel/latest/v220-sync.js
          node --check ytintel/latest/v250-radar-persistence.js
          node --check ytintel/latest/v250-app.js
          node --check ytintel/latest/v281-auth-fix.js
          jq empty ytintel/latest/release.json
          jq empty ytintel/latest/manifest.webmanifest
          echo "YTIntel release validation passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Settle YTIntel release burst
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Multiple files are often committed within one release. Waiting briefly
          # lets GitHub Actions cancel intermediate runs so Discord gets one final card.
          sleep 45

      - name: Detect YTIntel changes
        if: github.event_name == 'push'
        id: ytintel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AFTER="${{ github.sha }}"

          # If a newer YTIntel commit landed while this run was settling, leave the
          # notification to that newer deployment. Non-YTIntel commits do not suppress it.
          git fetch origin main --quiet
          LATEST="$(git rev-parse origin/main)"
          if [ "$LATEST" != "$AFTER" ]; then
            NEWER_YT="$(git diff --name-only "$AFTER" "$LATEST" | grep '^ytintel/' || true)"
            if [ -n "$NEWER_YT" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Newer YTIntel changes exist; skipping intermediate notification."
              exit 0
            fi
          fi

          BASE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=10" \
            | jq -r '.workflow_runs[0].head_sha // empty')"

          if [ -z "$BASE" ] || [ "$BASE" = "$AFTER" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${AFTER}^" 2>/dev/null || printf '%s' "$AFTER")"
          fi

          YT_FILES="$(git diff --name-only "$BASE" "$AFTER" | grep '^ytintel/' || true)"
          if [ -z "$YT_FILES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if git diff --name-only "$BASE" "$AFTER" | grep -qx 'ytintel/latest/release.json'; then
            echo "release_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send rewarding YTIntel Discord release
        if: github.event_name == 'push' && steps.ytintel.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_YTINTEL_WEBHOOK }}
          LIVE_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/
          ICON_URL: https://mitchloxton.github.io/pinnacle-navigator/ytintel/latest/icon.svg
          RELEASE_CHANGED: ${{ steps.ytintel.outputs.release_changed }}
          BASE_SHA: ${{ steps.ytintel.outputs.base }}
          AFTER_SHA: ${{ steps.ytintel.outputs.after }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::DISCORD_YTINTEL_WEBHOOK is not configured."
            exit 1
          fi

          VERSION=""
          TITLE="Update live"
          SUMMARY="A new YTIntel improvement is live."
          BULLETS=""
          WHY="Another piece of YTIntel has moved forward and is live for the next session."
          CHANGE_COUNT="1"

          if [ "$RELEASE_CHANGED" = "true" ] && [ -f ytintel/latest/release.json ]; then
            VERSION="$(jq -r '.version // ""' ytintel/latest/release.json)"
            TITLE="$(jq -r '.title // "Update live"' ytintel/latest/release.json)"
            SUMMARY="$(jq -r '.summary // "A new YTIntel update is live."' ytintel/latest/release.json)"
            WHY="$(jq -r '.why_it_matters // "This release makes YTIntel more useful, faster or clearer for the next creator decision."' ytintel/latest/release.json)"
            CHANGE_COUNT="$(jq -r '(.changes // .discord_changes // []) | length' ytintel/latest/release.json)"
            BULLETS="$(jq -r '
              [(.discord_changes // .changes // [])[]][0:4]
              | map(
                  sub("^Added "; "")
                  | sub("^Updated "; "")
                  | sub("^Rebuilt "; "")
                  | if length > 155 then .[0:152] + "…" else . end
                  | "• " + .
                )
              | join("\n")
            ' ytintel/latest/release.json)"
          else
            YT_COMMIT="$(git log -1 --format='%H' "${BASE_SHA}..${AFTER_SHA}" -- ytintel/ 2>/dev/null || true)"
            if [ -z "$YT_COMMIT" ]; then YT_COMMIT="$AFTER_SHA"; fi
            TITLE="$(git log -1 --format='%s' "$YT_COMMIT" | sed -E 's/^Add YTIntel v[0-9.]+ //; s/^Release YTIntel v[0-9.]+ //')"
            SUMMARY="A new YTIntel improvement has passed deployment and is live now."
            BULLETS="• ${TITLE}"
          fi

          SHORT_SHA="${AFTER_SHA:0:7}"
          TITLE="${TITLE:0:95}"
          SUMMARY="${SUMMARY:0:520}"
          BULLETS="${BULLETS:0:850}"
          WHY="${WHY:0:850}"
          SHIPPED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${AFTER_SHA}"
          VERSION_LABEL="${VERSION:-YTIntel}"

          PAYLOAD="$(jq -n \
            --arg version "$VERSION_LABEL" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            --arg bullets "$BULLETS" \
            --arg why "$WHY" \
            --arg count "$CHANGE_COUNT" \
            --arg live "$LIVE_URL" \
            --arg icon "$ICON_URL" \
            --arg sha "$SHORT_SHA" \
            --arg compare "$COMPARE_URL" \
            --arg shipped "$SHIPPED_AT" \
            '{
              username:"YTIntel • Release Bot",
              avatar_url:$icon,
              content:"@everyone 🚀 **YTINTEL UPDATE SHIPPED**\n🏆 Work shipped. Progress banked. The new build is live.",
              allowed_mentions:{parse:["everyone"]},
              embeds:[{
                author:{name:"YTIntel • Creator Intelligence OS",icon_url:$icon,url:$live},
                title:("🏆 " + $version + " — " + $title),
                url:$live,
                description:(
                  "**SHIP COMPLETE.** Another real upgrade is out of the backlog and into the product.\n\n"
                  + $summary
                  + "\n\n**[OPEN THE NEW BUILD →](" + $live + ")**"
                ),
                color:16729432,
                thumbnail:{url:$icon},
                fields:[
                  {name:"✨ WHAT JUST GOT BETTER",value:(if $bullets=="" then "• A new YTIntel improvement is live." else $bullets end),inline:false},
                  {name:"💎 WHY THIS MATTERS",value:$why,inline:false},
                  {name:"✅ RELEASE STATUS",value:"`✓` Validation passed\n`✓` GitHub Pages deployed\n`✓` Live build available\n`✓` Discord ship receipt sent",inline:true},
                  {name:"🔥 MOMENTUM",value:($count + " improvements in this release\nBuild `" + $sha + "` is live\n**Keep stacking wins.**"),inline:true},
                  {name:"🧾 BUILD RECEIPT",value:("[View code changes →](" + $compare + ")\n[Open YTIntel →](" + $live + ")"),inline:false}
                ],
                footer:{text:("YTIntel • shipped from main • build " + $sha),icon_url:$icon},
                timestamp:$shipped
              }]
            }')"

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" \
              "$WEBHOOK"; then
              echo "YTIntel rewarding Discord release notification sent."
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "::error::YTIntel deployed, but the rewarding Discord notification failed after 3 attempts."
          exit 1
