name: YTIntel v031 Benchmark Integration
on:
  push:
    branches: ['fix/ytintel-benchmark-031']
    paths:
      - 'ytintel/latest/v310-*'
      - 'ytintel/engineering/**'
      - 'ytintel/tests/**'
      - '.github/workflows/ytintel-v031-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ytintel-v031-integration
  cancel-in-progress: true
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ytintel-benchmark-031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration
        run: python ytintel/engineering/apply_v031.py
      - name: Syntax and regression contracts
        run: |
          node --check ytintel/latest/v300-core-analysis.js
          node --check ytintel/latest/v310-deep-research.js
          node --check ytintel/latest/v310-contract.mjs
          node --check ytintel/latest/v201-always-on.js
          node --check ytintel/latest/sw.js
          node --test ytintel/tests/contract.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser acceptance - fixtures, not live AI proof
        run: node ytintel/tests/browser-smoke.mjs
      - name: Full application mobile shell
        run: node ytintel/tests/full-shell-smoke.mjs
      - name: Commit tested application integration on feature branch only
        run: |
          git config user.name 'YTIntel integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ytintel/latest/v300-core-analysis.js ytintel/latest/v201-always-on.js ytintel/latest/v294-focus-cleanup.js ytintel/latest/v300-vault-ui.js ytintel/latest/sw.js ytintel/latest/index.html ytintel/latest/release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate tested v031 model-quality gates and benchmark UI'
            git push origin HEAD:fix/ytintel-benchmark-031
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytintel-v031-regression-proof
          path: ytintel-test-proof
          retention-days: 14
