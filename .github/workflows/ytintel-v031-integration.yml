name: YTIntel v031 Benchmark Integration
on:
  push:
    branches: ['fix/ytintel-benchmark-031']
    paths:
      - 'ytintel/latest/**'
      - 'ytintel/engineering/**'
      - 'ytintel/tests/**'
      - '.github/workflows/ytintel-v031-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ytintel-v031-integration
  cancel-in-progress: true
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ytintel-benchmark-031
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair stale asynchronous release owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ytintel/latest/v281-auth-fix.js')
          lines=p.read_text().splitlines(keepends=True)
          p.write_text(''.join(line for line in lines if not line.lstrip().startswith("window.YTINTEL_VERSION='0.28.1';const status=")))
          assert "window.YTINTEL_VERSION='0.28.1'" not in p.read_text()
          p=Path('ytintel/latest/v200-universal.js')
          s,n=re.subn(r'^function status\(\).*$', 'function status(){ /* Current research orchestrator owns the status badge. */ }',p.read_text(),flags=re.M)
          assert n==1
          p.write_text(s)
          PY
      - name: Syntax and regression contracts
        run: |
          for file in ytintel/latest/*.js ytintel/latest/*.mjs; do node --check "$file"; done
          grep -q v031-integration ytintel/latest/v300-core-analysis.js
          node --test ytintel/tests/contract.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser acceptance - fixtures, not live AI proof
        run: node ytintel/tests/browser-smoke.mjs
      - name: Full application mobile shell
        run: node ytintel/tests/full-shell-smoke.mjs
      - name: Commit tested release-owner fixes only
        run: |
          git config user.name 'YTIntel integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ytintel/latest/v281-auth-fix.js ytintel/latest/v200-universal.js
          if ! git diff --cached --quiet; then
            git commit -m 'Give the active research orchestrator sole ownership of release status'
            git push origin HEAD:fix/ytintel-benchmark-031
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytintel-v031-regression-proof
          path: ytintel-test-proof
          retention-days: 14
