<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Racing Stats · MITCHELL Racing</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0c1828;--panel2:#101f31;--line:#2d425b;--text:#edf4fb;--muted:#8da2b8;--good:#78f2b5;--bad:#ff9eaa;--warn:#ffc34f;--blue:#8dc8ff}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#07111f,#091521 30%,#07111f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}.shell{width:min(1220px,calc(100% - 24px));margin:0 auto;padding:14px 0 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;background:rgba(7,17,31,.92);backdrop-filter:blur(12px);padding:10px 0 12px;border-bottom:1px solid rgba(70,94,120,.35)}
    .brand span,.section-head span,.hero span{display:block;color:#7f96ae;font-size:9px;font-weight:950;letter-spacing:.1em}.brand strong{display:block;font-size:16px;letter-spacing:.04em;margin-top:2px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{text-decoration:none;border:1px solid #314760;background:#0e1b2b;padding:8px 11px;border-radius:10px;font-size:10px;font-weight:950;color:#b8c9da}.nav a.active{background:#173455;border-color:#4d79a8;color:#fff}
    .hero{margin:18px 0 14px;padding:20px;border:1px solid #36516d;border-radius:18px;background:radial-gradient(circle at top right,rgba(44,96,143,.24),transparent 38%),#0c1928;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.hero h1{font-size:34px;margin:4px 0 5px;letter-spacing:-.03em}.hero p{margin:0;color:#9fb3c8;font-size:12px;line-height:1.55}.hero-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero-kpis div{padding:12px;border-radius:12px;background:#0b1624;border:1px solid #2a4058}.hero-kpis span{font-size:8px;color:#8198af;font-weight:950}.hero-kpis strong{display:block;font-size:17px;margin-top:5px;color:#fff}
    .stats-section{margin:14px 0;padding:15px;border:1px solid #2b4159;background:rgba(11,24,39,.96);border-radius:16px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.section-head h2{font-size:18px;margin:3px 0 0}.section-head p{margin:0;max-width:580px;color:#94a9bf;font-size:10px;line-height:1.45;text-align:right}
    .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:12px;border-radius:12px;background:#101f31;border:1px solid #2d435b;min-height:94px}.metric span{display:block;color:#8096ad;font-size:8px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.metric strong{display:block;font-size:18px;margin-top:6px;line-height:1.15}.metric small{display:block;color:#8498ad;font-size:9px;line-height:1.35;margin-top:5px}.metric.good strong,.good-text{color:var(--good)!important}.metric.bad strong,.bad{color:var(--bad)!important}.metric.warn strong{color:var(--warn)}
    .subcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.subcard{padding:13px;border-radius:12px;background:#0d1a2a;border:1px solid #2c425a}.subcard h3,.mini-title{font-size:11px;margin:0 0 9px;letter-spacing:.04em}.subcard p,.audit-body p,.truth-box p,.source-note{font-size:9px;line-height:1.5;color:#879db3;margin:9px 0 0}.rows{display:grid;gap:0}.rows>div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid rgba(61,83,106,.45);font-size:9px}.rows span{color:#8ea3b8}.rows strong{text-align:right;color:#edf4fb}
    .audit-details{margin-top:10px;border:1px solid #334a63;border-radius:12px;overflow:hidden}.audit-details summary{cursor:pointer;padding:11px 12px;font-size:10px;font-weight:900;background:#101f31}.audit-body{padding:12px}.metric-grid.compact{grid-template-columns:repeat(4,1fr)}
    .candidate-grid,.race-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.candidate,.race-card{border:1px solid #2e465f;background:#0d1a29;border-radius:12px;padding:12px}.candidate>div:first-child span,.race-card span{display:block;color:#7f96ae;font-size:8px;font-weight:950}.candidate>div:first-child strong,.race-card strong{display:block;font-size:14px;margin-top:4px}.candidate-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}.candidate-metrics b{padding:7px 8px;border-radius:8px;background:#122236;font-size:9px}.candidate p,.race-card p{font-size:9px;color:#8fa4b9;line-height:1.45;margin:9px 0 0}.race-card{display:flex;flex-direction:column;gap:5px}.race-card .pill{align-self:flex-start}
    .table-wrap{overflow:auto;border:1px solid #2d435a;border-radius:12px}.table-wrap table{border-collapse:collapse;width:100%;min-width:720px;background:#0b1726}.table-wrap th,.table-wrap td{padding:9px 10px;border-bottom:1px solid rgba(65,88,112,.42);text-align:left;font-size:9px}.table-wrap th{position:sticky;top:0;background:#132439;color:#9eb2c7;font-size:8px;text-transform:uppercase;letter-spacing:.05em}.core-row{background:rgba(25,87,61,.23)}.compare-table table{min-width:760px}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#17283a;border:1px solid #35506c;color:#a9bdcf;font-size:8px;font-weight:950}.good-pill{background:#0d3525;border-color:#2a8058;color:var(--good)}.warn-pill,.wait-pill{background:#33270e;border-color:#735a27;color:var(--warn)}
    .evidence-banner{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:11px;margin-bottom:10px;font-size:9px}.evidence-banner.proxy{background:#33270e;border:1px solid #735a27;color:#ffe1a1}.evidence-banner strong{font-size:10px}.truth-box{margin-top:10px;padding:12px;border-radius:12px;background:#0d2234;border:1px solid #345672}.truth-box strong{font-size:10px;color:#fff}.caveat-list{display:grid;gap:8px}.caveat-list>div{padding:10px 11px;border-radius:10px;background:#111d2d;border:1px solid #2f4359}.caveat-list b{font-size:9px;color:#fff}.caveat-list p{margin:3px 0 0;font-size:9px;line-height:1.45;color:#90a5ba}.empty,.load-error{padding:16px;border-radius:12px;border:1px solid #6b343e;background:#2c171d;color:#ffbcc5;font-size:11px}.load-error strong{font-size:13px}.load-error p{margin:6px 0 0}.footer{display:flex;justify-content:space-between;gap:10px;margin:18px 2px;color:#74899e;font-size:8px}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.subcards{grid-template-columns:1fr}.section-head{display:block}.section-head p{text-align:left;margin-top:5px}.candidate-grid,.race-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.shell{width:min(100% - 14px,1220px)}.top{align-items:flex-start}.nav{justify-content:flex-end}.hero{padding:15px}.hero h1{font-size:28px}.hero-kpis{grid-template-columns:1fr}.metric-grid,.metric-grid.compact{grid-template-columns:1fr 1fr}.metric{min-height:88px}.metric strong{font-size:16px}.candidate-metrics{grid-template-columns:1fr}.stats-section{padding:11px}.footer{display:block}.footer span{display:block;margin-top:4px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span>MITCHELL RACING</span><strong>STATS & AUDIT</strong></div>
      <nav class="nav"><a href="./">LIVE</a><a href="./#hong-kong">HONG KONG</a><a href="./automation.html">AUTO</a><a class="active" href="./stats.html">STATS</a></nav>
    </header>
    <div id="statsRoot"><div class="load-error" style="border-color:#735a27;background:#2a2413;color:#ffe29a"><strong>LOADING STATS…</strong><p>Reading frozen AU V11 performance, current forward data and frozen HK OPTIMAL V4 audit data.</p></div></div>
    <footer class="footer"><span id="updatedLine">Loading source timestamps…</span><span>MITCHELL Racing · Stats & audit</span></footer>
  </main>
  <script src="./stats-dashboard.js?v=5" defer></script>
</body>
</html>
