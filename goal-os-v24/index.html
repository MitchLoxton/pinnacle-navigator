<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060907"><title>Goal OS V24</title><style>html,body{margin:0;background:#060907;color:#f4f7f3;font-family:system-ui}#l{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}b{color:#d8ff4f}</style></head><body><div id="l"><div><b>Opening Goal OS V24…</b><p>Building today’s plan.</p></div></div><script>(async()=>{try{const names=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('l').innerHTML='<div><b>Could not open Goal OS.</b><p>Refresh once.</p></div>'}})();</script></body></html>
