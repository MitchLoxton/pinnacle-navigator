<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal OS V22</title><style>html,body{margin:0;background:#050806;color:#f3f7f2;font-family:system-ui}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.lime{color:#d5ff4f}</style></head><body><div id="loading"><div><h2 class="lime">Opening Goal OS V22…</h2><p>Loading your full life blueprint.</p></div></div><script>(async()=>{try{const files=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><h2 class="lime">Goal OS could not open.</h2><p>Refresh once.</p></div>'}})();</script></body></html>
